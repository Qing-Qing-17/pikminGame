/* takenNumbers 的格式是 { 小隊: { 情境號碼: 抽走它的玩家 id } }。
   記名而不是只記號碼，才能判斷「這張是不是我抽的」——重整頁面後可以還原自己的號碼，
   也才能在寫入後驗證自己的認領有沒有被別人蓋掉。舊格式是純號碼陣列，這裡一併相容。 */
function normalizeTaken(taken) {
  const out = {};
  Object.keys(taken || {}).forEach((g) => {
    const v = taken[g];
    if (Array.isArray(v)) { out[g] = {}; v.forEach((n) => { out[g][n] = "?"; }); }
    else if (v && typeof v === "object") { out[g] = { ...v }; }
  });
  return out;
}

/* 遠端讀回來的 state 一律補齊結構再用。少了這層，只要伺服器上那包 JSON 是舊版或不完整，
   畫面就會在存取 storyText[activity] / ttol.profiles 時整頁拋錯。 */
function normalizeState(raw) {
  if (!raw || typeof raw !== "object") return { ...EMPTY_STATE };
  const story = raw.storyText || {};
  const ttol = raw.ttol || {};
  return {
    ...EMPTY_STATE,
    ...raw,
    storyText: {
      star: { ...EMPTY_STATE.storyText.star, ...(story.star || {}) },
      training: { ...EMPTY_STATE.storyText.training, ...(story.training || {}) },
    },
    takenNumbers: normalizeTaken(raw.takenNumbers),
    ttol: {
      phase: ttol.phase === "guessing" ? "guessing" : "writing",
      profiles: ttol.profiles || {},
      guesses: ttol.guesses || {},
    },
  };
}

function loadOrCreateId() {
  const KEY = "pikmin.playerId";
  const fresh = () => `p${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) return saved;
    const id = fresh();
    localStorage.setItem(KEY, id);
    return id;
  } catch (e) { return fresh(); }
}

/* ---------- Firebase Realtime Database（REST + SSE） ----------

   前一版把整包狀態塞進一個公開鍵值儲存（kvdb.io，已停止服務），沒有原子操作，
   所以得靠「讀取－合併－寫入－驗證－重試」加自我修復硬撐併發。改用 RTDB 之後
   這些補丁都不需要了：

   - PATCH 只合併指定欄位，兩個人寫不同路徑不可能互相覆蓋。
   - 每位玩家只寫自己的路徑（profiles/<我>、guesses/<對象>/<我>），零競爭。
   - 搶情境牌用 ETag 條件寫入（if-match），第二個人會收到 412，是真正的原子認領。
   - 用 SSE 即時推播取代輪詢。

   房間樹的結構：
     rooms/<代碼>/session   指揮官擁有的流程狀態
     rooms/<代碼>/cards     任務卡
     rooms/<代碼>/taken/<小隊>/<號碼>      = 認領者的玩家 id
     rooms/<代碼>/profiles/<玩家 id>        = 情報（不含答案）
     rooms/<代碼>/guesses/<對象>/<判讀者>   = { attempts, pick, result }
*/

/* ↓↓↓ 把 Firebase 的 Realtime Database 網址貼在這裡 ↓↓↓
   長得像 https://專案名-default-rtdb.asia-southeast1.firebasedatabase.app
   用 REST 不需要 API key，只要這一個網址。留空的話會進入單機模式。 */
const FIREBASE_DB_URL = "";
/* ↑↑↑ 取得方式見 README 的〈設定 Firebase〉 ↑↑↑ */

function dbConfigured() { return /^https?:\/\//.test(String(FIREBASE_DB_URL || "")); }

/* 倒數是用「結束時刻」在各裝置本地換算的，每支手機的系統時鐘一有偏差，看到的剩餘秒數
   就不一樣（差幾分鐘的手機並不罕見）。以指揮官的時鐘為共同基準：他每次寫入都蓋上時戳，
   玩家用它推算偏移量。取樣一定低估——狀態是先被寫入、稍後才推播到玩家——所以取歷次
   觀察到的最大值最接近真值。 */
let hostClockOffset = 0;
let haveHostSample = false;
let lastHostStamp = 0;
function noteHostTime(stamp) {
  if (!stamp || stamp === lastHostStamp) return;
  lastHostStamp = stamp;
  const candidate = stamp - Date.now();
  if (!haveHostSample || candidate > hostClockOffset) { hostClockOffset = candidate; haveHostSample = true; }
}
function now() { return Date.now() + hostClockOffset; }

/* 網址可能自帶查詢字串（測試用的本地模擬器需要 ?ns=），所以要保留它 */
function dbUrl(path, extraQuery) {
  const raw = String(FIREBASE_DB_URL || "");
  const q = raw.indexOf("?");
  const origin = (q >= 0 ? raw.slice(0, q) : raw).replace(/\/+$/, "");
  const carried = q >= 0 ? raw.slice(q + 1) : "";
  const qs = [carried, extraQuery].filter(Boolean).join("&");
  return `${origin}/${path}.json${qs ? "?" + qs : ""}`;
}

/* Firebase 會把鍵值為連續整數的物件回成陣列（中間沒有的位置是 null）。
   我們的小隊與情境號碼都是數字，所以每次讀取都要正規化回物件。 */
function fbMap(v) {
  if (v === null || v === undefined) return {};
  if (Array.isArray(v)) {
    const out = {};
    v.forEach((item, i) => { if (item !== null && item !== undefined) out[String(i)] = item; });
    return out;
  }
  return typeof v === "object" ? v : {};
}

async function dbGet(path) {
  if (!dbConfigured()) return { status: "error", value: null };
  try {
    const res = await fetch(dbUrl(path));
    if (!res.ok) return { status: "error", value: null };
    const value = await res.json();
    return { status: value === null ? "missing" : "ok", value };
  } catch (e) { return { status: "error", value: null }; }
}

async function dbPut(path, value) {
  if (!dbConfigured()) return false;
  try {
    const res = await fetch(dbUrl(path), {
      method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(value),
    });
    return res.ok;
  } catch (e) { return false; }
}

/* 只更新傳進來的欄位，其餘原封不動——這是取代整包覆寫的關鍵 */
async function dbPatch(path, obj) {
  if (!dbConfigured()) return false;
  try {
    const res = await fetch(dbUrl(path), {
      method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(obj),
    });
    return res.ok;
  } catch (e) { return false; }
}

/* 原子認領：只有在該位置目前是空的時候才寫得進去。
   先取得 ETag，再用 if-match 寫入；別人搶先一步時伺服器回 412。 */
async function dbClaim(path, value) {
  if (!dbConfigured()) return "error";
  try {
    const head = await fetch(dbUrl(path), { headers: { "X-Firebase-ETag": "true" } });
    if (!head.ok) return "error";
    const etag = head.headers.get("etag");
    const current = await head.json();
    if (current !== null && current !== undefined) return current === value ? "won" : "taken";
    if (!etag) return "error"; // 讀不到 ETag 就不能保證原子性，交給呼叫端重試
    const res = await fetch(dbUrl(path), {
      method: "PUT",
      headers: { "content-type": "application/json", "if-match": etag },
      body: JSON.stringify(value),
    });
    if (res.status === 412) return "taken";
    return res.ok ? "won" : "error";
  } catch (e) { return "error"; }
}

/* 即時訂閱一整棵子樹。Firebase 以 SSE 推送 put（整段取代）與 patch（部分合併），
   我們在本地維護一份鏡像，每次變動就把整棵樹交給呼叫端。 */
function setIn(tree, path, data) {
  const parts = String(path || "/").split("/").filter(Boolean);
  if (parts.length === 0) return data;
  const root = (tree && typeof tree === "object") ? (Array.isArray(tree) ? [...tree] : { ...tree }) : {};
  let node = root;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    const child = node[k];
    node[k] = (child && typeof child === "object") ? (Array.isArray(child) ? [...child] : { ...child }) : {};
    node = node[k];
  }
  const last = parts[parts.length - 1];
  if (data === null || data === undefined) delete node[last];
  else node[last] = data;
  return root;
}

function dbStream(path, onTree, onError) {
  if (!dbConfigured() || typeof EventSource === "undefined") return () => {};
  let tree = null;
  let closed = false;
  const es = new EventSource(dbUrl(path));

  const handle = (isPatch) => (ev) => {
    if (closed) return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg) return;
    if (isPatch) {
      // patch 的 data 是「這個路徑底下要合併的鍵值」
      Object.keys(msg.data || {}).forEach((k) => {
        tree = setIn(tree, `${msg.path === "/" ? "" : msg.path}/${k}`, msg.data[k]);
      });
    } else {
      tree = setIn(tree, msg.path, msg.data);
    }
    onTree(tree);
  };

  es.addEventListener("put", handle(false));
  es.addEventListener("patch", handle(true));
  es.addEventListener("cancel", () => { if (onError) onError("cancel"); });
  es.onerror = () => { if (!closed && onError) onError("network"); };

  return () => { closed = true; try { es.close(); } catch (e) {} };
}

async function dbReachable() {
  if (!dbConfigured()) return false;
  const r = await dbGet(".info/serverTimeOffset");
  return r.status !== "error";
}

/* 房間代碼由用戶端產生。刻意避開容易看錯的字（0/O、1/I/L），
   六碼在現場念出來或打進手機都還算輕鬆——比先前那串隨機 bucket id 好得多。 */
const ROOM_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newRoomCode() {
  let s = "";
  for (let i = 0; i < 6; i++) s += ROOM_ALPHABET[Math.floor(Math.random() * ROOM_ALPHABET.length)];
  return s;
}

async function createRoom(attempts = 5) {
  if (!dbConfigured()) return null;
  for (let i = 0; i < attempts; i++) {
    const code = newRoomCode();
    const existing = await dbGet(`rooms/${code}/session`);
    if (existing.status === "error") return null;
    if (existing.status === "missing") {
      const ok = await dbPut(`rooms/${code}/session`, { createdAt: Date.now() });
      return ok ? code : null;
    }
  }
  return null;
}

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function useRemainingSeconds(state) {
  const [, setTick] = useState(0);
  useEffect(() => {
    if (!state.timerRunning) return;
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [state.timerRunning]);
  if (state.timerRunning && state.timerEndsAt) return Math.max(0, Math.round((state.timerEndsAt - now()) / 1000));
  return state.timerConfig;
}
function nextStage(activity, current) {
  const flow = STAGE_FLOW[activity];
  const idx = flow.indexOf(current);
  return flow[Math.min(idx + 1, flow.length - 1)];
}
function prevStage(activity, current) {
  const flow = STAGE_FLOW[activity];
  const idx = flow.indexOf(current);
  return flow[Math.max(idx - 1, 0)];
}
function isFirstStage(activity, current) { return STAGE_FLOW[activity].indexOf(current) <= 0; }

function CellHostView({ state, pushState, activity }) {
  const [audioName, setAudioName] = useState("");
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);
  const fileInputRef = useRef(null);
  const timeUpHandled = useRef(false);
  const remaining = useRemainingSeconds(state);

  useEffect(() => {
    if (state.timerRunning && remaining <= 0 && !timeUpHandled.current) {
      timeUpHandled.current = true;
      pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: 0 });
    }
    if (!state.timerRunning) timeUpHandled.current = false;
  }, [remaining, state.timerRunning]); // eslint-disable-line react-hooks/exhaustive-deps

  function adjustTarget(delta) { pushState({ ...state, cellTarget: Math.min(30, Math.max(2, state.cellTarget + delta)) }); }
  function randomizeTarget() { pushState({ ...state, cellTarget: 2 + Math.floor(Math.random() * 7) }); }
  function setPreset(seconds) { if (!state.timerRunning) pushState({ ...state, timerConfig: seconds, timerEndsAt: null }); }
  function startTimer() { pushState({ ...state, timerRunning: true, timerEndsAt: now() + (state.timerConfig || 1) * 1000 }); }
  function pauseTimer() {
    const rem = state.timerEndsAt ? Math.max(0, Math.round((state.timerEndsAt - now()) / 1000)) : state.timerConfig;
    pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: rem });
  }
  function resetTimer() { pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: DEFAULT_TIMER }); }

  function handleFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setAudioName(f.name);
    if (audioRef.current) audioRef.current.src = URL.createObjectURL(f);
    setPlaying(false);
  }
  function toggleMusic() {
    if (!audioRef.current || !audioRef.current.src) { fileInputRef.current && fileInputRef.current.click(); return; }
    if (playing) { audioRef.current.pause(); setPlaying(false); }
    else { audioRef.current.play(); setPlaying(true); }
  }

  const timeUp = !state.timerRunning && state.timerConfig === 0;

  return (
    <div>
      <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
        這個畫面只給指揮官自己看／投影用，不需要皮克敏連線。實際的集合行動在現場真人進行，這裡負責顯示目前需要的皮克敏數量、倒數計時與音樂。

      <div className="rounded-2xl p-5 mb-5 text-center" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
        <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.inkSoft }}>目前需要集合的皮克敏數量</div>
        <div className="flex items-center justify-center gap-4 mb-3">
          <button onClick={() => adjustTarget(-1)} aria-label="集合人數減一" className="w-10 h-10 rounded-full text-xl font-bold" style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}>−</button>
          <span className="text-6xl font-black w-24" style={{ color: COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>{state.cellTarget}</span>
          <button onClick={() => adjustTarget(1)} aria-label="集合人數加一" className="w-10 h-10 rounded-full text-xl font-bold" style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}>＋</button>

function GroupProgress({ takenNumbers, totalGroups, poolSize }) {
  const groups = Array.from({ length: totalGroups }, (_, i) => i + 1);

        <Icon name="Users" size={13} /> 各小隊抽取進度（不會顯示是誰抽了哪個情境）
      </div>

        {groups.map((g) => {
          const count = Object.keys((takenNumbers && takenNumbers[g]) || {}).length;

function BarHostView({ cards, state, pushState, pushCards }) {
  const [mode, setMode] = useState("game");
  const [flipping, setFlipping] = useState(false);
  const currentCard = state.cardId ? cards.find((c) => c.id === state.cardId) || null : null;
  const poolSize = currentCard ? currentCard.scenarios.filter((s) => s && s.trim()).length : 8;

  /* 翻牌動畫是純視覺效果，用本地 flipping 做就好；原本為了動畫而連寫兩次遠端狀態，
     等於多開一個會覆蓋玩家資料的時間窗。抽新卡本來就要清空該輪的認領，所以明確重置。 */
  async function drawCard() {
    if (cards.length === 0) return;
    const pick = cards[Math.floor(Math.random() * cards.length)].id;
    setFlipping(true);
    await pushState({ ...state, cardId: pick, cardRevealed: true, takenNumbers: {} }, { resetPlayerData: true });
    setTimeout(() => setFlipping(false), 60);
  }
  function resetDraw() { pushState({ ...state, cardId: null, cardRevealed: false, takenNumbers: {} }, { resetPlayerData: true }); }
  function addCard() {
    const id = `c${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    pushCards([...cards, { id, line: "新的一句話", scenarios: Array(8).fill("") }]);
  }
  function updateLine(idx, val) { pushCards(cards.map((c, i) => (i === idx ? { ...c, line: val } : c)), { debounce: true }); }
  function updateScenario(idx, sceneIdx, val) { pushCards(cards.map((c, i) => (i === idx ? { ...c, scenarios: c.scenarios.map((s, j) => (j === sceneIdx ? val : s)) } : c)), { debounce: true }); }
  function deleteCard(idx) { pushCards(cards.filter((_, i) => i !== idx)); }

  return (
    <>
      <div className="flex justify-end mb-4">
        <button onClick={() => setMode(mode === "game" ? "edit" : "game")} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full transition-colors" style={{ color: mode === "edit" ? COLORS.bg : COLORS.inkSoft, background: mode === "edit" ? COLORS.yellow : "transparent", border: `1px solid ${mode === "edit" ? COLORS.yellow : COLORS.blue}` }}>
          <Icon name="Settings2" size={14} /> {mode === "edit" ? "回到遊戲" : "編輯任務卡"}
        </button>
      </div>

      {mode === "game" ? (
        <>
          <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
            抽出任務卡後會列出卡片上全部的偽裝情境，交給皮克敏在自己的頁面抽情境牌。目前任務卡池共 {cards.length} 張：{cards.map((c) => c.line).join("、") || "（無）"}
          </p>

          <div className="flex justify-center mb-6">
            <FlipCard label="任務卡 · 暗號" faceLabel="題" revealed={state.cardRevealed && !flipping} accent={COLORS.red} small>
              {currentCard && <span className="text-2xl font-black leading-snug" style={{ color: "#241A14", fontFamily: "'Noto Serif TC', serif" }}>「{currentCard.line}」</span>}
            </FlipCard>
          </div>

          <div className="flex flex-wrap gap-3 justify-center mb-8">
            <button onClick={drawCard} disabled={cards.length === 0} className="flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.red, color: "#FFFFFF" }}>
              <Icon name="Shuffle" size={16} /> 抽任務卡
            </button>
            <button onClick={resetDraw} className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}>
              <Icon name="RotateCcw" size={14} /> 重置
            </button>
          </div>

          {currentCard && (
            <div className="mb-8">
              <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>全部偽裝情境（共 {poolSize} 種，指揮官不會看到誰抽到哪個）</div>
              <SituationList scenarios={currentCard.scenarios} activeNumber={null} />
            </div>
          )}

          <GroupProgress takenNumbers={state.takenNumbers} totalGroups={state.totalGroups} poolSize={poolSize} />
        </>
      ) : (
        <div className="space-y-5">
          <p className="text-sm" style={{ color: COLORS.inkSoft }}>每張任務卡包含皮克敏要喊出的暗號，以及對應情境牌 1–8 號的偽裝情境描述。編輯後會同步給皮克敏。</p>
          {cards.map((card, idx) => (
            <div key={card.id} className="rounded-2xl p-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
              <div className="flex items-center gap-2 mb-3">
                <span className="text-xs shrink-0" style={{ color: COLORS.inkSoft }}>暗號</span>
                <input value={card.line} onChange={(e) => updateLine(idx, e.target.value)} aria-label="皮克敏要喊出的暗號" placeholder="皮克敏要喊出的暗號" className="flex-1 px-3 py-2 rounded-lg text-sm font-bold outline-none" style={{ background: COLORS.cardFace, color: "#241A14", fontFamily: "'Noto Serif TC', serif" }} />
                <button onClick={() => deleteCard(idx)} aria-label="刪除這張任務卡" title="刪除這張任務卡" style={{ color: COLORS.red }}><Icon name="Trash2" size={18} /></button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {card.scenarios.map((s, si) => (
                  <div key={si} className="flex items-center gap-2">
                    <span className="w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold shrink-0" style={{ background: COLORS.yellow, color: "#241A14" }}>{si + 1}</span>
                    <input value={s} onChange={(e) => updateScenario(idx, si, e.target.value)} aria-label={`第 ${si + 1} 號偽裝情境描述`} placeholder={`第 ${si + 1} 號偽裝情境描述`} className="flex-1 px-2.5 py-1.5 rounded-lg text-xs outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
                  </div>
                ))}
              </div>
            </div>
          ))}
          <button onClick={addCard} className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-bold w-full justify-center" style={{ border: `1px dashed ${COLORS.yellow}`, color: COLORS.amber }}>
            <Icon name="Plus" size={16} /> 新增任務卡
          </button>
        </div>
      )}
    </>
  );
}

function BarPlayerView({ cards, state, claimScenario, myGroup, myId }) {
  const [drawing, setDrawing] = useState(false);
  const [noneLeft, setNoneLeft] = useState(false);
  const [failed, setFailed] = useState(false);
  const [flipping, setFlipping] = useState(false);
  const currentCard = state.cardId ? cards.find((c) => c.id === state.cardId) || null : null;
  const groupKey = String(myGroup || "solo");
  const takenForGroup = (state.takenNumbers && state.takenNumbers[groupKey]) || {};
  // 只把真的填了字的情境放進抽牌池，免得指揮官沒填完就有人抽到「（尚未填寫）」
  const pool = useMemo(
    () => (currentCard ? currentCard.scenarios.map((s, i) => (s && s.trim() ? i + 1 : 0)).filter(Boolean) : []),
    [currentCard]
  );
  const poolSize = pool.length;

  /* 自己的號碼是從共用狀態裡「哪一個號碼登記在我名下」推導出來的，不是本地暫存，
     所以重新整理頁面之後仍然找得回來，也不會因此多抽走一個號碼。 */
  const myNumber = useMemo(() => {
    const hit = Object.keys(takenForGroup).find((n) => takenForGroup[n] === myId);
    return hit ? Number(hit) : null;
  }, [takenForGroup, myId]);

  useEffect(() => {
    setNoneLeft(false); setFailed(false);
    if (!state.cardId) return;
    setFlipping(true);
    const t = setTimeout(() => setFlipping(false), 80);
    return () => clearTimeout(t);
  }, [state.cardId]);

  async function drawNumber() {
    if (!currentCard || myNumber !== null || drawing) return;
    setDrawing(true); setNoneLeft(false); setFailed(false);
    const { full, failed: err } = await claimScenario(groupKey, pool);
    setDrawing(false);
    if (err) setFailed(true);
    else if (full) setNoneLeft(true);
  }

  return (
    <>
      {myGroup && (
        <div className="text-center mb-4">
          <span className="inline-block px-3 py-1 rounded-full text-xs font-bold" style={{ background: COLORS.panel, color: COLORS.pink, border: `1px solid ${COLORS.pink}` }}>你的小隊：第 {myGroup} 小隊</span>
        </div>
      )}
      <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
        {currentCard ? "指揮官已抽出任務卡，換你抽情境牌——結果只有你看得到，別讓同小隊的人知道！" : "等待指揮官抽出任務卡…（畫面會自動同步，請稍候）"}
      </p>

      <div className="flex justify-center mb-6">
        <FlipCard label="任務卡 · 暗號" faceLabel="題" revealed={!!currentCard && state.cardRevealed && !flipping} accent={COLORS.red} small>
          {currentCard && <span className="text-2xl font-black leading-snug" style={{ color: "#241A14", fontFamily: "'Noto Serif TC', serif" }}>「{currentCard.line}」</span>}
        </FlipCard>
      </div>

      <div className="flex flex-col items-center gap-2 mb-8">
        <button onClick={drawNumber} disabled={!currentCard || myNumber !== null || noneLeft || drawing || poolSize === 0} className="flex items-center gap-2 px-6 py-2.5 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.yellow, color: "#241A14" }}>
          <Icon name="Shuffle" size={16} /> {drawing ? "抽牌中…" : (myNumber !== null ? "已抽過（本輪只能抽一次）" : "抽情境牌")}
        </button>
        {!currentCard && <span className="text-xs" style={{ color: COLORS.inkSoft }}>指揮官抽出任務卡後即可使用</span>}
        {currentCard && poolSize === 0 && <span className="text-xs" style={{ color: COLORS.red }}>這張任務卡還沒有填寫任何情境，請指揮官先編輯。</span>}
        {noneLeft && <span className="text-xs" style={{ color: COLORS.red }}>本小隊 {poolSize} 種情境已經被抽完了</span>}
        {failed && <span className="text-xs" style={{ color: COLORS.red }}>同步失敗，沒有抽到牌，請確認網路後再按一次。</span>}
        {myNumber !== null && <span className="text-3xl font-black mt-2" style={{ color: COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>第 {myNumber} 號（只有你看得到）</span>}
      </div>

      {currentCard && (
        <div>
          <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>全部偽裝情境（共 {poolSize} 種，你的那項會反白，其他人看不到）</div>
          <SituationList scenarios={currentCard.scenarios} activeNumber={myNumber} />
        </div>
      )}
    </>
  );
}

/* ---------- 情報交換 ---------- */
function TtolHostView({ state, pushState }) {
  const ttol = state.ttol || EMPTY_STATE.ttol;
  const profiles = Object.entries(ttol.profiles || {});
  const byGroup = {};
  profiles.forEach(([id, p]) => { (byGroup[p.group] = byGroup[p.group] || []).push({ id, ...p }); });

  function startGuessing() { pushState({ ...state, ttol: { ...ttol, phase: "guessing" } }); }
  function finishTtol() { pushState({ ...state, stage: nextStage(state.activity, "ttol") }); }

  function tallyFor(id) {
    const g = (ttol.guesses && ttol.guesses[id]) || {};
    const vals = Object.values(g);
    return {
      correct: vals.filter((v) => v.result === "correct").length,
      wrong: vals.filter((v) => v.result === "wrong").length,
      // 已送出但對方的裝置還沒比對答案
      waiting: vals.filter((v) => v.result === null || v.result === undefined).length,
    };
  }

  return (
    <div>
      <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
        每個人先在自己手機上填寫情報並提交，全部人（或大部分人）填完後按下方按鈕開始「情報判讀」環節——大家會同時在自己手機上，各自判讀自己小隊內其他每一位夥伴，不用輪流等待。
      </p>

      <div className="rounded-2xl p-4 mb-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
        <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.inkSoft }}>已提交名單（依小隊）</div>
        {Object.keys(byGroup).length === 0 && <div className="text-xs" style={{ color: COLORS.inkSoft, opacity: 0.7 }}>目前還沒有人提交。</div>}
        {Object.entries(byGroup).map(([g, list]) => (
          <div key={g} className="mb-2">
            <div className="text-xs font-bold mb-1" style={{ color: COLORS.amber }}>第 {g} 小隊（{list.length} 人）</div>
            <div className="flex flex-wrap gap-1.5">
              {list.map((p) => (
                <span key={p.id} className="text-xs px-2 py-1 rounded-lg" style={{ background: "#EAF6FF", color: COLORS.inkSoft, border: `1px solid ${COLORS.amber}` }}>{p.nickname || p.name}</span>
              ))}
            </div>
          </div>
        ))}
      </div>

      {ttol.phase === "writing" && (
        <button onClick={startGuessing} disabled={profiles.length === 0} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-40 mb-6" style={{ background: COLORS.yellow, color: "#241A14" }}>
          大家自我介紹完了，開始情報判讀
        </button>
      )}

      {ttol.phase === "guessing" && (
        <div className="rounded-2xl p-4 mb-6" style={{ background: COLORS.panel, border: `1px solid ${COLORS.amber}` }}>
          <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.amber }}>情報判讀進度（不會顯示是誰判讀的、選了什麼）</div>
          <div className="space-y-1.5 mb-2">
            {profiles.map(([id, p]) => {
              const t = tallyFor(id);
              return (
                <div key={id} className="flex items-center justify-between text-xs px-3 py-2 rounded-lg" style={{ background: "#EAF6FF", border: `1px solid ${COLORS.blue}` }}>
                  <span style={{ color: COLORS.inkSoft }}>第{p.group}小隊・{p.nickname || p.name}</span>
                  <span>
                    <span style={{ color: COLORS.amber, fontWeight: 700 }}>判讀成功 {t.correct}</span>　
                    <span style={{ color: COLORS.red, fontWeight: 700 }}>判讀失敗 {t.wrong}</span>
                    {t.waiting > 0 && <span className="ml-1" style={{ color: COLORS.inkSoft }}>　待確認 {t.waiting}</span>}
                    {t.wrong > 0 && t.correct === 0 && <span className="ml-1" style={{ color: COLORS.red }}>（目前全員尚未判讀成功）</span>}
                  </span>
                </div>
              );
            })}
          </div>
          <button onClick={finishTtol} className="w-full mt-3 flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm" style={{ border: `1px solid ${COLORS.yellow}`, color: COLORS.amber }}>
            情報交換結束，前往下一關 <Icon name="ChevronRight" size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

function TtolWriteForm({ myGroup, onSubmit }) {
  const [school, setSchool] = useState("");
  const [name, setName] = useState("");
  const [nickname, setNickname] = useState("");
  const [statements, setStatements] = useState(["", "", "", ""]);
  const [lieIndex, setLieIndex] = useState(0);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);

  const canSubmit = school && name && nickname && statements.every((s) => s.trim()) && !sending;

  async function send() {
    if (!canSubmit) return;
    setSending(true); setFailed(false);
    // 注意 lieIndex 是第二個參數，不在 profile 裡：profile 會上傳，答案不會
    const res = await onSubmit({ school, name, nickname, statements, group: myGroup }, lieIndex);
    setSending(false);
    if (!res || !res.ok) setFailed(true);
  }

  return (
    <div>
      <p className="text-sm mb-5" style={{ color: COLORS.inkSoft }}>填寫你的情報，還有四則關於你的事——三則真的、一則是你編出來的假情報，等一下讓同小隊夥伴判讀。</p>
      <div className="space-y-3 mb-4">
        <input value={school} onChange={(e) => setSchool(e.target.value)} aria-label="所屬基地" placeholder="所屬基地" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
        <input value={name} onChange={(e) => setName(e.target.value)} aria-label="代號" placeholder="代號" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
        <input value={nickname} onChange={(e) => setNickname(e.target.value)} aria-label="暱稱" placeholder="暱稱" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
      </div>
      <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>四則情報（點選單選鈕標記哪一則是假的）</div>
      <div className="space-y-2 mb-5">
        {statements.map((s, i) => (
          <div key={i} className="flex items-center gap-2">
            <input type="radio" name="lie" aria-label={`把第 ${i + 1} 則標記為假情報`} checked={lieIndex === i} onChange={() => setLieIndex(i)} />
            <input
              value={s}
              onChange={(e) => setStatements((arr) => arr.map((v, j) => (j === i ? e.target.value : v)))}
              aria-label={`第 ${i + 1} 則情報`} placeholder={`第 ${i + 1} 則情報`}
              className="flex-1 px-3 py-2 rounded-lg text-sm outline-none"
              style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}
            />
          </div>
        ))}
      </div>
      {failed && <div className="text-xs mb-3 text-center" style={{ color: COLORS.red }}>⚠ 沒有提交成功，請確認網路連線後再按一次。</div>}
      <button
        onClick={send}
        disabled={!canSubmit}
        className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-40"
        style={{ background: COLORS.yellow, color: "#241A14" }}
      >
        {sending ? "提交中…" : "提交"}
      </button>
    </div>
  );
}

function TtolLivingRoom({ ttol, myGroup }) {
  const mine = Object.entries(ttol.profiles || {}).filter(([, p]) => p.group === myGroup);
  return (
    <div>
      <p className="text-sm mb-5" style={{ color: COLORS.inkSoft }}>提交完成！輪流自我介紹，介紹完後指揮官會帶大家進入情報判讀環節。</p>
      <div className="space-y-3">
        {mine.map(([id, p]) => (
          <div key={id} className="rounded-2xl p-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
            <div className="text-sm font-bold mb-1" style={{ color: COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>{p.nickname}（{p.name}）</div>
            <div className="text-xs mb-2" style={{ color: COLORS.inkSoft }}>{p.school}</div>
            <div className="space-y-1">
              {p.statements.map((s, i) => (
                <div key={i} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ background: "#EAF6FF", color: COLORS.ink }}>{i + 1}. {s}</div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TtolGuessCard({ target, targetId, myId, ttol, submitGuess }) {
  const myGuess = (ttol.guesses && ttol.guesses[targetId] && ttol.guesses[targetId][myId]) || null;
  const [picked, setPicked] = useState(null);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);
  const locked = myGuess && (myGuess.result === "correct" || myGuess.result === "wrong");
  // 結果留白代表已送出、正在等對方的裝置比對答案
  const awaiting = !!myGuess && (myGuess.result === null || myGuess.result === undefined);

  /* 判讀次數交給 submitGuess 依「遠端最新值」計算，這裡不自己算——
     全隊同時送出時本地那份很可能已經過期。對錯則完全不在這裡判定：
     答案只存在對方的裝置上，我們送出的只是「我猜第幾則」。 */
  async function send() {
    if (picked === null || sending) return;
    setSending(true); setFailed(false);
    const res = await submitGuess(targetId, picked);
    setSending(false);
    if (res && res.ok) setPicked(null);
    else setFailed(true);
  }

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
      <p className="text-sm mb-3"><span style={{ color: COLORS.amber, fontWeight: 700 }}>{target.nickname}</span> <span style={{ color: COLORS.inkSoft }}>的哪一則情報是假的？</span></p>
      <div className="space-y-2 mb-3">
        {target.statements.map((s, i) => (
          <button
            key={i}
            onClick={() => !locked && !awaiting && setPicked(i)}
            disabled={locked || awaiting}
            className="w-full text-left text-sm px-3 py-2.5 rounded-xl"
            style={{ background: picked === i ? COLORS.yellow : COLORS.bg, color: picked === i ? "#241A14" : COLORS.ink, border: `1px solid ${picked === i ? COLORS.yellow : COLORS.blue}` }}
          >
            {i + 1}. {s}
          </button>
        ))}
      </div>
      {!locked && !awaiting && (
        <button onClick={send} disabled={picked === null || sending} className="w-full px-4 py-2 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.red, color: "#FFFFFF" }}>
          {sending ? "送出中…" : (myGuess ? `再判讀一次（第 ${myGuess.attempts + 1} 次）` : "送出第一次判讀")}
        </button>
      )}
      {awaiting && (
        <div className="text-center text-sm" style={{ color: COLORS.inkSoft }}>
          已送出，等待 {target.nickname} 的裝置確認…
          <div className="text-xs mt-1" style={{ opacity: 0.75 }}>（答案只存在對方手機上，請對方保持頁面開啟）</div>
        </div>
      )}
      {myGuess && myGuess.result === "correct" && <div className="text-center text-sm mt-2" style={{ color: COLORS.amber }}>✓ 判讀成功！</div>}
      {myGuess && myGuess.result === "wrong" && <div className="text-center text-sm mt-2" style={{ color: COLORS.red }}>✕ 判讀失敗，兩次機會用完。</div>}
      {myGuess && myGuess.result === "pending" && <div className="text-center text-sm mt-2" style={{ color: COLORS.inkSoft }}>還沒判讀成功，再試一次！</div>}
      {failed && <div className="text-center text-xs mt-2" style={{ color: COLORS.red }}>⚠ 這次判讀沒有送出成功（不算次數），請再按一次送出。</div>}
    </div>
  );
}

function TtolGuessing({ ttol, myGroup, myId, submitGuess }) {
  const targets = Object.entries(ttol.profiles || {}).filter(([id, p]) => p.group === myGroup && id !== myId);

  return (
    <div>
      <p className="text-sm mb-4 text-center" style={{ color: COLORS.inkSoft }}>背對背獨立作答，不能問提示——判讀同小隊每一位夥伴的哪一則情報是假的。你自己的不會出現在這裡。</p>
      {targets.length === 0 && <div className="text-center text-sm py-10" style={{ color: COLORS.inkSoft }}>目前小隊內還沒有其他人可以判讀。</div>}
      {targets.map(([id, p]) => (
        <TtolGuessCard key={id} target={p} targetId={id} myId={myId} ttol={ttol} submitGuess={submitGuess} />
      ))}
    </div>
  );
}

function TtolPlayerView({ state, submitProfile, submitGuess, myGroup, myId }) {
  const ttol = state.ttol || EMPTY_STATE.ttol;
  const submitted = !!(ttol.profiles || {})[myId];

  if (!submitted) return <TtolWriteForm myGroup={myGroup} onSubmit={submitProfile} />;
  if (ttol.phase === "writing") return <TtolLivingRoom ttol={ttol} myGroup={myGroup} />;
  return <TtolGuessing ttol={ttol} myGroup={myGroup} myId={myId} submitGuess={submitGuess} />;
}

/* ---------- App ---------- */
function App() {
  const restored = useRef(loadSession()).current; // 上次已加入的房間（如果有）
  const [role, setRole] = useState(restored ? "player" : "host"); // host | player-join | player
  const [room, setRoom] = useState(null);
  const [roomReal, setRoomReal] = useState(restored ? true : null); // null=尚未確定, true=真的連上同步伺服器, false=連不上（房間代碼無法給人加入）
  const [joinedRoom, setJoinedRoom] = useState(restored ? restored.room : null);
  const [joining, setJoining] = useState(false);
  const [joinError, setJoinError] = useState("");

  const [cards, setCards] = useState(DEFAULT_CARDS);
  const [state, setState] = useState(EMPTY_STATE);
  const [loading, setLoading] = useState(true);
  const [syncOk, setSyncOk] = useState(null);
  const [myGroup, setMyGroup] = useState(null);
  const [editingStory, setEditingStory] = useState(false);
  const [dataRestored, setDataRestored] = useState(false);
  const myIdRef = useRef(loadOrCreateId());

  const activeRoom = role === "player" ? joinedRoom : room;
  // roomReal === false 代表同步後端不可用（未設定或連不上），這時完全不要發網路請求。
  const syncEnabled = !!activeRoom && roomReal !== false;

  /* 讓非同步流程隨時拿得到最新的本地 state，不必把它放進 useCallback 的相依陣列。 */
  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);

  const judgingRef = useRef(false);

  /* 同一台裝置連續發出的寫入不能任其並行：網路抖動會讓較晚發出的先抵達，
     指揮官快速換關卡時整場會退回舊關卡。串成一條佇列確保抵達順序等於操作順序。 */
  const writeChainRef = useRef(Promise.resolve());
  const enqueueWrite = useCallback((fn) => {
    const run = writeChainRef.current.then(fn, fn);
    writeChainRef.current = run.then(() => {}, () => {});
    return run;
  }, []);

  /* 開房間。後端沒設定或連不上時退回單機模式，畫面會明確說明原因。 */
  useEffect(() => {
    if (role !== "host" || room) return;
    let cancelled = false;
    (async () => {
      const code = await createRoom();
      if (cancelled) return;
      if (code) { setRoom(code); setRoomReal(true); }
      else { setRoom(newRoomCode()); setRoomReal(false); }
    })();
    return () => { cancelled = true; };
  }, [role, room]);

  /* 指揮官擁有的流程狀態寫在 session 底下；玩家的資料在別的路徑，
     所以這裡用 PATCH 只送出流程欄位，永遠不可能蓋到玩家的東西。 */
  const pushState = useCallback(async (next, opts = {}) => {
    if (role === "host") next = { ...next, hostTime: Date.now() };
    setState(next);
    if (!syncEnabled) return false;
    const session = {
      activity: next.activity === undefined ? null : next.activity,
      stage: next.stage, cellTarget: next.cellTarget,
      timerConfig: next.timerConfig, timerEndsAt: next.timerEndsAt === undefined ? null : next.timerEndsAt,
      timerRunning: !!next.timerRunning, totalGroups: next.totalGroups,
      storyText: next.storyText, cardId: next.cardId === undefined ? null : next.cardId,
      cardRevealed: !!next.cardRevealed, hostTime: next.hostTime || 0,
      ttolPhase: (next.ttol && next.ttol.phase) || "writing",
    };
    const ok = await enqueueWrite(async () => {
      // 明確要清空該輪玩家資料的動作（抽新任務卡、重置、換活動）才刪除那些子樹
      if (opts.resetPlayerData) {
        await dbPut(`rooms/${activeRoom}/taken`, null);
        if (opts.resetTtol) {
          await dbPut(`rooms/${activeRoom}/profiles`, null);
          await dbPut(`rooms/${activeRoom}/guesses`, null);
        }
      }
      return dbPatch(`rooms/${activeRoom}/session`, session);
    });
    setSyncOk(ok);
    if (ok && role === "host") saveBackup(activeRoom, next);
    return ok;
  }, [role, activeRoom, syncEnabled, enqueueWrite]);

  /* 編輯任務卡時每個按鍵都會呼叫這裡，停止輸入 600ms 後才真的寫出去。 */
  const cardsTimerRef = useRef(null);
  const pushCards = useCallback(async (next, opts = {}) => {
    setCards(next);
    if (!syncEnabled) return false;
    const write = async () => {
      const ok = await dbPut(`rooms/${activeRoom}/cards`, next);
      setSyncOk(ok);
      return ok;
    };
    if (cardsTimerRef.current) { clearTimeout(cardsTimerRef.current); cardsTimerRef.current = null; }
    if (!opts.debounce) return write();
    cardsTimerRef.current = setTimeout(() => { cardsTimerRef.current = null; write(); }, 600);
    return true;
  }, [activeRoom, syncEnabled]);
  useEffect(() => () => { if (cardsTimerRef.current) clearTimeout(cardsTimerRef.current); }, []);

  /* 搶一張情境牌。每個號碼是一個獨立路徑，用 ETag 條件寫入認領：
     別人搶先一步時伺服器回 412，我們就換下一個號碼再試。
     兩個人拿到同一號在結構上不可能發生，不需要事後驗證或補寫。 */
  const claimScenario = useCallback(async (groupKey, pool) => {
    const myId = myIdRef.current;
    const taken = (stateRef.current.takenNumbers && stateRef.current.takenNumbers[groupKey]) || {};
    const mine = Object.keys(taken).find((n) => taken[n] === myId);
    if (mine) return { picked: Number(mine), full: false, failed: false };

    if (!syncEnabled) { // 單機模式：直接改本地狀態
      const free = pool.filter((n) => taken[n] === undefined);
      if (!free.length) return { picked: null, full: true, failed: false };
      const pick = free[Math.floor(Math.random() * free.length)];
      const base = stateRef.current;
      setState({ ...base, takenNumbers: { ...base.takenNumbers, [groupKey]: { ...taken, [pick]: myId } } });
      return { picked: pick, full: false, failed: false };
    }

    const candidates = pool.filter((n) => taken[n] === undefined).sort(() => Math.random() - 0.5);
    let sawError = false;
    for (const n of candidates) {
      const r = await dbClaim(`rooms/${activeRoom}/taken/${groupKey}/${n}`, myId);
      if (r === "won") return { picked: n, full: false, failed: false };
      if (r === "error") { sawError = true; break; }
    }
    if (sawError) return { picked: null, full: false, failed: true };
    return { picked: null, full: true, failed: false };
  }, [activeRoom, syncEnabled]);

  const myLieRef = useRef(null); // 假情報的答案只存在這台裝置，從不上傳
  useEffect(() => { if (activeRoom) myLieRef.current = loadLie(activeRoom); }, [activeRoom]);

  /* 每位玩家只寫自己的路徑，彼此零競爭。 */
  const submitProfile = useCallback(async (profile, lieIndex) => {
    myLieRef.current = lieIndex;
    if (activeRoom) saveLie(activeRoom, lieIndex);
    if (!syncEnabled) {
      const base = stateRef.current;
      setState({ ...base, ttol: { ...base.ttol, profiles: { ...base.ttol.profiles, [myIdRef.current]: profile } } });
      return { ok: true, local: true };
    }
    const ok = await dbPut(`rooms/${activeRoom}/profiles/${myIdRef.current}`, profile);
    setSyncOk(ok);
    return { ok };
  }, [activeRoom, syncEnabled]);

  /* 送出判讀：只寫「我猜第幾則」，對錯留白等對方的裝置比對答案後寫回。
     attempts 只有我自己會改，所以直接依目前值加一即可，不需要防競爭。 */
  const submitGuess = useCallback(async (targetId, pickedIndex) => {
    const myId = myIdRef.current;
    const cur = ((stateRef.current.ttol.guesses || {})[targetId] || {})[myId] || null;
    if (cur && (cur.result === "correct" || cur.result === "wrong")) return { ok: true, skipped: true };
    if (cur && (cur.result === null || cur.result === undefined)) return { ok: true, skipped: true };
    const record = { attempts: (cur ? cur.attempts : 0) + 1, pick: pickedIndex, result: null };
    if (!syncEnabled) {
      const base = stateRef.current;
      const forTarget = { ...(base.ttol.guesses[targetId] || {}), [myId]: record };
      setState({ ...base, ttol: { ...base.ttol, guesses: { ...base.ttol.guesses, [targetId]: forTarget } } });
      return { ok: true, local: true };
    }
    const ok = await dbPatch(`rooms/${activeRoom}/guesses/${targetId}/${myId}`, record);
    setSyncOk(ok);
    return { ok };
  }, [activeRoom, syncEnabled]);

  /* 本人的裝置擔任裁判：把針對自己、還沒判定的猜測比對答案後寫回結果。 */
  const judgeGuesses = useCallback(async (tree) => {
    const myId = myIdRef.current;
    const lie = myLieRef.current;
    if (lie === null || lie === undefined || !syncEnabled) return;
    const mine = fbMap(fbMap(tree.guesses)[myId]);
    for (const judgeId of Object.keys(mine)) {
      const g = mine[judgeId];
      if (!g || typeof g.pick !== "number") continue;
      if (g.result !== null && g.result !== undefined) continue;
      const result = g.pick === lie ? "correct" : (g.attempts >= 2 ? "wrong" : "pending");
      await dbPatch(`rooms/${activeRoom}/guesses/${myId}/${judgeId}`, { result });
    }
  }, [activeRoom, syncEnabled]);

  /* 把房間樹組成畫面用的狀態。所有子樹都要過 fbMap：
     Firebase 會把「鍵值是連續整數」的物件回成陣列。 */
  const treeToState = useCallback((tree) => {
    const t = tree || {};
    const s = (t.session && typeof t.session === "object") ? t.session : {};
    const taken = fbMap(t.taken);
    const normTaken = {};
    Object.keys(taken).forEach((g) => { normTaken[g] = fbMap(taken[g]); });
    const guesses = fbMap(t.guesses);
    const normGuesses = {};
    Object.keys(guesses).forEach((k) => { normGuesses[k] = fbMap(guesses[k]); });
    return normalizeState({
      ...s,
      takenNumbers: normTaken,
      ttol: { phase: s.ttolPhase, profiles: fbMap(t.profiles), guesses: normGuesses },
    });
  }, []);

  /* 即時訂閱整個房間。SSE 取代了原本的輪詢：不再有固定間隔的請求，
     變動由伺服器推過來，也不需要「自己送出的東西被蓋掉就補寫」那套自我修復。 */
  useEffect(() => {
    if (!activeRoom) return;
    if (!syncEnabled) { setLoading(false); setMyGroup(loadGroup(activeRoom)); return; }
    setLoading(true);
    setMyGroup(loadGroup(activeRoom));
    let firstArrived = false;

    const unsubscribe = dbStream(
      `rooms/${activeRoom}`,
      (tree) => {
        if (!firstArrived) { firstArrived = true; setLoading(false); }
        setSyncOk(true);
        const t = tree || {};
        if (role === "player") noteHostTime((t.session || {}).hostTime);
        const cardsFromTree = Array.isArray(t.cards) ? t.cards : (t.cards ? Object.values(t.cards) : null);
        if (cardsFromTree && role === "player") setCards(cardsFromTree);
        setState(treeToState(t));

        /* 房間被清空但遊戲其實正在進行——指揮官從本機備份還原。
           房間沒有存取控制，這是唯一擋得住「整份被刪掉」的辦法。 */
        if (role === "host" && !t.session) {
          const backup = loadBackup(activeRoom);
          if (backup && backup.activity) {
            setDataRestored(true);
            pushState(normalizeState(backup));
          }
        }
        if (role === "player" && !judgingRef.current) {
          judgingRef.current = true;
          Promise.resolve(judgeGuesses(t)).finally(() => { judgingRef.current = false; });
        }
      },
      () => { setSyncOk(false); }
    );

    // SSE 若一直沒送來第一筆資料，至少讓載入畫面退場
    const bail = setTimeout(() => { if (!firstArrived) setLoading(false); }, 8000);
    return () => { clearTimeout(bail); unsubscribe(); };
  }, [role, activeRoom, syncEnabled, treeToState, judgeGuesses, pushState]);

  /* 指揮官自己編輯任務卡時不要被推播蓋掉，所以只在初次載入時取一次。 */
  useEffect(() => {
    if (!syncEnabled || role !== "host") return;
    let cancelled = false;
    (async () => {
      const r = await dbGet(`rooms/${activeRoom}/cards`);
      if (cancelled || r.status !== "ok" || !r.value) return;
      setCards(Array.isArray(r.value) ? r.value : Object.values(r.value));
    })();
    return () => { cancelled = true; };
  }, [role, activeRoom, syncEnabled]);

  async function handleJoin(code) {
    const clean = String(code || "").trim().toUpperCase();
    setJoining(true); setJoinError("");
    if (!dbConfigured()) {
      setJoining(false);
      setJoinError("這個網站還沒有設定同步伺服器，目前無法多人連線。請指揮官改用「測試：進入皮克敏介面」在同一台裝置進行。");
      return;
    }
    const r = await dbGet(`rooms/${clean}/session`);
    setJoining(false);
    if (r.status === "error") {
      setJoinError("目前連不上同步伺服器（不是代碼打錯），請確認網路連線後再試一次。");
      return;
    }
    if (r.status === "missing") {
      setJoinError("找不到這組房間代碼，請確認指揮官給的代碼是否正確。");
      return;
    }
    setRoomReal(true);
    setJoinedRoom(clean);
    setRole("player");
    saveSession({ room: clean });
  }

  function enterTestPlayer() { setJoinedRoom(room); setRole("player"); }
  function backToHost() { setRole("host"); setJoinedRoom(null); setJoinError(""); saveSession(null); }
  function chooseGroup(n) { setMyGroup(n); if (activeRoom) saveGroup(activeRoom, n); }

  if (role === "player-join") return <PlayerJoinScreen onJoin={handleJoin} joining={joining} error={joinError} />;

  if (!activeRoom || loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: COLORS.bg, color: COLORS.inkSoft, fontFamily: "'Noto Sans TC', sans-serif" }}>
        <style>{FONT_IMPORT}</style>
        <div className="text-sm flex items-center gap-2"><Icon name="Loader2" size={16} className="animate-spin" /> 載入中…</div>
      </div>
    );
  }

  const activity = state.activity;
  const groupGateStages = activity === "training" ? ["ttol", "bar"] : ["bar"];
  const mustPickGroup = role === "player" && activity && groupGateStages.includes(state.stage) && state.totalGroups > 0 && !myGroup;

  const chapterLabels = {
    star: { intro: "序章", cell: "第一關｜皮克敏迫降", transition: "故事繼續", bar: "第二關｜偽裝洞穴" },
    training: { intro: "序章", cell: "第一關｜皮克敏迫降", transition1: "故事繼續一", ttol: "第二關｜情報交換", transition2: "故事繼續二", bar: "第三關｜偽裝洞穴" },
  };
  const chapterLabel = activity ? chapterLabels[activity][state.stage] : "選擇活動";

  const roomRevealStages = activity === "training" ? ["transition1", "ttol", "transition2", "bar"] : ["transition", "bar"];

  return (
    <div className="min-h-screen w-full" style={{ background: `linear-gradient(180deg, #D6EFFF 0%, ${COLORS.bg} 45%, #FFFFFF 100%)`, fontFamily: "'Noto Sans TC', sans-serif" }}>
      <style>{FONT_IMPORT}</style>
      <div className="max-w-2xl mx-auto px-5 py-8">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <Icon name="Mic2" size={22} style={{ color: COLORS.amber }} />
            <h1 className="text-2xl font-black tracking-wide" style={{ color: COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>皮克敏！使出 戲胞分裂</h1>
          </div>
          <div className="flex items-center gap-2 flex-wrap justify-end">
            {role === "host" && activity && !editingStory && !isFirstStage(activity, state.stage) && (
              <button
                onClick={() => pushState({ ...state, stage: prevStage(activity, state.stage) })}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full"
                style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.blue}` }}
              >
                <Icon name="ArrowLeft" size={13} /> 上一關
              </button>
            )}
            {role === "host" && activity && !editingStory && (
              <button onClick={() => setEditingStory(true)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.blue}` }}>
                <Icon name="BookOpen" size={13} /> 編輯故事
              </button>
            )}
            {role === "host" && activity && !editingStory && (
              <button
                onClick={() => pushState({ ...state, activity: null, stage: "intro", cardId: null, cardRevealed: false, takenNumbers: {}, timerRunning: false, timerEndsAt: null, ttol: EMPTY_STATE.ttol }, { resetPlayerData: true, resetTtol: true })}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full"
                style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.blue}` }}
              >
                <Icon name="RotateCcw" size={13} /> 重新開始（換活動）
              </button>
            )}
            {!editingStory && role === "host" && (
              <button onClick={enterTestPlayer} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: "#241A14", background: COLORS.yellow, fontWeight: 700 }}>
                <Icon name="Drama" size={13} /> 測試：進入皮克敏介面
              </button>
            )}
            {!editingStory && role === "player" && (
              <button onClick={backToHost} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: "#241A14", background: COLORS.yellow, fontWeight: 700 }}>
                <Icon name="Crown" size={13} /> 返回指揮官介面
              </button>
            )}
          </div>
        </div>
        <div className="flex items-center gap-1.5 mb-6 text-xs flex-wrap" style={{ color: role === "host" ? COLORS.amber : COLORS.red }}>
          {role === "host" ? <Icon name="Crown" size={13} /> : <Icon name="Drama" size={13} />}
          目前身份：{role === "host" ? "指揮官" : "皮克敏"}
          <span style={{ color: COLORS.inkSoft }}>　·　{chapterLabel}</span>
          {myGroup && <span style={{ color: COLORS.inkSoft }}>　·　第 {myGroup} 小隊</span>}
          <span style={{ color: syncOk ? COLORS.amber : COLORS.inkSoft, opacity: 0.8 }}>　·　{syncOk ? "已連線同步" : "同步狀態未知"}</span>
          {role === "host" && dataRestored && (
            <span style={{ color: COLORS.red, fontWeight: 700 }}>　·　⚠ 房間資料曾遺失，已從本機備份還原</span>
          )}
          {role === "host" && roomReal === false && (
            <span style={{ color: COLORS.red, fontWeight: 700 }}>　·　⚠ 連不上同步伺服器，房間代碼目前無法給人加入</span>
          )}
          {role === "host" && (
            <button onClick={() => setRole("player-join")} className="ml-auto text-[11px] underline" style={{ color: COLORS.inkSoft }}>
              我是皮克敏（輸入房間代碼加入）
            </button>
          )}
        </div>

        {!activity ? (
          role === "host" ? (
            <ActivitySelectScreen onSelect={(a) => pushState({ ...state, activity: a, stage: "intro" })} />
          ) : (
            <div className="text-center py-16 text-sm" style={{ color: COLORS.inkSoft }}>等待指揮官選擇今天要進行的活動…</div>
          )
        ) : editingStory && role === "host" ? (
          <StoryEditor
            activity={activity}
            storyText={state.storyText[activity]}
            onSave={async (vals) => await pushState({ ...state, storyText: { ...state.storyText, [activity]: { ...state.storyText[activity], ...vals } } })}
            onCancel={() => setEditingStory(false)}
          />
        ) : (
          <>
            {role === "host" && roomRevealStages.includes(state.stage) && (
              <RoomCodePanel
                room={room}
                roomReal={roomReal}
                totalGroups={state.totalGroups}
                defaultOpen={roomRevealStages[0] === state.stage}
                onChangeTotal={(d) => pushState({ ...state, totalGroups: Math.min(20, Math.max(1, state.totalGroups + d)) })}
              />
            )}

            {state.stage === "intro" && (
              <StoryScreen text={state.storyText[activity].intro || STORY_DEFAULT[activity].intro} chapter="序章" buttonLabel="開始第一關：皮克敏迫降" showButton={role === "host"} onNext={() => pushState({ ...state, stage: nextStage(activity, "intro") })} />
            )}
            {state.stage === "cell" && role === "host" && <CellHostView state={state} pushState={pushState} activity={activity} />}
            {state.stage === "cell" && role === "player" && <CellPlayerView state={state} />}

            {(state.stage === "transition" || state.stage === "transition1" || state.stage === "transition2") && (
              <StoryScreen
                text={state.storyText[activity][state.stage] || STORY_DEFAULT[activity][state.stage]}
                chapter={chapterLabel}
                buttonLabel={state.stage === "transition2" ? "開始：偽裝洞穴" : (activity === "training" ? "開始：情報交換" : "開始：偽裝洞穴")}
                showButton={role === "host"}
                onNext={() => pushState({ ...state, stage: nextStage(activity, state.stage) })}
              />
            )}

            {state.stage === "ttol" && role === "host" && <TtolHostView state={state} pushState={pushState} />}
            {state.stage === "ttol" && role === "player" && mustPickGroup && <GroupSelectScreen totalGroups={state.totalGroups} onSelect={chooseGroup} />}
            {state.stage === "ttol" && role === "player" && !mustPickGroup && <TtolPlayerView state={state} submitProfile={submitProfile} submitGuess={submitGuess} myGroup={myGroup} myId={myIdRef.current} />}

            {state.stage === "bar" && role === "host" && <BarHostView cards={cards} state={state} pushState={pushState} pushCards={pushCards} />}
            {state.stage === "bar" && role === "player" && mustPickGroup && <GroupSelectScreen totalGroups={state.totalGroups} onSelect={chooseGroup} />}
            {state.stage === "bar" && role === "player" && !mustPickGroup && <BarPlayerView cards={cards} state={state} claimScenario={claimScenario} myGroup={myGroup} myId={myIdRef.current} />}
          </>
        )}
      </div>
    </div>
  );
}

/* 任何一處 render 例外原本都會讓整頁變成空白，現場沒人知道發生什麼事。
   這裡兜住例外並提供兩條退路：重新載入，或清掉本機資料後重新載入
   （本機資料含玩家身分與已加入的房間，資料本身壞掉時需要這條路）。 */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("畫面發生錯誤：", error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    const box = { background: COLORS.panel, border: `1px solid ${COLORS.red}` };
    return (
      <div className="min-h-screen flex items-center justify-center px-6" style={{ background: COLORS.bg, fontFamily: "'Noto Sans TC', sans-serif" }}>
        <div className="max-w-sm w-full rounded-2xl p-6 text-center" style={box}>
          <div className="text-lg font-black mb-2" style={{ color: COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>畫面出了點問題</div>
          <p className="text-xs mb-5" style={{ color: COLORS.inkSoft }}>
            遊戲進度存在伺服器上，重新載入通常就會恢復。若反覆出現，再試下面第二個按鈕。
          </p>
          <div className="flex flex-col gap-2">
            <button onClick={() => location.reload()} className="px-4 py-2.5 rounded-full font-bold text-sm" style={{ background: COLORS.yellow, color: "#241A14" }}>
              重新載入
            </button>
            <button
              onClick={() => { try { localStorage.clear(); } catch (e) {} location.reload(); }}
              className="px-4 py-2.5 rounded-full text-sm"
              style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}
            >
              清除本機資料並重新載入
            </button>
          </div>
          <pre className="text-[10px] mt-4 text-left overflow-x-auto" style={{ color: COLORS.inkSoft, opacity: 0.7 }}>{String(this.state.error && this.state.error.message)}</pre>
        </div>
      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
