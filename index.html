const EMPTY_STATE = {
  hostTime: 0,    // 指揮官寫入當下的時鐘，用來校正各裝置的倒數
  activity: null, // 'star' | 'training'
  stage: "intro",

  totalGroups: 6,
  storyText: { star: { intro: "", transition: "" }, training: { intro: "", transition1: "", transition2: "" } },
  cardId: null, cardRevealed: false, takenNumbers: {},
  ttol: { phase: "writing", profiles: {}, guesses: {} },
};

/* takenNumbers 的格式是 { 小隊: { 情境號碼: 抽走它的玩家 id } }。
   記名而不是只記號碼，才能判斷「這張是不是我抽的」——重整頁面後可以還原自己的號碼，
   也才能在寫入後驗證自己的認領有沒有被別人蓋掉。舊格式是純號碼陣列，這裡一併相容。 */
function normalizeTaken(taken) {
  const out = {};
  Object.keys(taken || {}).forEach((g) => {
    const v = taken[g];
    if (Array.isArray(v)) { out[g] = {}; v.forEach((n) => { out[g][n] = "?"; }); }
    else if (v && typeof v === "object") { out[g] = { ...v }; }
  });
  return out;
}

/* 遠端讀回來的 state 一律補齊結構再用。少了這層，只要伺服器上那包 JSON 是舊版或不完整，
   畫面就會在存取 storyText[activity] / ttol.profiles 時整頁拋錯。 */
function normalizeState(raw) {
  if (!raw || typeof raw !== "object") return { ...EMPTY_STATE };
  const story = raw.storyText || {};
  const ttol = raw.ttol || {};
  return {
    ...EMPTY_STATE,
    ...raw,
    storyText: {
      star: { ...EMPTY_STATE.storyText.star, ...(story.star || {}) },
      training: { ...EMPTY_STATE.storyText.training, ...(story.training || {}) },
    },
    takenNumbers: normalizeTaken(raw.takenNumbers),
    ttol: {
      phase: ttol.phase === "guessing" ? "guessing" : "writing",
      profiles: ttol.profiles || {},
      guesses: ttol.guesses || {},
    },
  };
}

}

/* ---------- kvdb.io 同步 ---------- */
const KV_ROOT = "https://kvdb.io";

/* 倒數是用「結束時刻」在各裝置本地換算的，所以每支手機的系統時鐘一有偏差，看到的剩餘
   秒數就會不一樣（差幾分鐘的手機並不罕見）。kvdb 回應的 Date 標頭不在 CORS 安全清單內、
   跨網域讀不到，所以改以指揮官的時鐘為共同基準：指揮官每次寫入都蓋上自己的時戳，
   玩家用它推算偏移量。取樣一定會低估——狀態是先被寫入、隔一個輪詢週期才被讀到——
   所以取歷次觀察到的最大值最接近真值，誤差因此收斂到一個輪詢週期以內，
   而不是取決於手機時鐘差多少。 */
let hostClockOffset = 0;
let haveHostSample = false;
let lastHostStamp = 0;
function noteHostTime(stamp) {
  if (!stamp || stamp === lastHostStamp) return;
  lastHostStamp = stamp;
  const candidate = stamp - Date.now();
  if (!haveHostSample || candidate > hostClockOffset) { hostClockOffset = candidate; haveHostSample = true; }
}
function now() { return Date.now() + hostClockOffset; }
async function createBucket(attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(`${KV_ROOT}/`, { method: "POST" });
      if (res.ok) {
        const id = (await res.text()).trim();
        if (id) return id;
      }
    } catch (e) {
      // retry
    }
    if (i < attempts - 1) await new Promise((r) => setTimeout(r, 400));
  }
  return null;
}
async function probeReachable() {
  try {
    await fetch(`${KV_ROOT}/`, { method: "HEAD" });
    return true;
  } catch (e) {
    return false;
  }
}

async function kvGet(bucket, key, attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(`${KV_ROOT}/${bucket}/${key}`);
      if (res.status === 404) return null;
      if (!res.ok) throw new Error("bad status");
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    } catch (e) {
      if (i === attempts - 1) return null;
      await new Promise((r) => setTimeout(r, 300));
    }
  }
  return null;
}
async function kvSet(bucket, key, value) {
  try {
    const res = await fetch(`${KV_ROOT}/${bucket}/${key}`, { method: "PUT", body: JSON.stringify(value) });
    return res.ok;
  } catch (e) { return false; }
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* kvdb 只有 GET / PUT，沒有原子操作，所以用「讀最新 → 套用自己的異動 → 寫回 → 讀回驗證」
   的樂觀併發迴圈取代直接整包覆寫。mutator 收到的是遠端最新值，回傳 null 表示不需要寫入。
   verify 用來確認自己的異動沒有被別人的寫入蓋掉，被蓋掉就重跑一次（會重新讀最新值）。 */
async function kvMutate(bucket, key, mutator, { attempts = 5, verify, spread = 0 } = {}) {
  // 整隊在同一秒按下按鈕時，先各自隨機錯開一點再開始，避免第一輪就全部撞在一起。
  if (spread) await sleep(Math.floor(Math.random() * spread));
  for (let i = 0; i < attempts; i++) {
    const remote = await kvGet(bucket, key);
    const next = mutator(remote);
    if (next === null || next === undefined) return { ok: true, value: remote, skipped: true };
    if (await kvSet(bucket, key, next)) {
      if (!verify) return { ok: true, value: next };
      const after = await kvGet(bucket, key);
      if (after && verify(after)) return { ok: true, value: after };
    }
    /* 指數退避＋大幅隨機抖動。起始值要大於一次「讀→寫→驗證」的往返時間，
       否則重試會落在別人的臨界區裡，一撞再撞。 */
    if (i < attempts - 1) await sleep(Math.floor(Math.min(250 * Math.pow(1.6, i), 1500) * (0.5 + Math.random())));
  }
  // 重試用盡：絕對不要回傳自己那份沒寫進去的值，否則畫面會顯示成功、伺服器上卻沒有。
  return { ok: false, value: null };
}

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function useRemainingSeconds(state) {
  const [, setTick] = useState(0);
  useEffect(() => {
    if (!state.timerRunning) return;
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [state.timerRunning]);
  if (state.timerRunning && state.timerEndsAt) return Math.max(0, Math.round((state.timerEndsAt - now()) / 1000));
  return state.timerConfig;
}
function nextStage(activity, current) {
  const flow = STAGE_FLOW[activity];
  const idx = flow.indexOf(current);
  return flow[Math.min(idx + 1, flow.length - 1)];
}
function prevStage(activity, current) {
  const flow = STAGE_FLOW[activity];
  const idx = flow.indexOf(current);
  return flow[Math.max(idx - 1, 0)];
}
function isFirstStage(activity, current) { return STAGE_FLOW[activity].indexOf(current) <= 0; }

function StoryEditor({ activity, storyText, onSave, onCancel }) {
  const slots = activity === "training" ? ["intro", "transition1", "transition2"] : ["intro", "transition"];
  const labels = { intro: "序章", transition: "故事繼續", transition1: "故事繼續一", transition2: "故事繼續二" };
  const [vals, setVals] = useState(() => {
    const init = {};
    slots.forEach((k) => { init[k] = (storyText && storyText[k]) || STORY_DEFAULT[activity][k]; });
    return init;
  });
  const [status, setStatus] = useState(null);

  async function handleSave() {
    setStatus("saving");

  return (
    <div>

        <div key={k}>

function CellHostView({ state, pushState, activity }) {
  const [audioName, setAudioName] = useState("");
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);
  const fileInputRef = useRef(null);
  const timeUpHandled = useRef(false);
  const remaining = useRemainingSeconds(state);

  useEffect(() => {
    if (state.timerRunning && remaining <= 0 && !timeUpHandled.current) {
      timeUpHandled.current = true;
      pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: 0 });
    }
    if (!state.timerRunning) timeUpHandled.current = false;
  }, [remaining, state.timerRunning]); // eslint-disable-line react-hooks/exhaustive-deps

  function adjustTarget(delta) { pushState({ ...state, cellTarget: Math.min(30, Math.max(2, state.cellTarget + delta)) }); }
  function randomizeTarget() { pushState({ ...state, cellTarget: 2 + Math.floor(Math.random() * 7) }); }
  function setPreset(seconds) { if (!state.timerRunning) pushState({ ...state, timerConfig: seconds, timerEndsAt: null }); }
  function startTimer() { pushState({ ...state, timerRunning: true, timerEndsAt: now() + (state.timerConfig || 1) * 1000 }); }
  function pauseTimer() {
    const rem = state.timerEndsAt ? Math.max(0, Math.round((state.timerEndsAt - now()) / 1000)) : state.timerConfig;
    pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: rem });
  }
  function resetTimer() { pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: DEFAULT_TIMER }); }

  function handleFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setAudioName(f.name);
    if (audioRef.current) audioRef.current.src = URL.createObjectURL(f);
    setPlaying(false);
  }
  function toggleMusic() {
    if (!audioRef.current || !audioRef.current.src) { fileInputRef.current && fileInputRef.current.click(); return; }
    if (playing) { audioRef.current.pause(); setPlaying(false); }
    else { audioRef.current.play(); setPlaying(true); }
  }

  const timeUp = !state.timerRunning && state.timerConfig === 0;

  return (
    <div>
      <p className="text-sm mb-6" style={{ color: COLORS.creamDim }}>
        這個畫面只給指揮官自己看／投影用，不需要皮克敏連線。實際的集合行動在現場真人進行，這裡負責顯示目前需要的皮克敏數量、倒數計時與音樂。
      </p>

      <div className="rounded-2xl p-5 mb-5 text-center" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>
        <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.creamDim }}>目前需要集合的皮克敏數量</div>
        <div className="flex items-center justify-center gap-4 mb-3">
          <button onClick={() => adjustTarget(-1)} className="w-10 h-10 rounded-full text-xl font-bold" style={{ background: COLORS.bg, color: COLORS.cream, border: `1px solid ${COLORS.violet}` }}>−</button>
          <span className="text-6xl font-black w-24" style={{ color: COLORS.goldDim, fontFamily: "'Noto Serif TC', serif" }}>{state.cellTarget}</span>
          <button onClick={() => adjustTarget(1)} className="w-10 h-10 rounded-full text-xl font-bold" style={{ background: COLORS.bg, color: COLORS.cream, border: `1px solid ${COLORS.violet}` }}>＋</button>
        </div>
        <button onClick={randomizeTarget} className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold" style={{ background: COLORS.cardEdge, color: COLORS.cream }}>
          <Icon name="Dices" size={13} /> 隨機變換人數
        </button>
      </div>

      <div className="rounded-2xl p-5 mb-5" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>
        <div className="flex items-center gap-1.5 text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.creamDim }}>
          <Icon name="TimerIcon" size={13} /> 遊戲倒數
        </div>
        <div className="text-center mb-3">
          <span className="text-5xl font-black" style={{ color: timeUp ? COLORS.cardEdge : COLORS.cream, fontFamily: "'Noto Serif TC', serif" }}>{formatTime(remaining)}</span>
          {timeUp && <div className="text-sm font-bold mt-1" style={{ color: COLORS.cardEdge }}>時間到！還沒集合成功的皮克敏出局</div>}
        </div>
        {!state.timerRunning && (
          <div className="flex gap-2 justify-center mb-3 flex-wrap">
            {[60, 120, 180, 300].map((sec) => (
              <button key={sec} onClick={() => setPreset(sec)} className="px-3 py-1 rounded-full text-xs" style={{ border: `1px solid ${COLORS.goldDim}`, color: COLORS.creamDim }}>{formatTime(sec)}</button>
            ))}
          </div>
        )}
        <div className="flex gap-3 justify-center">
          {!state.timerRunning ? (
            <button onClick={startTimer} disabled={remaining <= 0} className="flex items-center gap-2 px-5 py-2 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.gold, color: "#241A14" }}>
              <Icon name="Play" size={15} /> 開始
            </button>
          ) : (
            <button onClick={pauseTimer} className="flex items-center gap-2 px-5 py-2 rounded-full font-bold text-sm" style={{ background: COLORS.gold, color: "#241A14" }}>
              <Icon name="Pause" size={15} /> 暫停
            </button>
          )}
          <button onClick={resetTimer} className="flex items-center gap-2 px-4 py-2 rounded-full text-sm" style={{ border: `1px solid ${COLORS.violet}`, color: COLORS.creamDim }}>
            <Icon name="RotateCcw" size={14} /> 重置
          </button>
        </div>
      </div>

      <div className="rounded-2xl p-5 mb-5" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>
        <div className="flex items-center gap-1.5 text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.creamDim }}>
          <Icon name="Music" size={13} /> 背景音樂（僅播放於此裝置）
        </div>
        <input ref={fileInputRef} type="file" accept="audio/*" className="hidden" onChange={handleFile} />
        <audio ref={audioRef} onEnded={() => setPlaying(false)} />
        <div className="flex items-center gap-3 justify-center">
          <button onClick={toggleMusic} className="flex items-center gap-2 px-5 py-2 rounded-full font-bold text-sm" style={{ background: COLORS.cardEdge, color: COLORS.cream }}>
            {playing ? <Icon name="Pause" size={15} /> : <Icon name="Play" size={15} />} {audioName ? (playing ? "暫停" : "播放") : "選擇音樂檔案"}
          </button>
          {audioName && <span className="text-xs truncate max-w-[140px]" style={{ color: COLORS.creamDim }}>{audioName}</span>}
        </div>
      </div>

      <button onClick={() => pushState({ ...state, stage: nextStage(activity, "cell") })} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm" style={{ border: `1px solid ${COLORS.gold}`, color: COLORS.goldDim }}>
        前往下一關 <Icon name="ChevronRight" size={16} />
      </button>
    </div>
  );
}

function BarHostView({ cards, state, pushState, pushCards }) {
  const [mode, setMode] = useState("game");
  const [flipping, setFlipping] = useState(false);
  const currentCard = state.cardId ? cards.find((c) => c.id === state.cardId) || null : null;
  const poolSize = currentCard ? currentCard.scenarios.filter((s) => s && s.trim()).length : 8;

  /* 翻牌動畫是純視覺效果，用本地 flipping 做就好；原本為了動畫而連寫兩次遠端狀態，
     等於多開一個會覆蓋玩家資料的時間窗。抽新卡本來就要清空該輪的認領，所以明確重置。 */
  async function drawCard() {
    if (cards.length === 0) return;
    const pick = cards[Math.floor(Math.random() * cards.length)].id;
    setFlipping(true);
    await pushState({ ...state, cardId: pick, cardRevealed: true, takenNumbers: {} }, { resetPlayerData: true });
    setTimeout(() => setFlipping(false), 60);
  }
  function resetDraw() { pushState({ ...state, cardId: null, cardRevealed: false, takenNumbers: {} }, { resetPlayerData: true }); }
  function addCard() {
    const id = `c${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    pushCards([...cards, { id, line: "新的一句話", scenarios: Array(8).fill("") }]);
  }
  function updateLine(idx, val) { pushCards(cards.map((c, i) => (i === idx ? { ...c, line: val } : c)), { debounce: true }); }
  function updateScenario(idx, sceneIdx, val) { pushCards(cards.map((c, i) => (i === idx ? { ...c, scenarios: c.scenarios.map((s, j) => (j === sceneIdx ? val : s)) } : c)), { debounce: true }); }
  function deleteCard(idx) { pushCards(cards.filter((_, i) => i !== idx)); }

  return (
    <>
      <div className="flex justify-end mb-4">
        <button onClick={() => setMode(mode === "game" ? "edit" : "game")} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full transition-colors" style={{ color: mode === "edit" ? COLORS.bg : COLORS.creamDim, background: mode === "edit" ? COLORS.gold : "transparent", border: `1px solid ${mode === "edit" ? COLORS.gold : COLORS.violet}` }}>
          <Icon name="Settings2" size={14} /> {mode === "edit" ? "回到遊戲" : "編輯任務卡"}
        </button>
      </div>

      {mode === "game" ? (
        <>
          <p className="text-sm mb-6" style={{ color: COLORS.creamDim }}>
            抽出任務卡後會列出卡片上全部的偽裝情境，交給皮克敏在自己的頁面抽情境牌。目前任務卡池共 {cards.length} 張：{cards.map((c) => c.line).join("、") || "（無）"}
          </p>

          <div className="flex justify-center mb-6">
            <FlipCard label="任務卡 · 暗號" faceLabel="題" revealed={state.cardRevealed && !flipping} accent={COLORS.cardEdge} small>
              {currentCard && <span className="text-2xl font-black leading-snug" style={{ color: "#241A14", fontFamily: "'Noto Serif TC', serif" }}>「{currentCard.line}」</span>}
            </FlipCard>
          </div>

          <div className="flex flex-wrap gap-3 justify-center mb-8">
            <button onClick={drawCard} disabled={cards.length === 0} className="flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.cardEdge, color: COLORS.cream }}>
              <Icon name="Shuffle" size={16} /> 抽任務卡
            </button>
            <button onClick={resetDraw} className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${COLORS.violet}`, color: COLORS.creamDim }}>
              <Icon name="RotateCcw" size={14} /> 重置
            </button>
          </div>

          {currentCard && (
            <div className="mb-8">
              <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.goldDim }}>全部偽裝情境（共 {poolSize} 種，指揮官不會看到誰抽到哪個）</div>
              <SituationList scenarios={currentCard.scenarios} activeNumber={null} />
            </div>
          )}

          <GroupProgress takenNumbers={state.takenNumbers} totalGroups={state.totalGroups} poolSize={poolSize} />
        </>
      ) : (
        <div className="space-y-5">
          <p className="text-sm" style={{ color: COLORS.creamDim }}>每張任務卡包含皮克敏要喊出的暗號，以及對應情境牌 1–8 號的偽裝情境描述。編輯後會同步給皮克敏。</p>
          {cards.map((card, idx) => (
            <div key={card.id} className="rounded-2xl p-4" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>
              <div className="flex items-center gap-2 mb-3">
                <span className="text-xs shrink-0" style={{ color: COLORS.creamDim }}>暗號</span>
                <input value={card.line} onChange={(e) => updateLine(idx, e.target.value)} placeholder="皮克敏要喊出的暗號" className="flex-1 px-3 py-2 rounded-lg text-sm font-bold outline-none" style={{ background: COLORS.card, color: "#241A14", fontFamily: "'Noto Serif TC', serif" }} />
                <button onClick={() => deleteCard(idx)} style={{ color: COLORS.cardEdge }}><Icon name="Trash2" size={18} /></button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {card.scenarios.map((s, si) => (
                  <div key={si} className="flex items-center gap-2">
                    <span className="w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold shrink-0" style={{ background: COLORS.gold, color: "#241A14" }}>{si + 1}</span>
                    <input value={s} onChange={(e) => updateScenario(idx, si, e.target.value)} placeholder={`第 ${si + 1} 號偽裝情境描述`} className="flex-1 px-2.5 py-1.5 rounded-lg text-xs outline-none" style={{ background: "#EAF6FF", color: COLORS.cream, border: `1px solid ${COLORS.violet}` }} />
                  </div>
                ))}

          ))}
          <button onClick={addCard} className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-bold w-full justify-center" style={{ border: `1px dashed ${COLORS.gold}`, color: COLORS.goldDim }}>
            <Icon name="Plus" size={16} /> 新增任務卡
          </button>
        </div>
      )}

}

function BarPlayerView({ cards, state, claimScenario, myGroup, myId }) {
  const [drawing, setDrawing] = useState(false);
  const [noneLeft, setNoneLeft] = useState(false);
  const [failed, setFailed] = useState(false);
  const [flipping, setFlipping] = useState(false);
  const currentCard = state.cardId ? cards.find((c) => c.id === state.cardId) || null : null;
  const groupKey = String(myGroup || "solo");
  const takenForGroup = (state.takenNumbers && state.takenNumbers[groupKey]) || {};
  // 只把真的填了字的情境放進抽牌池，免得指揮官沒填完就有人抽到「（尚未填寫）」
  const pool = useMemo(
    () => (currentCard ? currentCard.scenarios.map((s, i) => (s && s.trim() ? i + 1 : 0)).filter(Boolean) : []),
    [currentCard]
  );
  const poolSize = pool.length;

  /* 自己的號碼是從共用狀態裡「哪一個號碼登記在我名下」推導出來的，不是本地暫存，
     所以重新整理頁面之後仍然找得回來，也不會因此多抽走一個號碼。 */
  const myNumber = useMemo(() => {
    const hit = Object.keys(takenForGroup).find((n) => takenForGroup[n] === myId);
    return hit ? Number(hit) : null;
  }, [takenForGroup, myId]);

  useEffect(() => {
    setNoneLeft(false); setFailed(false);
    if (!state.cardId) return;
    setFlipping(true);
    const t = setTimeout(() => setFlipping(false), 80);
    return () => clearTimeout(t);
  }, [state.cardId]);

  async function drawNumber() {
    if (!currentCard || myNumber !== null || drawing) return;
    setDrawing(true); setNoneLeft(false); setFailed(false);
    const { full, failed: err } = await claimScenario(groupKey, pool);
    setDrawing(false);
    if (err) setFailed(true);
    else if (full) setNoneLeft(true);
  }

  return (
    <>
      {myGroup && (
        <div className="text-center mb-4">
          <span className="inline-block px-3 py-1 rounded-full text-xs font-bold" style={{ background: COLORS.bg2, color: COLORS.pink, border: `1px solid ${COLORS.pink}` }}>你的小隊：第 {myGroup} 小隊</span>
        </div>
      )}
      <p className="text-sm mb-6" style={{ color: COLORS.creamDim }}>
        {currentCard ? "指揮官已抽出任務卡，換你抽情境牌——結果只有你看得到，別讓同小隊的人知道！" : "等待指揮官抽出任務卡…（畫面會自動同步，請稍候）"}
      </p>

      <div className="flex justify-center mb-6">
        <FlipCard label="任務卡 · 暗號" faceLabel="題" revealed={!!currentCard && state.cardRevealed && !flipping} accent={COLORS.cardEdge} small>
          {currentCard && <span className="text-2xl font-black leading-snug" style={{ color: "#241A14", fontFamily: "'Noto Serif TC', serif" }}>「{currentCard.line}」</span>}
        </FlipCard>
      </div>

      <div className="flex flex-col items-center gap-2 mb-8">
        <button onClick={drawNumber} disabled={!currentCard || myNumber !== null || noneLeft || drawing || poolSize === 0} className="flex items-center gap-2 px-6 py-2.5 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.gold, color: "#241A14" }}>
          <Icon name="Shuffle" size={16} /> {drawing ? "抽牌中…" : (myNumber !== null ? "已抽過（本輪只能抽一次）" : "抽情境牌")}
        </button>
        {!currentCard && <span className="text-xs" style={{ color: COLORS.creamDim }}>指揮官抽出任務卡後即可使用</span>}
        {currentCard && poolSize === 0 && <span className="text-xs" style={{ color: COLORS.cardEdge }}>這張任務卡還沒有填寫任何情境，請指揮官先編輯。</span>}
        {noneLeft && <span className="text-xs" style={{ color: COLORS.cardEdge }}>本小隊 {poolSize} 種情境已經被抽完了</span>}
        {failed && <span className="text-xs" style={{ color: COLORS.cardEdge }}>同步失敗，沒有抽到牌，請確認網路後再按一次。</span>}
        {myNumber !== null && <span className="text-3xl font-black mt-2" style={{ color: COLORS.goldDim, fontFamily: "'Noto Serif TC', serif" }}>第 {myNumber} 號（只有你看得到）</span>}
      </div>

      {currentCard && (
        <div>
          <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.goldDim }}>全部偽裝情境（共 {poolSize} 種，你的那項會反白，其他人看不到）</div>
          <SituationList scenarios={currentCard.scenarios} activeNumber={myNumber} />
        </div>
      )}
    </>
  );
}

/* ---------- 情報交換 ---------- */
function TtolHostView({ state, pushState }) {
  const ttol = state.ttol || EMPTY_STATE.ttol;
  const profiles = Object.entries(ttol.profiles || {});
  const byGroup = {};
  profiles.forEach(([id, p]) => { (byGroup[p.group] = byGroup[p.group] || []).push({ id, ...p }); });

  function startGuessing() { pushState({ ...state, ttol: { ...ttol, phase: "guessing" } }); }
  function finishTtol() { pushState({ ...state, stage: nextStage(state.activity, "ttol") }); }

  function tallyFor(id) {
    const g = (ttol.guesses && ttol.guesses[id]) || {};
    const vals = Object.values(g);
    return { correct: vals.filter((v) => v.result === "correct").length, wrong: vals.filter((v) => v.result === "wrong").length };
  }

  return (
    <div>
      <p className="text-sm mb-6" style={{ color: COLORS.creamDim }}>
        每個人先在自己手機上填寫情報並提交，全部人（或大部分人）填完後按下方按鈕開始「情報判讀」環節——大家會同時在自己手機上，各自判讀自己小隊內其他每一位夥伴，不用輪流等待。
      </p>

      <div className="rounded-2xl p-4 mb-5" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>
        <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.creamDim }}>已提交名單（依小隊）</div>
        {Object.keys(byGroup).length === 0 && <div className="text-xs" style={{ color: COLORS.creamDim, opacity: 0.7 }}>目前還沒有人提交。</div>}
        {Object.entries(byGroup).map(([g, list]) => (
          <div key={g} className="mb-2">
            <div className="text-xs font-bold mb-1" style={{ color: COLORS.goldDim }}>第 {g} 小隊（{list.length} 人）</div>
            <div className="flex flex-wrap gap-1.5">
              {list.map((p) => (
                <span key={p.id} className="text-xs px-2 py-1 rounded-lg" style={{ background: "#EAF6FF", color: COLORS.creamDim, border: `1px solid ${COLORS.goldDim}` }}>{p.nickname || p.name}</span>
              ))}
            </div>
          </div>
        ))}
      </div>

      {ttol.phase === "writing" && (
        <button onClick={startGuessing} disabled={profiles.length === 0} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-40 mb-6" style={{ background: COLORS.gold, color: "#241A14" }}>
          大家自我介紹完了，開始情報判讀
        </button>
      )}

      {ttol.phase === "guessing" && (
        <div className="rounded-2xl p-4 mb-6" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.goldDim}` }}>
          <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.goldDim }}>情報判讀進度（不會顯示是誰判讀的、選了什麼）</div>
          <div className="space-y-1.5 mb-2">
            {profiles.map(([id, p]) => {
              const t = tallyFor(id);
              return (
                <div key={id} className="flex items-center justify-between text-xs px-3 py-2 rounded-lg" style={{ background: "#EAF6FF", border: `1px solid ${COLORS.violet}` }}>
                  <span style={{ color: COLORS.creamDim }}>第{p.group}小隊・{p.nickname || p.name}</span>
                  <span>
                    <span style={{ color: COLORS.goldDim, fontWeight: 700 }}>判讀成功 {t.correct}</span>　
                    <span style={{ color: COLORS.cardEdge, fontWeight: 700 }}>判讀失敗 {t.wrong}</span>
                    {t.wrong > 0 && t.correct === 0 && <span className="ml-1" style={{ color: COLORS.cardEdge }}>（目前全員尚未判讀成功）</span>}
                  </span>
                </div>
              );
            })}
          </div>
          <button onClick={finishTtol} className="w-full mt-3 flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm" style={{ border: `1px solid ${COLORS.gold}`, color: COLORS.goldDim }}>
            情報交換結束，前往下一關 <Icon name="ChevronRight" size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

function TtolWriteForm({ myGroup, onSubmit }) {
  const [school, setSchool] = useState("");
  const [name, setName] = useState("");
  const [nickname, setNickname] = useState("");
  const [statements, setStatements] = useState(["", "", "", ""]);
  const [lieIndex, setLieIndex] = useState(0);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);

  const canSubmit = school && name && nickname && statements.every((s) => s.trim()) && !sending;

  async function send() {
    if (!canSubmit) return;
    setSending(true); setFailed(false);
    const res = await onSubmit({ school, name, nickname, statements, lieIndex, group: myGroup });
    setSending(false);
    if (!res || !res.ok) setFailed(true);
  }

  return (
    <div>
      <p className="text-sm mb-5" style={{ color: COLORS.creamDim }}>填寫你的情報，還有四則關於你的事——三則真的、一則是你編出來的假情報，等一下讓同小隊夥伴判讀。</p>
      <div className="space-y-3 mb-4">
        <input value={school} onChange={(e) => setSchool(e.target.value)} placeholder="所屬基地" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.cream, border: `1px solid ${COLORS.violet}` }} />
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="代號" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.cream, border: `1px solid ${COLORS.violet}` }} />
        <input value={nickname} onChange={(e) => setNickname(e.target.value)} placeholder="暱稱" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.cream, border: `1px solid ${COLORS.violet}` }} />
      </div>
      <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.goldDim }}>四則情報（點選單選鈕標記哪一則是假的）</div>
      <div className="space-y-2 mb-5">
        {statements.map((s, i) => (
          <div key={i} className="flex items-center gap-2">
            <input type="radio" name="lie" checked={lieIndex === i} onChange={() => setLieIndex(i)} />
            <input
              value={s}
              onChange={(e) => setStatements((arr) => arr.map((v, j) => (j === i ? e.target.value : v)))}
              placeholder={`第 ${i + 1} 則情報`}
              className="flex-1 px-3 py-2 rounded-lg text-sm outline-none"
              style={{ background: "#EAF6FF", color: COLORS.cream, border: `1px solid ${COLORS.violet}` }}
            />
          </div>
        ))}
      </div>
      {failed && <div className="text-xs mb-3 text-center" style={{ color: COLORS.cardEdge }}>⚠ 沒有提交成功，請確認網路連線後再按一次。</div>}
      <button
        onClick={send}
        disabled={!canSubmit}
        className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-40"
        style={{ background: COLORS.gold, color: "#241A14" }}
      >
        {sending ? "提交中…" : "提交"}
      </button>
    </div>
  );
}

function TtolLivingRoom({ ttol, myGroup }) {
  const mine = Object.entries(ttol.profiles || {}).filter(([, p]) => p.group === myGroup);
  return (
    <div>
      <p className="text-sm mb-5" style={{ color: COLORS.creamDim }}>提交完成！輪流自我介紹，介紹完後指揮官會帶大家進入情報判讀環節。</p>
      <div className="space-y-3">
        {mine.map(([id, p]) => (
          <div key={id} className="rounded-2xl p-4" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>

            <div className="text-xs mb-2" style={{ color: COLORS.creamDim }}>{p.school}</div>
            <div className="space-y-1">
              {p.statements.map((s, i) => (
                <div key={i} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ background: "#EAF6FF", color: COLORS.cream }}>{i + 1}. {s}</div>
              ))}

          </div>

function TtolGuessCard({ target, targetId, myId, ttol, submitGuess }) {
  const myGuess = (ttol.guesses && ttol.guesses[targetId] && ttol.guesses[targetId][myId]) || null;
  const [picked, setPicked] = useState(null);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);
  const locked = myGuess && (myGuess.result === "correct" || myGuess.result === "wrong");

  /* 判讀的次數與結果都交給 submitGuess 依「遠端最新值」計算，
     這裡不再自己算 attempts —— 全隊同時送出時，本地那份很可能已經過期。 */
  async function send() {
    if (picked === null || sending) return;
    setSending(true); setFailed(false);
    const res = await submitGuess(targetId, picked, target.lieIndex);
    setSending(false);
    if (res && res.ok) setPicked(null);
    else setFailed(true);
  }

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.bg2, border: `1px solid ${COLORS.violet}` }}>
      <p className="text-sm mb-3"><span style={{ color: COLORS.goldDim, fontWeight: 700 }}>{target.nickname}</span> <span style={{ color: COLORS.creamDim }}>的哪一則情報是假的？</span></p>
      <div className="space-y-2 mb-3">
        {target.statements.map((s, i) => (
          <button
            key={i}
            onClick={() => !locked && setPicked(i)}
            disabled={locked}
            className="w-full text-left text-sm px-3 py-2.5 rounded-xl"
            style={{ background: picked === i ? COLORS.gold : COLORS.bg, color: picked === i ? "#241A14" : COLORS.cream, border: `1px solid ${picked === i ? COLORS.gold : COLORS.violet}` }}
          >
            {i + 1}. {s}
          </button>
        ))}
      </div>
      {!locked && (
        <button onClick={send} disabled={picked === null || sending} className="w-full px-4 py-2 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.cardEdge, color: COLORS.cream }}>
          {sending ? "送出中…" : (myGuess ? `再判讀一次（第 ${myGuess.attempts + 1} 次）` : "送出第一次判讀")}
        </button>
      )}
      {myGuess && myGuess.result === "correct" && <div className="text-center text-sm mt-2" style={{ color: COLORS.goldDim }}>✓ 判讀成功！</div>}
      {myGuess && myGuess.result === "wrong" && <div className="text-center text-sm mt-2" style={{ color: COLORS.cardEdge }}>✕ 判讀失敗，兩次機會用完。</div>}
      {myGuess && myGuess.result === "pending" && <div className="text-center text-sm mt-2" style={{ color: COLORS.creamDim }}>還沒判讀成功，再試一次！</div>}
      {failed && <div className="text-center text-xs mt-2" style={{ color: COLORS.cardEdge }}>⚠ 這次判讀沒有送出成功（不算次數），請再按一次送出。</div>}
    </div>
  );
}

function TtolGuessing({ ttol, myGroup, myId, submitGuess }) {
  const targets = Object.entries(ttol.profiles || {}).filter(([id, p]) => p.group === myGroup && id !== myId);

  return (
    <div>
      <p className="text-sm mb-4 text-center" style={{ color: COLORS.creamDim }}>背對背獨立作答，不能問提示——判讀同小隊每一位夥伴的哪一則情報是假的。你自己的不會出現在這裡。</p>
      {targets.length === 0 && <div className="text-center text-sm py-10" style={{ color: COLORS.creamDim }}>目前小隊內還沒有其他人可以判讀。</div>}
      {targets.map(([id, p]) => (
        <TtolGuessCard key={id} target={p} targetId={id} myId={myId} ttol={ttol} submitGuess={submitGuess} />
      ))}
    </div>
  );
}

function TtolPlayerView({ state, submitProfile, submitGuess, myGroup, myId }) {
  const ttol = state.ttol || EMPTY_STATE.ttol;
  const submitted = !!(ttol.profiles || {})[myId];

  if (!submitted) return <TtolWriteForm myGroup={myGroup} onSubmit={submitProfile} />;
  if (ttol.phase === "writing") return <TtolLivingRoom ttol={ttol} myGroup={myGroup} />;
  return <TtolGuessing ttol={ttol} myGroup={myGroup} myId={myId} submitGuess={submitGuess} />;
}

/* ---------- App ---------- */
function App() {
  const restored = useRef(loadSession()).current; // 上次已加入的房間（如果有）
  const [role, setRole] = useState(restored ? "player" : "host"); // host | player-join | player
  const [room, setRoom] = useState(null);
  const [roomReal, setRoomReal] = useState(restored ? true : null); // null=尚未確定, true=真的連上同步伺服器, false=連不上（房間代碼無法給人加入）
  const [joinedRoom, setJoinedRoom] = useState(restored ? restored.room : null);
  const [joining, setJoining] = useState(false);
  const [joinError, setJoinError] = useState("");

  const [cards, setCards] = useState(DEFAULT_CARDS);
  const [state, setState] = useState(EMPTY_STATE);
  const [loading, setLoading] = useState(true);
  const [syncOk, setSyncOk] = useState(null);
  const [myGroup, setMyGroup] = useState(null);
  const [editingStory, setEditingStory] = useState(false);
  const myIdRef = useRef(loadOrCreateId());

  const activeRoom = role === "player" ? joinedRoom : room;
  // roomReal === false 代表連不上 kvdb（單機測試模式），這時完全不要發網路請求。
  const syncEnabled = !!activeRoom && roomReal !== false;

  /* 讓非同步的寫入流程隨時拿得到最新的本地 state，不必把它放進 useCallback 的相依陣列。 */
  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);

  /* 寫入進行中（以及寫完後的短暫沉澱期）不要套用輪詢結果，
     否則自己剛送出的異動會被一個較早發出、還在路上的輪詢回應蓋回舊值。 */
  const writingRef = useRef(0);
  const settleUntilRef = useRef(0);
  const repairingRef = useRef(false);
  /* 連續操作時會有多個寫入同時在路上。較早發出、較晚回來的那個若把結果套回畫面，
     就會把使用者已經前進的關卡拉回去。只有最新一次寫入有資格更新畫面。 */
  const writeSeqRef = useRef(0);

  /* 而且同一台裝置連續發出的寫入，也不能任其並行：網路抖動會讓較晚發出的先抵達、
     較早發出的後抵達，伺服器最後就停在舊的值上（指揮官快速換關卡時會整個退回去）。
     這裡把本機的寫入串成一條佇列，確保抵達順序等於操作順序。 */
  const writeChainRef = useRef(Promise.resolve());
  const enqueueWrite = useCallback((fn) => {
    const run = writeChainRef.current.then(fn, fn);
    writeChainRef.current = run.then(() => {}, () => {});
    return run;
  }, []);
  const beginWrite = useCallback(() => { writingRef.current += 1; }, []);
  const endWrite = useCallback(() => {
    writingRef.current = Math.max(0, writingRef.current - 1);
    settleUntilRef.current = Date.now() + 800;
  }, []);

  useEffect(() => {
    if (role !== "host" || room) return;
    (async () => {
      const id = await createBucket();
      if (id) { setRoom(id); setRoomReal(true); }
      else { setRoom("local" + Math.random().toString(36).slice(2, 8)); setRoomReal(false); }
    })();
  }, [role, room]);

  /* 指揮官端的寫入：只負責流程狀態（活動、關卡、計時器、任務卡、故事文字）。
     takenNumbers 與 ttol.profiles / ttol.guesses 是玩家寫的，寫回去時一律以遠端最新值為準，
     否則指揮官那份過期快照會把大家剛填好的資料整包抹掉。
     只有明確要清空該輪資料的動作（抽新任務卡、重置、換活動）才傳 resetPlayerData。 */
  const pushState = useCallback(async (next, opts = {}) => {
    // 蓋上指揮官的時鐘，讓玩家能校正自己的倒數（見上方 noteHostTime）
    if (role === "host") next = { ...next, hostTime: Date.now() };
    setState(next);
    if (!syncEnabled) return false;
    const seq = ++writeSeqRef.current;
    beginWrite();
    const res = await enqueueWrite(() => kvMutate(activeRoom, "state", (remote) => {
      if (!remote || opts.resetPlayerData) return next;
      const base = normalizeState(remote);
      return {
        ...next,
        takenNumbers: base.takenNumbers,
        ttol: { ...(next.ttol || EMPTY_STATE.ttol), profiles: base.ttol.profiles, guesses: base.ttol.guesses },
      };
    }));
    endWrite();
    setSyncOk(res.ok);
    if (res.value && seq === writeSeqRef.current) setState(normalizeState(res.value));
    return res.ok;
  }, [role, activeRoom, syncEnabled, beginWrite, endWrite, enqueueWrite]);

  /* 編輯任務卡時每個按鍵都會呼叫這裡。逐鍵送出等於一個字一次 PUT，
     所以打字類的異動傳 debounce，停止輸入 600ms 後才真的寫出去。 */
  const cardsTimerRef = useRef(null);
  const pushCards = useCallback(async (next, opts = {}) => {
    setCards(next);
    if (!syncEnabled) return false;
    const write = async () => {
      beginWrite();
      const ok = await kvSet(activeRoom, "cards", next);
      endWrite();
      setSyncOk(ok);
      return ok;
    };
    if (cardsTimerRef.current) { clearTimeout(cardsTimerRef.current); cardsTimerRef.current = null; }
    if (!opts.debounce) return write();
    cardsTimerRef.current = setTimeout(() => { cardsTimerRef.current = null; write(); }, 600);
    return true;
  }, [activeRoom, syncEnabled, beginWrite, endWrite]);
  useEffect(() => () => { if (cardsTimerRef.current) clearTimeout(cardsTimerRef.current); }, []);

  /* 玩家端的寫入：mutator 只能改自己那一筆，其餘欄位原封不動沿用遠端最新值。
     verify 負責確認寫入沒有被同時送出的其他人蓋掉，被蓋掉就重讀重試。 */
  const mutatePlayerData = useCallback(async (mutator, verify) => {
    if (!syncEnabled) {
      const local = mutator(normalizeState(stateRef.current));
      if (local) setState(local);
      return { ok: true, value: local || stateRef.current, local: true };
    }
    const seq = ++writeSeqRef.current;
    beginWrite();
    const res = await enqueueWrite(() => kvMutate(activeRoom, "state", (remote) => mutator(normalizeState(remote || stateRef.current)), { verify, spread: 300 }));
    endWrite();
    setSyncOk(res.ok);
    // 只有確認寫入成功才更新畫面。失敗時維持原狀並回報，讓使用者知道要再按一次，
    // 而不是看到一個伺服器上根本不存在的結果。
    if (res.ok && res.value && seq === writeSeqRef.current) setState(normalizeState(res.value));
    return res;
  }, [activeRoom, syncEnabled, beginWrite, endWrite, enqueueWrite]);

  /* 我這台裝置送出過的東西。寫入成功「當下」不代表就安全了——另一個讀取時間較早的人
     隨後把整包狀態寫回去，一樣會把我的資料蓋掉。所以每次輪詢都拿這份記錄跟遠端對照，
     發現自己的東西不見了就補寫回去。這讓整個同步變成會自我修復、最終一致。 */
  const myDataRef = useRef({ profile: null, guesses: {}, claim: null });

  const repairPatch = useCallback((base) => {
    const mine = myDataRef.current;
    const myId = myIdRef.current;
    let next = base, changed = false;
    /* 指揮官換活動時會清空全部資料；那不是「被蓋掉」，不能補寫回去，否則重置會被玩家撤銷。
       情報與判讀也只在情報交換那一關才需要維護。 */
    if (!base.activity) { myDataRef.current = { profile: null, guesses: {}, claim: null }; return null; }
    const inTtol = base.stage === "ttol";
    if (inTtol && mine.profile && !base.ttol.profiles[myId]) {
      next = { ...next, ttol: { ...next.ttol, profiles: { ...next.ttol.profiles, [myId]: mine.profile } } };
      changed = true;
    }
    Object.keys(inTtol ? mine.guesses : {}).forEach((targetId) => {
      const want = mine.guesses[targetId];
      const have = (next.ttol.guesses[targetId] || {})[myId];
      if (!have || have.attempts < want.attempts) {
        next = { ...next, ttol: { ...next.ttol, guesses: { ...next.ttol.guesses, [targetId]: { ...(next.ttol.guesses[targetId] || {}), [myId]: want } } } };
        changed = true;
      }
    });
    if (mine.claim && base.cardId === mine.claim.cardId) {
      const taken = next.takenNumbers[mine.claim.group] || {};
      if (taken[mine.claim.number] === undefined) {
        next = { ...next, takenNumbers: { ...next.takenNumbers, [mine.claim.group]: { ...taken, [mine.claim.number]: myId } } };
        changed = true;
      } else if (taken[mine.claim.number] !== myId) {
        mine.claim = null; // 號碼已經被別人拿走，不能硬塞成兩人同號，讓畫面回到可重抽的狀態
      }
    } else if (mine.claim && base.cardId !== mine.claim.cardId) {
      mine.claim = null; // 已經換了新的一輪任務卡
    }
    return changed ? next : null;
  }, []);

  /* 認領一張情境牌。pool 是「這張卡上真的填了內容的情境號碼」，
     每次重試都會依最新的遠端資料重新挑，所以不會挑到別人剛拿走的、也不會抽到空白情境。 */
  const claimScenario = useCallback(async (groupKey, pool) => {
    const myId = myIdRef.current;
    let picked = null, full = false;
    const res = await mutatePlayerData(
      (base) => {
        const taken = base.takenNumbers[groupKey] || {};
        const mine = Object.keys(taken).find((n) => taken[n] === myId);
        if (mine) { picked = Number(mine); full = false; return null; } // 已經抽過，不重複寫入
        const available = pool.filter((n) => taken[n] === undefined);
        if (available.length === 0) { picked = null; full = true; return null; }
        full = false;
        picked = available[Math.floor(Math.random() * available.length)];
        return { ...base, takenNumbers: { ...base.takenNumbers, [groupKey]: { ...taken, [picked]: myId } } };
      },
      (after) => picked !== null && ((normalizeState(after).takenNumbers[groupKey] || {})[picked] === myId)
    );
    if (!res.ok) return { picked: null, full: false, failed: true };
    if (picked !== null) myDataRef.current.claim = { cardId: stateRef.current.cardId, group: groupKey, number: picked };
    return { picked, full, failed: false };
  }, [mutatePlayerData]);

  const submitProfile = useCallback(async (profile) => {
    const myId = myIdRef.current;
    const res = await mutatePlayerData(
      (base) => ({ ...base, ttol: { ...base.ttol, profiles: { ...base.ttol.profiles, [myId]: profile } } }),
      (after) => !!(normalizeState(after).ttol.profiles[myId])
    );
    if (res.ok) myDataRef.current.profile = profile;
    return res;
  }, [mutatePlayerData]);

  const submitGuess = useCallback(async (targetId, pickedIndex, lieIndex) => {
    const myId = myIdRef.current;
    let attempts = 0, recorded = null;
    const res = await mutatePlayerData(
      (base) => {
        const forTarget = base.ttol.guesses[targetId] || {};
        const prev = forTarget[myId] || null;
        if (prev && (prev.result === "correct" || prev.result === "wrong")) return null; // 兩次機會已用完
        attempts = (prev ? prev.attempts : 0) + 1;
        const result = pickedIndex === lieIndex ? "correct" : (attempts >= 2 ? "wrong" : "pending");
        recorded = { attempts, result };
        return {
          ...base,
          ttol: { ...base.ttol, guesses: { ...base.ttol.guesses, [targetId]: { ...forTarget, [myId]: recorded } } },
        };
      },
      (after) => {
        const mine = (normalizeState(after).ttol.guesses[targetId] || {})[myId];
        return !!mine && mine.attempts >= attempts;
      }
    );
    if (res.ok && recorded) myDataRef.current.guesses[targetId] = recorded;
    return res;
  }, [mutatePlayerData]);

  useEffect(() => {
    if (!activeRoom) return;
    let cancelled = false;
    (async () => {
      setLoading(true);
      if (syncEnabled) {
        const remoteCards = await kvGet(activeRoom, "cards");
        const remoteState = await kvGet(activeRoom, "state");
        if (cancelled) return;
        if (remoteCards) setCards(remoteCards);
        if (remoteState) setState(normalizeState(remoteState));
      }
      if (cancelled) return;
      setMyGroup(loadGroup(activeRoom));
      setLoading(false);
    })();
    return () => { cancelled = true; };
  }, [activeRoom, syncEnabled]);

  /* 指揮官同樣要輪詢：他的「已提交名單」與「抽取進度」讀的都是玩家寫進來的資料，
     不重新拉取的話那兩塊永遠是空的，而且他手上的過期快照一寫回去就會清掉玩家的成果。 */
  /* 現場三十個人各自每 1.5 秒固定發兩個請求，對一個免費服務來說是不小的量。
     兩個省法：畫面被切到背景（手機鎖屏、切去別的 App）時完全不發請求；
     以及狀態一直沒變化時把間隔逐步拉長，一有變動立刻恢復到最短間隔。 */
  const lastRawRef = useRef("");
  useEffect(() => {
    if (!syncEnabled) return;
    let cancelled = false;
    let timer = null;
    const baseDelay = role === "player" ? 1500 : 2500;
    const capDelay = role === "player" ? 3000 : 6000;
    let delay = baseDelay;

    const tick = async () => {
      if (writingRef.current > 0 || Date.now() < settleUntilRef.current) { delay = baseDelay; return; }
      const remoteState = await kvGet(activeRoom, "state");
      if (cancelled) return;
      // 任務卡只有指揮官會改，所以他不需要拉回來（拉回來反而會蓋掉正在編輯的文字）；
      // 玩家也只有在偽裝洞穴那關才用得到，其餘時間不必浪費請求。
      let remoteCards = null;
      if (role === "player" && remoteState && remoteState.stage === "bar") {
        remoteCards = await kvGet(activeRoom, "cards");
        if (cancelled) return;
      }
      if (writingRef.current > 0 || Date.now() < settleUntilRef.current) { delay = baseDelay; return; }
      if (remoteCards) setCards(remoteCards);
      if (remoteState) {
        if (role === "player") noteHostTime(remoteState.hostTime);
        const fresh = normalizeState(remoteState);
        // 自己送出過、但遠端已經看不到的東西，就地補回來（畫面先顯示，背景再寫回伺服器）。
        const patched = role === "player" ? repairPatch(fresh) : null;
        setState(patched || fresh);
        if (patched && !repairingRef.current) {
          repairingRef.current = true;
          mutatePlayerData((b) => repairPatch(b)).finally(() => { repairingRef.current = false; });
        }
      }
      setSyncOk(remoteState !== null);

      const raw = remoteState ? JSON.stringify(remoteState) : "";
      if (raw !== lastRawRef.current) { lastRawRef.current = raw; delay = baseDelay; }
      else delay = Math.min(Math.round(delay * 1.5), capDelay);
    };

    function schedule(ms) { if (!cancelled) timer = setTimeout(loop, ms); }
    async function loop() {
      if (cancelled) return;
      if (typeof document !== "undefined" && document.hidden) { delay = baseDelay; schedule(baseDelay); return; }
      try { await tick(); } catch (e) { /* 單次輪詢失敗不該中斷整個迴圈 */ }
      schedule(delay);
    }
    function onVisibility() {
      if (typeof document !== "undefined" && !document.hidden) {
        delay = baseDelay;
        if (timer) clearTimeout(timer);
        schedule(0);
      }
    }

    schedule(baseDelay);
    if (typeof document !== "undefined") document.addEventListener("visibilitychange", onVisibility);
    return () => {
      cancelled = true;
      if (timer) clearTimeout(timer);
      if (typeof document !== "undefined") document.removeEventListener("visibilitychange", onVisibility);
    };
  }, [role, activeRoom, syncEnabled, repairPatch, mutatePlayerData]);

  async function handleJoin(code) {
    setJoining(true); setJoinError("");
    const remoteState = await kvGet(code, "state");
    const remoteCards = await kvGet(code, "cards");
    if (!remoteState && !remoteCards) {
      const reachable = await probeReachable();
      setJoining(false);
      if (!reachable) {
        setJoinError("目前連不上同步伺服器（不是代碼打錯），請檢查網路連線，或請指揮官改用「測試：進入皮克敏介面」在同一台裝置測試。");
      } else {
        setJoinError("找不到這組房間代碼，請確認指揮官給的代碼是否正確。");
      }
      return;
    }
    setJoining(false);
    setRoomReal(true); // 能讀到房間資料，代表同步伺服器是通的
    setJoinedRoom(code);
    setRole("player");
    saveSession({ room: code });
  }
  function enterTestPlayer() { setJoinedRoom(room); setRole("player"); }
  function backToHost() { setRole("host"); setJoinedRoom(null); setJoinError(""); saveSession(null); }
  function chooseGroup(n) { setMyGroup(n); if (activeRoom) saveGroup(activeRoom, n); }

  if (role === "player-join") return <PlayerJoinScreen onJoin={handleJoin} joining={joining} error={joinError} />;

  if (!activeRoom || loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: COLORS.bg, color: COLORS.creamDim, fontFamily: "'Noto Sans TC', sans-serif" }}>
        <style>{FONT_IMPORT}</style>
        <div className="text-sm flex items-center gap-2"><Icon name="Loader2" size={16} className="animate-spin" /> 載入中…</div>
      </div>
    );
  }

  const activity = state.activity;
  const groupGateStages = activity === "training" ? ["ttol", "bar"] : ["bar"];
  const mustPickGroup = role === "player" && activity && groupGateStages.includes(state.stage) && state.totalGroups > 0 && !myGroup;

  const chapterLabels = {
    star: { intro: "序章", cell: "第一關｜皮克敏迫降", transition: "故事繼續", bar: "第二關｜偽裝洞穴" },
    training: { intro: "序章", cell: "第一關｜皮克敏迫降", transition1: "故事繼續一", ttol: "第二關｜情報交換", transition2: "故事繼續二", bar: "第三關｜偽裝洞穴" },
  };
  const chapterLabel = activity ? chapterLabels[activity][state.stage] : "選擇活動";

  const roomRevealStages = activity === "training" ? ["transition1", "ttol", "transition2", "bar"] : ["transition", "bar"];

  return (
    <div className="min-h-screen w-full" style={{ background: `linear-gradient(180deg, #D6EFFF 0%, ${COLORS.bg} 45%, #FFFFFF 100%)`, fontFamily: "'Noto Sans TC', sans-serif" }}>
      <style>{FONT_IMPORT}</style>
      <div className="max-w-2xl mx-auto px-5 py-8">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <Icon name="Mic2" size={22} style={{ color: COLORS.goldDim }} />
            <h1 className="text-2xl font-black tracking-wide" style={{ color: COLORS.cream, fontFamily: "'Noto Serif TC', serif" }}>皮克敏！使出 戲胞分裂</h1>
          </div>
          <div className="flex items-center gap-2 flex-wrap justify-end">
            {role === "host" && activity && !editingStory && !isFirstStage(activity, state.stage) && (
              <button
                onClick={() => pushState({ ...state, stage: prevStage(activity, state.stage) })}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full"
                style={{ color: COLORS.creamDim, border: `1px solid ${COLORS.violet}` }}
              >
                <Icon name="ArrowLeft" size={13} /> 上一關
              </button>
            )}
            {role === "host" && activity && !editingStory && (
              <button onClick={() => setEditingStory(true)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: COLORS.creamDim, border: `1px solid ${COLORS.violet}` }}>
                <Icon name="BookOpen" size={13} /> 編輯故事
              </button>
            )}
            {role === "host" && activity && !editingStory && (
              <button
                onClick={() => pushState({ ...state, activity: null, stage: "intro", cardId: null, cardRevealed: false, takenNumbers: {}, timerRunning: false, timerEndsAt: null, ttol: EMPTY_STATE.ttol }, { resetPlayerData: true })}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full"
                style={{ color: COLORS.creamDim, border: `1px solid ${COLORS.violet}` }}
              >
                <Icon name="RotateCcw" size={13} /> 重新開始（換活動）
              </button>
            )}
            {!editingStory && role === "host" && (
              <button onClick={enterTestPlayer} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: COLORS.bg, background: COLORS.gold, fontWeight: 700 }}>
                <Icon name="Drama" size={13} /> 測試：進入皮克敏介面
              </button>
            )}
            {!editingStory && role === "player" && (
              <button onClick={backToHost} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: COLORS.bg, background: COLORS.gold, fontWeight: 700 }}>
                <Icon name="Crown" size={13} /> 返回指揮官介面
              </button>
            )}
          </div>
        </div>
        <div className="flex items-center gap-1.5 mb-6 text-xs flex-wrap" style={{ color: role === "host" ? COLORS.goldDim : COLORS.cardEdge }}>
          {role === "host" ? <Icon name="Crown" size={13} /> : <Icon name="Drama" size={13} />}
          目前身份：{role === "host" ? "指揮官" : "皮克敏"}
          <span style={{ color: COLORS.creamDim }}>　·　{chapterLabel}</span>
          {myGroup && <span style={{ color: COLORS.creamDim }}>　·　第 {myGroup} 小隊</span>}
          <span style={{ color: syncOk ? COLORS.goldDim : COLORS.creamDim, opacity: 0.8 }}>　·　{syncOk ? "已連線同步" : "同步狀態未知"}</span>
          {role === "host" && roomReal === false && (
            <span style={{ color: COLORS.cardEdge, fontWeight: 700 }}>　·　⚠ 連不上同步伺服器，房間代碼目前無法給人加入</span>
          )}
          {role === "host" && (
            <button onClick={() => setRole("player-join")} className="ml-auto text-[11px] underline" style={{ color: COLORS.creamDim }}>
              我是皮克敏（輸入房間代碼加入）
            </button>
          )}
        </div>

        {!activity ? (
          role === "host" ? (
            <ActivitySelectScreen onSelect={(a) => pushState({ ...state, activity: a, stage: "intro" })} />
          ) : (
            <div className="text-center py-16 text-sm" style={{ color: COLORS.creamDim }}>等待指揮官選擇今天要進行的活動…</div>
          )
        ) : editingStory && role === "host" ? (
          <StoryEditor
            activity={activity}
            storyText={state.storyText[activity]}
            onSave={async (vals) => await pushState({ ...state, storyText: { ...state.storyText, [activity]: { ...state.storyText[activity], ...vals } } })}
            onCancel={() => setEditingStory(false)}
          />
        ) : (
          <>
            {role === "host" && roomRevealStages.includes(state.stage) && (
              <RoomCodePanel
                room={room}
                roomReal={roomReal}
                totalGroups={state.totalGroups}
                defaultOpen={roomRevealStages[0] === state.stage}
                onChangeTotal={(d) => pushState({ ...state, totalGroups: Math.min(20, Math.max(1, state.totalGroups + d)) })}
              />
            )}

            {state.stage === "intro" && (
              <StoryScreen text={state.storyText[activity].intro || STORY_DEFAULT[activity].intro} chapter="序章" buttonLabel="開始第一關：皮克敏迫降" showButton={role === "host"} onNext={() => pushState({ ...state, stage: nextStage(activity, "intro") })} />
            )}
            {state.stage === "cell" && role === "host" && <CellHostView state={state} pushState={pushState} activity={activity} />}
            {state.stage === "cell" && role === "player" && <CellPlayerView state={state} />}

            {(state.stage === "transition" || state.stage === "transition1" || state.stage === "transition2") && (
              <StoryScreen
                text={state.storyText[activity][state.stage] || STORY_DEFAULT[activity][state.stage]}
                chapter={chapterLabel}
                buttonLabel={state.stage === "transition2" ? "開始：偽裝洞穴" : (activity === "training" ? "開始：情報交換" : "開始：偽裝洞穴")}
                showButton={role === "host"}
                onNext={() => pushState({ ...state, stage: nextStage(activity, state.stage) })}
              />
            )}

            {state.stage === "ttol" && role === "host" && <TtolHostView state={state} pushState={pushState} />}
            {state.stage === "ttol" && role === "player" && mustPickGroup && <GroupSelectScreen totalGroups={state.totalGroups} onSelect={chooseGroup} />}
            {state.stage === "ttol" && role === "player" && !mustPickGroup && <TtolPlayerView state={state} submitProfile={submitProfile} submitGuess={submitGuess} myGroup={myGroup} myId={myIdRef.current} />}

            {state.stage === "bar" && role === "host" && <BarHostView cards={cards} state={state} pushState={pushState} pushCards={pushCards} />}
            {state.stage === "bar" && role === "player" && mustPickGroup && <GroupSelectScreen totalGroups={state.totalGroups} onSelect={chooseGroup} />}
            {state.stage === "bar" && role === "player" && !mustPickGroup && <BarPlayerView cards={cards} state={state} claimScenario={claimScenario} myGroup={myGroup} myId={myIdRef.current} />}
          </>
        )}
      </div>
    </div>
  );
}

/* 任何一處 render 例外原本都會讓整頁變成空白，現場沒人知道發生什麼事。
   這裡兜住例外並提供兩條退路：重新載入，或清掉本機資料後重新載入
   （本機資料含玩家身分與已加入的房間，資料本身壞掉時需要這條路）。 */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("畫面發生錯誤：", error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    const box = { background: COLORS.bg2, border: `1px solid ${COLORS.cardEdge}` };
    return (
      <div className="min-h-screen flex items-center justify-center px-6" style={{ background: COLORS.bg, fontFamily: "'Noto Sans TC', sans-serif" }}>
        <div className="max-w-sm w-full rounded-2xl p-6 text-center" style={box}>
          <div className="text-lg font-black mb-2" style={{ color: COLORS.cream, fontFamily: "'Noto Serif TC', serif" }}>畫面出了點問題</div>
          <p className="text-xs mb-5" style={{ color: COLORS.creamDim }}>
            遊戲進度存在伺服器上，重新載入通常就會恢復。若反覆出現，再試下面第二個按鈕。
          </p>
          <div className="flex flex-col gap-2">
            <button onClick={() => location.reload()} className="px-4 py-2.5 rounded-full font-bold text-sm" style={{ background: COLORS.gold, color: "#241A14" }}>
              重新載入
            </button>
            <button
              onClick={() => { try { localStorage.clear(); } catch (e) {} location.reload(); }}
              className="px-4 py-2.5 rounded-full text-sm"
              style={{ border: `1px solid ${COLORS.violet}`, color: COLORS.creamDim }}
            >
              清除本機資料並重新載入
            </button>
          </div>
          <pre className="text-[10px] mt-4 text-left overflow-x-auto" style={{ color: COLORS.creamDim, opacity: 0.7 }}>{String(this.state.error && this.state.error.message)}</pre>
        </div>
      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
