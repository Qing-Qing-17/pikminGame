/* 表演方式依序推進：先只能用動作，再來只能用表情，最後只能用聲音
   （這時要用書本或扇子把臉遮住）。由主持人按鈕切換，全場同步。 */
const PERF_MODES = [
  { id: "action", label: "動作", hint: "只能用肢體動作演繹，不能出聲、不能靠表情。" },
  { id: "face", label: "表情", hint: "只能用臉部表情演繹，不能出聲、不能用手比。" },
  { id: "sound", label: "聲音", hint: "只能用聲音演繹，而且必須拿書本或扇子把臉遮住。" },
];
function perfMode(id) { return PERF_MODES.find((m) => m.id === id) || PERF_MODES[0]; }

/* 取得某一段故事的頁面陣列。改寫過就用改寫的，否則用預設；
   舊版存的是一整段長字串，這裡一併相容成單頁。 */
function storyPages(storyText, activity, slot) {
  const custom = ((storyText || {})[activity] || {})[slot];
  const fallback = ((STORY_DEFAULT || {})[activity] || {})[slot] || [];
  const v = custom === undefined || custom === null || custom === "" ? fallback : custom;
  if (Array.isArray(v)) return v.filter((line) => String(line || "").trim());
  return String(v).split(/\n{2,}/).map((x) => x.trim()).filter(Boolean);
}

const DEFAULT_TIMER = 180;

const EMPTY_STATE = {
  hostTime: 0,    // 指揮官寫入當下的時鐘，用來校正各裝置的倒數
  activity: null, // 'star' | 'training'
  stage: "setup",
  cellTarget: 6, timerConfig: DEFAULT_TIMER, timerEndsAt: null, timerRunning: false,
  totalGroups: 6,
  storyText: { star: {}, training: {} },   // 只放「被改寫過」的段落，其餘用 STORY_DEFAULT
  cardId: null, cardRevealed: false, takenNumbers: {},
  ttol: { phase: "writing", profiles: {}, guesses: {} },
  storyPage: 0,            // 故事目前翻到第幾頁
  setupDone: false,        // 指揮官是否已設定完小隊數（設定完才顯示房間代碼）
  targetMode: "manual",    // 集合人數：manual 手動指定 / random 自動隨機
  perf: "action",          // 目前的表演方式
  guessers: {},            // { 小隊: 這一輪的猜題者號碼 }
};

/* takenNumbers 的格式是 { 小隊: { 情境號碼: 抽走它的玩家 id } }。
   記名而不是只記號碼，才能判斷「這張是不是我抽的」——重整頁面後可以還原自己的號碼，
   也才能在寫入後驗證自己的認領有沒有被別人蓋掉。舊格式是純號碼陣列，這裡一併相容。 */
function normalizeTaken(taken) {
  const out = {};
  Object.keys(taken || {}).forEach((g) => {
    const v = taken[g];
    if (Array.isArray(v)) { out[g] = {}; v.forEach((n) => { out[g][n] = "?"; }); }
    else if (v && typeof v === "object") { out[g] = { ...v }; }
  });
  return out;
}

/* 遠端讀回來的 state 一律補齊結構再用。少了這層，只要伺服器上那包 JSON 是舊版或不完整，
   畫面就會在存取 storyText[activity] / ttol.profiles 時整頁拋錯。 */
function normalizeState(raw) {
  if (!raw || typeof raw !== "object") return { ...EMPTY_STATE };
  const story = raw.storyText || {};
  const ttol = raw.ttol || {};
  return {
    ...EMPTY_STATE,
    ...raw,
    storyText: { star: story.star || {}, training: story.training || {} },
    storyPage: Math.max(0, Number(raw.storyPage) || 0),
    setupDone: !!raw.setupDone,
    targetMode: raw.targetMode === "random" ? "random" : "manual",
    perf: perfMode(raw.perf).id,
    guessers: fbMap(raw.guessers),
    takenNumbers: normalizeTaken(raw.takenNumbers),
    ttol: {
      phase: ttol.phase === "guessing" ? "guessing" : "writing",
      profiles: ttol.profiles || {},
      guesses: ttol.guesses || {},
    },
  };
}

/* 玩家身分要能撐過重新整理，否則重整後會變成一個全新的人：情報要重填、
   舊的那筆還會留在名單裡變成幽靈隊員，抽過的情境牌也會被允許再抽一次。 */
function loadOrCreateId() {
  const KEY = "pikmin.playerId";
  const fresh = () => `p${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) return saved;
    const id = fresh();
    localStorage.setItem(KEY, id);
    return id;
  } catch (e) { return fresh(); }
}
function loadGroup(room) {
  try { const g = localStorage.getItem(`pikmin.group.${room}`); return g ? Number(g) : null; } catch (e) { return null; }
}
function saveGroup(room, group) {
  try { localStorage.setItem(`pikmin.group.${room}`, String(group)); } catch (e) { /* 無痕模式等情況下略過 */ }
}

/* 哪一則是假情報，只留在本人的裝置上，絕不寫進共用狀態。
   共用狀態是每個玩家的瀏覽器每隔一兩秒就會完整抓下來的東西，
   把答案放進去等於公告給全場。改由本人的裝置擔任裁判：別人送出「我猜第幾則」，
   本人的裝置比對後才把判定結果寫回去。 */
function loadLie(room) {
  try { const v = localStorage.getItem(`pikmin.lie.${room}`); return v === null ? null : Number(v); } catch (e) { return null; }
}
function saveLie(room, idx) {
  try { localStorage.setItem(`pikmin.lie.${room}`, String(idx)); } catch (e) { /* 略過 */ }
}

/* 房間沒有任何存取控制：知道代碼的人都能寫、也能清空。真正的權限控管需要後端，
   kvdb 只是一個公開的鍵值儲存。在這個限制下能做的是讓破壞可以復原——
   指揮官每次寫入都在本機留一份備份，一旦偵測到房間資料被清掉就自動還原。 */
function saveBackup(room, state) {
  try { localStorage.setItem(`pikmin.backup.${room}`, JSON.stringify(state)); } catch (e) { /* 略過 */ }
}
function loadBackup(room) {
  try { const raw = localStorage.getItem(`pikmin.backup.${room}`); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}

/* ---------- Firebase Realtime Database（REST + SSE） ----------

   前一版把整包狀態塞進一個公開鍵值儲存（kvdb.io，已停止服務），沒有原子操作，
   所以得靠「讀取－合併－寫入－驗證－重試」加自我修復硬撐併發。改用 RTDB 之後
   這些補丁都不需要了：

   - PATCH 只合併指定欄位，兩個人寫不同路徑不可能互相覆蓋。
   - 每位玩家只寫自己的路徑（profiles/<我>、guesses/<對象>/<我>），零競爭。
   - 搶情境牌用 ETag 條件寫入（if-match），第二個人會收到 412，是真正的原子認領。
   - 用 SSE 即時推播取代輪詢。

   房間樹的結構：
     rooms/<代碼>/session   指揮官擁有的流程狀態
     rooms/<代碼>/cards     任務卡
     rooms/<代碼>/taken/<小隊>/<號碼>      = 認領者的玩家 id
     rooms/<代碼>/profiles/<玩家 id>        = 情報（不含答案）
     rooms/<代碼>/guesses/<對象>/<判讀者>   = { attempts, pick, result }
*/

/* ↓↓↓ 把 Firebase 的 Realtime Database 網址貼在這裡 ↓↓↓
   長得像 https://專案名-default-rtdb.asia-southeast1.firebasedatabase.app
   用 REST 不需要 API key，只要這一個網址。留空的話會進入單機模式。 */
const FIREBASE_DB_URL = "https://pikmingame-3d82e-default-rtdb.asia-southeast1.firebasedatabase.app";
/* ↑↑↑ 取得方式見 README 的〈設定 Firebase〉 ↑↑↑ */

function dbConfigured() { return /^https?:\/\//.test(String(FIREBASE_DB_URL || "")); }

/* 倒數是用「結束時刻」在各裝置本地換算的，每支手機的系統時鐘一有偏差，看到的剩餘秒數
   就不一樣（差幾分鐘的手機並不罕見）。以指揮官的時鐘為共同基準：他每次寫入都蓋上時戳，
   玩家用它推算偏移量。取樣一定低估——狀態是先被寫入、稍後才推播到玩家——所以取歷次
   觀察到的最大值最接近真值。 */
let hostClockOffset = 0;
let haveHostSample = false;
let lastHostStamp = 0;
function noteHostTime(stamp) {
  if (!stamp || stamp === lastHostStamp) return;
  lastHostStamp = stamp;
  const candidate = stamp - Date.now();
  if (!haveHostSample || candidate > hostClockOffset) { hostClockOffset = candidate; haveHostSample = true; }
}
function now() { return Date.now() + hostClockOffset; }

/* 網址可能自帶查詢字串（測試用的本地模擬器需要 ?ns=），所以要保留它 */
function dbUrl(path, extraQuery) {
  const raw = String(FIREBASE_DB_URL || "");
  const q = raw.indexOf("?");
  const origin = (q >= 0 ? raw.slice(0, q) : raw).replace(/\/+$/, "");
  const carried = q >= 0 ? raw.slice(q + 1) : "";
  const qs = [carried, extraQuery].filter(Boolean).join("&");
  return `${origin}/${path}.json${qs ? "?" + qs : ""}`;
}

/* Firebase 會把鍵值為連續整數的物件回成陣列（中間沒有的位置是 null）。
   我們的小隊與情境號碼都是數字，所以每次讀取都要正規化回物件。 */
function fbMap(v) {
  if (v === null || v === undefined) return {};
  if (Array.isArray(v)) {
    const out = {};
    v.forEach((item, i) => { if (item !== null && item !== undefined) out[String(i)] = item; });
    return out;
  }
  return typeof v === "object" ? v : {};
}

/* 記下最後一次失敗的原因。原本不論規則被拒、網址打錯還是斷網，畫面都只說
   「連不上同步伺服器」，排查時完全沒有線索——那是最花時間的一種錯誤訊息。 */
let lastDbError = null;
async function noteHttpError(res) {
  let message = "";
  try {
    const text = await res.text();
    try { message = (JSON.parse(text) || {}).error || text; } catch (e) { message = text; }
  } catch (e) { /* 讀不到內容就算了 */ }
  lastDbError = { kind: "http", status: res.status, message: String(message).slice(0, 200) };
}
function noteNetworkError() { lastDbError = { kind: "network" }; }

/* 把失敗原因翻成看得懂、而且知道下一步該做什麼的說明 */
function describeDbError() {
  if (!dbConfigured()) return "這個網站還沒有填入 Firebase 資料庫網址。";
  const e = lastDbError;
  if (!e) return "連不上同步伺服器。";
  if (e.kind === "network") {
    return "連不上資料庫。可能是網路不通，或 index.html 裡的資料庫網址打錯了。";
  }
  if (e.status === 401 || e.status === 403 || /permission denied/i.test(e.message)) {
    return "Firebase 拒絕存取（權限不足）。請到 Firebase 主控台 → Realtime Database → 規則，" +
      "確認不是「鎖定模式」，或改用 README 裡那組規則。測試模式的規則過了 30 天也會變成拒絕。";
  }
  if (e.status === 404) return "找不到這個資料庫，請確認 index.html 裡的資料庫網址是否正確。";
  return `資料庫回應了錯誤（HTTP ${e.status}）：${e.message || "沒有說明"}`;
}

async function dbGet(path) {
  if (!dbConfigured()) return { status: "error", value: null };
  try {
    const res = await fetch(dbUrl(path));
    if (!res.ok) { await noteHttpError(res); return { status: "error", value: null }; }
    const value = await res.json();
    return { status: value === null ? "missing" : "ok", value };
  } catch (e) { noteNetworkError(); return { status: "error", value: null }; }
}

async function dbPut(path, value) {
  if (!dbConfigured()) return false;
  try {
    const res = await fetch(dbUrl(path), {
      method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(value),
    });
    if (!res.ok) await noteHttpError(res);
    return res.ok;
  } catch (e) { noteNetworkError(); return false; }
}

/* 只更新傳進來的欄位，其餘原封不動——這是取代整包覆寫的關鍵 */
async function dbPatch(path, obj) {
  if (!dbConfigured()) return false;
  try {
    const res = await fetch(dbUrl(path), {
      method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(obj),
    });
    if (!res.ok) await noteHttpError(res);
    return res.ok;
  } catch (e) { noteNetworkError(); return false; }
}

/* 原子認領：只有在該位置目前是空的時候才寫得進去。
   先取得 ETag，再用 if-match 寫入；別人搶先一步時伺服器回 412。 */
async function dbClaim(path, value) {
  if (!dbConfigured()) return "error";
  try {
    const head = await fetch(dbUrl(path), { headers: { "X-Firebase-ETag": "true" } });
    if (!head.ok) return "error";
    const etag = head.headers.get("etag");
    const current = await head.json();
    if (current !== null && current !== undefined) return current === value ? "won" : "taken";
    if (!etag) return "error"; // 讀不到 ETag 就不能保證原子性，交給呼叫端重試
    const res = await fetch(dbUrl(path), {
      method: "PUT",
      headers: { "content-type": "application/json", "if-match": etag },
      body: JSON.stringify(value),
    });
    if (res.status === 412) return "taken";
    return res.ok ? "won" : "error";
  } catch (e) { return "error"; }
}

/* 即時訂閱一整棵子樹。Firebase 以 SSE 推送 put（整段取代）與 patch（部分合併），
   我們在本地維護一份鏡像，每次變動就把整棵樹交給呼叫端。 */
function setIn(tree, path, data) {
  const parts = String(path || "/").split("/").filter(Boolean);
  if (parts.length === 0) return data;
  const root = (tree && typeof tree === "object") ? (Array.isArray(tree) ? [...tree] : { ...tree }) : {};
  let node = root;
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i];
    const child = node[k];
    node[k] = (child && typeof child === "object") ? (Array.isArray(child) ? [...child] : { ...child }) : {};
    node = node[k];
  }
  const last = parts[parts.length - 1];
  if (data === null || data === undefined) delete node[last];
  else node[last] = data;
  return root;
}

function dbStream(path, onTree, onError) {
  if (!dbConfigured() || typeof EventSource === "undefined") return () => {};
  let tree = null;
  let closed = false;
  const es = new EventSource(dbUrl(path));

  const handle = (isPatch) => (ev) => {
    if (closed) return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (!msg) return;
    if (isPatch) {
      // patch 的 data 是「這個路徑底下要合併的鍵值」
      Object.keys(msg.data || {}).forEach((k) => {
        tree = setIn(tree, `${msg.path === "/" ? "" : msg.path}/${k}`, msg.data[k]);
      });
    } else {
      tree = setIn(tree, msg.path, msg.data);
    }
    onTree(tree);
  };

  es.addEventListener("put", handle(false));
  es.addEventListener("patch", handle(true));
  es.addEventListener("cancel", () => { if (onError) onError("cancel"); });
  es.onerror = () => { if (!closed && onError) onError("network"); };

  return () => { closed = true; try { es.close(); } catch (e) {} };
}

async function dbReachable() {
  if (!dbConfigured()) return false;
  const r = await dbGet(".info/serverTimeOffset");
  return r.status !== "error";
}

/* 房間代碼是六位純數字：現場念出來不會有「B 還是 D」「M 還是 N」的困擾，
   手機也會自動跳出數字鍵盤，比英數混合快很多。 */
function newRoomCode() {
  let s = "";
  for (let i = 0; i < 6; i++) s += String(Math.floor(Math.random() * 10));
  return s;
}

/* 給皮克敏的連結：直接落在輸入房間代碼的畫面，不用先看到指揮官介面再自己找入口。 */
function joinLink(room) {
  if (typeof location === "undefined") return "";
  const base = location.origin + location.pathname;
  return room ? `${base}?join=${encodeURIComponent(room)}` : `${base}?join`;
}
function readJoinParam() {
  try {
    const p = new URLSearchParams(location.search);
    if (!p.has("join")) return null;
    return { code: (p.get("join") || "").trim() };
  } catch (e) { return null; }
}

async function createRoom(attempts = 5) {
  if (!dbConfigured()) return null;
  for (let i = 0; i < attempts; i++) {
    const code = newRoomCode();
    const existing = await dbGet(`rooms/${code}/session`);
    if (existing.status === "error") return null;
    if (existing.status === "missing") {
      const ok = await dbPut(`rooms/${code}/session`, { createdAt: Date.now() });
      return ok ? code : null;
    }
  }
  return null;
}

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60), r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}
function useRemainingSeconds(state) {
  const [, setTick] = useState(0);
  useEffect(() => {
    if (!state.timerRunning) return;
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, [state.timerRunning]);
  if (state.timerRunning && state.timerEndsAt) return Math.max(0, Math.round((state.timerEndsAt - now()) / 1000));
  return state.timerConfig;
}
function nextStage(activity, current) {
  const flow = STAGE_FLOW[activity];
  const idx = flow.indexOf(current);
  return flow[Math.min(idx + 1, flow.length - 1)];
}
function prevStage(activity, current) {
  const flow = STAGE_FLOW[activity];
  const idx = flow.indexOf(current);
  return flow[Math.max(idx - 1, 0)];
}
function isFirstStage(activity, current) { return STAGE_FLOW[activity].indexOf(current) <= 0; }

      </p>
      {slots.map((k) => (
        <div key={k}>
          <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>
            編輯{labels[k]}（目前 {vals[k].split("\n").filter((x) => x.trim()).length} 頁）
          </div>
          <textarea
            value={vals[k]}
            onChange={(e) => setVals((v) => ({ ...v, [k]: e.target.value }))}
            rows={10}
            aria-label={`編輯${labels[k]}`}
            className="w-full px-3 py-2 rounded-lg text-sm outline-none mb-5"
            style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.blue}`, lineHeight: 1.9 }}
          />
        </div>
      ))}
      {status === "ok" && <div className="text-xs mb-3" style={{ color: COLORS.amber }}>✓ 已儲存，其他裝置會立刻看到最新內容。</div>}
      {status === "fail" && <div className="text-xs mb-3" style={{ color: COLORS.red }}>✕ 儲存失敗，請檢查網路連線後再試一次。</div>}
      <div className="flex gap-3">
        <button onClick={handleSave} disabled={status === "saving"} className="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-60" style={{ background: COLORS.yellow, color: "#241A14" }}>
          {status === "saving" ? "儲存中…" : "儲存"}
        </button>
        <button onClick={onCancel} className="px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}>返回</button>
      </div>
    </div>
  );
}

/* ---------- QR code（自己實作，不依賴任何外部套件） ----------
   只需要支援「短網址、位元組模式、糾錯等級 M」這一種用途，所以刻意做得精簡：
   版本 1～10 足以放進一段 GitHub Pages 網址。 */

// GF(256) 對數表，Reed-Solomon 用
const GF_EXP = new Uint8Array(512);
const GF_LOG = new Uint8Array(256);
(function initGF() {
  let x = 1;
  for (let i = 0; i < 255; i++) {
    GF_EXP[i] = x;
    GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
})();
const gfMul = (a, b) => (a === 0 || b === 0 ? 0 : GF_EXP[GF_LOG[a] + GF_LOG[b]]);

function rsGenerator(degree) {
  let poly = [1];
  for (let i = 0; i < degree; i++) {
    const next = new Array(poly.length + 1).fill(0);
    for (let j = 0; j < poly.length; j++) {
      // 索引 0 是最高次項：乘 x 留在同一格，乘常數項 α^i 往後移一格。
      // 這兩行寫反的話，生成多項式的首項係數就不是 1，糾錯碼字整段都會錯。
      next[j] ^= poly[j];
      next[j + 1] ^= gfMul(poly[j], GF_EXP[i]);
    }
    poly = next;
  }
  return poly;
}

function rsEncode(data, ecLen) {
  const gen = rsGenerator(ecLen);
  const res = new Array(ecLen).fill(0);
  for (const byte of data) {
    const factor = byte ^ res[0];
    res.shift();
    res.push(0);
    for (let i = 0; i < ecLen; i++) res[i] ^= gfMul(gen[i + 1], factor);
  }
  return res;
}

/* 各版本在糾錯等級 M 下的參數：[資料碼字總數, 每組的糾錯碼字數, 第一群組區塊數, 第二群組區塊數] */
const QR_M = {
  1: [16, 10, 1, 0], 2: [28, 16, 1, 0], 3: [44, 26, 1, 0], 4: [64, 18, 2, 0],
  5: [86, 24, 2, 0], 6: [108, 16, 4, 0], 7: [124, 18, 4, 0], 8: [154, 22, 2, 2],
  9: [182, 22, 3, 2], 10: [216, 26, 4, 1],
};
const ALIGN_POS = {
  1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
  6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50],
};

function qrEncode(text) {
  const bytes = new TextEncoder().encode(text);
  let version = 0;
  for (let v = 1; v <= 10; v++) {
    const cap = QR_M[v][0] - 2 - (v >= 10 ? 1 : 0); // 模式(4bit)+長度(8 或 16bit)
    if (bytes.length <= cap) { version = v; break; }
  }
  if (!version) throw new Error("內容太長，超過這個 QR 實作支援的範圍");

  const [totalData, ecPerBlock, g1, g2] = QR_M[version];
  const lenBits = version >= 10 ? 16 : 8;

  // 組出位元流：模式 0100（位元組）＋長度＋內容＋結束符
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4);
  push(bytes.length, lenBits);
  for (const b of bytes) push(b, 8);
  const capacityBits = totalData * 8;
  for (let i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);
  const dataBytes = [];
  for (let i = 0; i < bits.length; i += 8) {
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    dataBytes.push(v);
  }
  const PAD = [0xec, 0x11];
  let padIdx = 0;
  while (dataBytes.length < totalData) dataBytes.push(PAD[padIdx++ % 2]);

  // 分區塊、各自算糾錯碼，再交錯排列
  const numBlocks = g1 + g2;
  const shortLen = Math.floor(totalData / numBlocks);
  const blocks = [];
  let pos = 0;
  for (let i = 0; i < numBlocks; i++) {
    const len = i < g1 ? shortLen : shortLen + 1;
    const chunk = dataBytes.slice(pos, pos + len);
    pos += len;
    blocks.push({ data: chunk, ec: rsEncode(chunk, ecPerBlock) });
  }
  const finalBytes = [];
  const maxData = Math.max(...blocks.map((b) => b.data.length));
  for (let i = 0; i < maxData; i++) for (const b of blocks) if (i < b.data.length) finalBytes.push(b.data[i]);
  for (let i = 0; i < ecPerBlock; i++) for (const b of blocks) finalBytes.push(b.ec[i]);

  // 鋪成矩陣
  const size = version * 4 + 17;
  const modules = Array.from({ length: size }, () => new Array(size).fill(null));
  const reserve = Array.from({ length: size }, () => new Array(size).fill(false));

  function placeFinder(r, c) {
    for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) {
      const rr = r + dr, cc = c + dc;
      if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
      const inRing = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6 &&
        (dr === 0 || dr === 6 || dc === 0 || dc === 6 || (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4));
      modules[rr][cc] = inRing ? 1 : 0;
      reserve[rr][cc] = true;
    }
  }
  placeFinder(0, 0); placeFinder(0, size - 7); placeFinder(size - 7, 0);

  for (let i = 8; i < size - 8; i++) {
    const v = i % 2 === 0 ? 1 : 0;
    modules[6][i] = v; reserve[6][i] = true;
    modules[i][6] = v; reserve[i][6] = true;
  }

  const aligns = ALIGN_POS[version];
  for (const r of aligns) for (const c of aligns) {
    if ((r === 6 && c === 6) || (r === 6 && c === size - 7) || (r === size - 7 && c === 6)) continue;
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      const on = Math.max(Math.abs(dr), Math.abs(dc)) !== 1;
      modules[r + dr][c + dc] = on ? 1 : 0;
      reserve[r + dr][c + dc] = true;
    }
  }

  // 保留格式資訊與版本資訊的位置
  for (let i = 0; i < 9; i++) {
    if (!reserve[8][i]) { reserve[8][i] = true; modules[8][i] = 0; }
    if (!reserve[i][8]) { reserve[i][8] = true; modules[i][8] = 0; }
  }
  for (let i = 0; i < 8; i++) {
    reserve[8][size - 1 - i] = true; modules[8][size - 1 - i] = 0;
    reserve[size - 1 - i][8] = true; modules[size - 1 - i][8] = 0;
  }
  modules[size - 8][8] = 1; reserve[size - 8][8] = true; // 固定的暗模組
  if (version >= 7) {
    for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) {
      reserve[i][size - 11 + j] = true; modules[i][size - 11 + j] = 0;
      reserve[size - 11 + j][i] = true; modules[size - 11 + j][i] = 0;
    }
  }

  // 依 Z 字型把資料填進去
  let bitIdx = 0;
  const dataBits = [];
  for (const b of finalBytes) for (let i = 7; i >= 0; i--) dataBits.push((b >> i) & 1);
  let upward = true;
  for (let col = size - 1; col > 0; col -= 2) {
    if (col === 6) col--;
    for (let n = 0; n < size; n++) {
      const row = upward ? size - 1 - n : n;
      for (let k = 0; k < 2; k++) {
        const c = col - k;
        if (reserve[row][c]) continue;
        modules[row][c] = bitIdx < dataBits.length ? dataBits[bitIdx++] : 0;
      }
    }
    upward = !upward;
  }

  // 遮罩：挑罰分最低的
  const MASKS = [
    (r, c) => (r + c) % 2 === 0, (r, c) => r % 2 === 0, (r, c) => c % 3 === 0,
    (r, c) => (r + c) % 3 === 0, (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
    (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0, (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
    (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0,
  ];
  const FORMAT_M = [0x5412, 0x5125, 0x5e7c, 0x5b4b, 0x45f9, 0x40ce, 0x4f97, 0x4aa0];

  /* 格式資訊共 15 位元，兩份都以「位元 14 → 0」的順序沿著固定路徑排列。
     順序寫反了就整張掃不出來——這是實作時最容易踩到的一步。 */
  function applyFormat(grid, maskId) {
    const fmt = FORMAT_M[maskId];
    const bitAt = (i) => (fmt >> (14 - i)) & 1;
    const copy1 = [[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    copy1.forEach(([r, c], i) => { grid[r][c] = bitAt(i); });
    const copy2 = [];
    for (let i = 0; i <= 6; i++) copy2.push([size - 1 - i, 8]);   // 左下，由下往上
    for (let i = 0; i <= 7; i++) copy2.push([8, size - 8 + i]);   // 右上，由左往右
    copy2.forEach(([r, c], i) => { grid[r][c] = bitAt(i); });
    grid[size - 8][8] = 1;                                        // 固定的暗模組
  }

  function penalty(grid) {
    let score = 0;
    for (let r = 0; r < size; r++) {
      for (const line of [grid[r], grid.map((row) => row[r])]) {
        let run = 1;
        for (let i = 1; i < size; i++) {
          if (line[i] === line[i - 1]) run++;
          else { if (run >= 5) score += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) score += 3 + (run - 5);
      }
    }
    for (let r = 0; r < size - 1; r++) for (let c = 0; c < size - 1; c++) {
      const v = grid[r][c];
      if (v === grid[r][c + 1] && v === grid[r + 1][c] && v === grid[r + 1][c + 1]) score += 3;
    }
    let dark = 0;
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) dark += grid[r][c];
    score += Math.floor(Math.abs((dark * 100) / (size * size) - 50) / 5) * 10;
    return score;
  }

  let best = null;
  for (let m = 0; m < 8; m++) {
    const grid = modules.map((row) => row.slice());
    for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
      if (!reserve[r][c] && MASKS[m](r, c)) grid[r][c] ^= 1;
    }
    applyFormat(grid, m);
    if (version >= 7) {
      const VER_BITS = { 7: 0x07c94, 8: 0x085bc, 9: 0x09a99, 10: 0x0a4d3 };
      const vb = VER_BITS[version];
      for (let i = 0; i < 18; i++) {
        const bit = (vb >> i) & 1;
        grid[Math.floor(i / 3)][size - 11 + (i % 3)] = bit;
        grid[size - 11 + (i % 3)][Math.floor(i / 3)] = bit;
      }
    }
    const p = penalty(grid);
    if (!best || p < best.penalty) best = { grid, penalty: p };
  }
  return best.grid;
}

/* 把 QR 畫成 SVG——不用 canvas，列印或縮放都不會糊。 */
function QRCode({ text, size = 200, quiet = 4 }) {
  const grid = useMemo(() => {
    try { return qrEncode(text); } catch (e) { return null; }
  }, [text]);
  if (!grid) return null;
  const n = grid.length;
  const total = n + quiet * 2;
  const rects = [];
  for (let r = 0; r < n; r++) {
    let c = 0;
    while (c < n) {
      if (!grid[r][c]) { c++; continue; }
      let len = 1;
      while (c + len < n && grid[r][c + len]) len++;
      rects.push(<rect key={`${r}-${c}`} x={c + quiet} y={r + quiet} width={len} height={1} fill="#1B3A4B" />);
      c += len;
    }
  }
  return (
    <svg
      data-testid="qr"
      width={size} height={size}
      viewBox={`0 0 ${total} ${total}`}
      shapeRendering="crispEdges"
      role="img"
      aria-label="加入遊戲的 QR code"
      style={{ background: "#FFFFFF", borderRadius: 8 }}
    >
      <rect x="0" y="0" width={total} height={total} fill="#FFFFFF" />
      {rects}
    </svg>
  );
}

/* 「設定」關：先把小隊數定下來，再產生房間代碼與 QR code 讓大家掃進來，

        </div>
        <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>今天總共要分成幾個小隊？設定好之後才會產生房間代碼。</p>
        <button onClick={onSetupDone} className="px-8 py-3.5 rounded-full font-bold text-base" style={{ background: COLORS.yellow, color: "#241A14" }}>
          就是 {totalGroups} 隊，產生房間代碼
        </button>

  return (
    <div data-testid="room-ready" className="rounded-2xl p-8 mb-6 text-center" style={{ background: COLORS.panel, border: `2px solid ${COLORS.amber}` }}>
      <div className="flex items-center justify-center gap-1.5 text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.amber }}>
        <Icon name="KeyRound" size={13} /> 第二步：讓皮克敏加入
      </div>

      {roomReal === false ? (
        <div className="text-xs mb-4 px-3 py-3 rounded-lg text-left" style={{ color: COLORS.red, background: COLORS.bg, border: `1px solid ${COLORS.red}` }}>

          <div style={{ opacity: 0.85 }}>指揮官這台裝置的流程照樣走得完，只是大家的手機連不進來。</div>
        </div>
      ) : (
        <div className="text-sm mb-4" style={{ color: COLORS.inkSoft }}>請大家用手機相機掃下面的 QR code，或自己輸入這組代碼：</div>
      )}

      <div className="text-7xl font-black tracking-[0.15em] mb-5" style={{ color: roomReal === false ? COLORS.inkSoft : COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>{room || "…"}</div>

        <div className="flex flex-col items-center mb-5">

        </div>
      )}

      <div className="flex items-center justify-center gap-3 mb-6">

        <button onClick={() => onChangeTotal(1)} aria-label="小隊數量加一" className="w-8 h-8 rounded-full text-lg font-bold" style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}>＋</button>
      </div>

          {joining ? "加入中…" : "加入遊戲"}
        </button>
      </div>
    </div>
  );
}

/* ---------- 皮克敏迫降 ---------- */
/* 自動隨機模式下，每隔這個區間換一次集合人數（測試會把它換成很短的值）。 */
const AUTO_TARGET_RANGE_MS = [60000, 120000];

/* 倒數計時器改成隨開隨關的小工具：平常不佔畫面，需要時打開，
   還可以縮小成一顆浮動的小按鈕，繼續看時間又不擋住底下的操作。 */
function TimerTool({ state, pushState, onClose }) {
  const [minimized, setMinimized] = useState(false);
  const remaining = useRemainingSeconds(state);
  const timeUpHandled = useRef(false);

  useEffect(() => {
    if (state.timerRunning && remaining <= 0 && !timeUpHandled.current) {
      timeUpHandled.current = true;
      pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: 0 });
    }
    if (!state.timerRunning) timeUpHandled.current = false;
  }, [remaining, state.timerRunning]); // eslint-disable-line react-hooks/exhaustive-deps

  function setPreset(sec) { if (!state.timerRunning) pushState({ ...state, timerConfig: sec, timerEndsAt: null }); }
  function start() { pushState({ ...state, timerRunning: true, timerEndsAt: now() + (state.timerConfig || 1) * 1000 }); }
  function pause() {
    const rem = state.timerEndsAt ? Math.max(0, Math.round((state.timerEndsAt - now()) / 1000)) : state.timerConfig;
    pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: rem });
  }
  function reset() { pushState({ ...state, timerRunning: false, timerEndsAt: null, timerConfig: DEFAULT_TIMER }); }

  const timeUp = !state.timerRunning && state.timerConfig === 0;

  if (minimized) {
    return (
      <button
        data-testid="timer-mini"
        onClick={() => setMinimized(false)}
        className="fixed bottom-5 right-5 z-40 flex items-center gap-2 px-5 py-3 rounded-full shadow-lg"
        style={{ background: timeUp ? COLORS.red : COLORS.panel, color: timeUp ? "#FFFFFF" : COLORS.ink, border: `2px solid ${timeUp ? COLORS.red : COLORS.amber}` }}
        aria-label="展開倒數計時器"
      >
        <Icon name="TimerIcon" size={16} />
        <span className="text-2xl font-black tabular-nums" style={{ fontFamily: "'Noto Serif TC', serif" }}>{formatTime(remaining)}</span>
      </button>
    );
  }

  return (
    <div data-testid="timer-tool" className="fixed inset-0 z-40 flex items-center justify-center px-5" style={{ background: "rgba(20,40,55,0.55)" }}>
      <div className="w-full max-w-lg rounded-3xl p-8 text-center" style={{ background: COLORS.panel, border: `2px solid ${COLORS.amber}` }}>
        <div className="flex items-center justify-center gap-1.5 text-xs uppercase tracking-widest mb-4" style={{ color: COLORS.inkSoft }}>
          <Icon name="TimerIcon" size={14} /> 倒數計時器
        </div>

        <div className="text-7xl sm:text-8xl font-black leading-none mb-2 tabular-nums" style={{ color: timeUp ? COLORS.red : COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>
          {formatTime(remaining)}
        </div>
        {timeUp && <div className="text-base font-bold mb-4" style={{ color: COLORS.red }}>時間到！還沒集合成功的皮克敏出局</div>}

        {!state.timerRunning && (
          <div className="flex gap-2 justify-center my-5 flex-wrap">
            {[60, 120, 180, 300].map((sec) => (
              <button key={sec} onClick={() => setPreset(sec)} className="px-4 py-2 rounded-full text-sm"
                style={state.timerConfig === sec
                  ? { background: COLORS.yellow, color: "#241A14", fontWeight: 700 }
                  : { border: `1px solid ${COLORS.amber}`, color: COLORS.inkSoft }}>
                {formatTime(sec)}
              </button>
            ))}
          </div>
        )}

        <div className="flex gap-3 justify-center mb-6 mt-4">
          {!state.timerRunning ? (
            <button onClick={start} disabled={remaining <= 0} className="flex items-center gap-2 px-7 py-3 rounded-full font-bold text-base disabled:opacity-40" style={{ background: COLORS.yellow, color: "#241A14" }}>
              <Icon name="Play" size={18} /> 開始
            </button>
          ) : (
            <button onClick={pause} className="flex items-center gap-2 px-7 py-3 rounded-full font-bold text-base" style={{ background: COLORS.yellow, color: "#241A14" }}>
              <Icon name="Pause" size={18} /> 暫停
            </button>
          )}
          <button onClick={reset} className="flex items-center gap-2 px-5 py-3 rounded-full text-base" style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}>
            <Icon name="RotateCcw" size={16} /> 重置
          </button>
        </div>

        <div className="flex gap-3 justify-center pt-4" style={{ borderTop: `1px solid ${COLORS.bg}` }}>
          <button onClick={onClose} className="flex items-center gap-2 px-5 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}>
            <Icon name="ArrowLeft" size={15} /> 返回
          </button>
          <button onClick={() => setMinimized(true)} className="px-5 py-2.5 rounded-full text-sm font-bold" style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.amber}` }}>
            縮小視窗
          </button>
        </div>
        <p className="text-xs mt-4" style={{ color: COLORS.inkSoft }}>縮小之後會變成右下角的小按鈕，計時繼續跑，也不擋住底下的操作。</p>
      </div>
    </div>
  );
}

function CellHostView({ state, pushState, activity }) {
  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);
  const [nextChangeAt, setNextChangeAt] = useState(null);
  const [, tick] = useState(0);

  function adjustTarget(delta) { pushState({ ...state, cellTarget: Math.min(30, Math.max(2, state.cellTarget + delta)) }); }
  function rollTarget(base) {
    let n = 2 + Math.floor(Math.random() * 7);
    if (n === base.cellTarget) n = 2 + ((n) % 7); // 盡量不要連續兩次同一個數字
    return n;
  }

  /* 自動隨機：每 1～2 分鐘自己換一個數字，主持人不用一直按。 */
  useEffect(() => {
    if (state.targetMode !== "random") { setNextChangeAt(null); return; }
    let cancelled = false;
    let timer = null;
    const schedule = () => {
      const [lo, hi] = AUTO_TARGET_RANGE_MS;
      const ms = lo + Math.random() * (hi - lo);
      setNextChangeAt(Date.now() + ms);
      timer = setTimeout(() => {
        if (cancelled) return;
        const base = stateRef.current;
        pushState({ ...base, cellTarget: rollTarget(base) });
        schedule();
      }, ms);
    };
    schedule();
    return () => { cancelled = true; if (timer) clearTimeout(timer); };
  }, [state.targetMode]); // eslint-disable-line react-hooks/exhaustive-deps

  // 讓「下次換人數」的倒數每秒重畫
  useEffect(() => {
    if (!nextChangeAt) return;
    const id = setInterval(() => tick((n) => n + 1), 1000);
    return () => clearInterval(id);
  }, [nextChangeAt]);

  const secsToChange = nextChangeAt ? Math.max(0, Math.round((nextChangeAt - Date.now()) / 1000)) : null;

  return (
    <div>
      <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
        這個畫面給指揮官自己看／投影用。集合行動在現場真人進行，這裡負責公布目前需要的皮克敏數量。音樂請用外部播放器。
      </p>

      <div className="rounded-2xl p-6 mb-5 text-center" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
        <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.inkSoft }}>目前需要集合的皮克敏數量</div>
        <div data-testid="cell-target" className="text-8xl sm:text-9xl font-black leading-none mb-5" style={{ color: COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>{state.cellTarget}</div>

        <div className="inline-flex rounded-full p-1 mb-4" style={{ background: COLORS.bg }}>
          {[["manual", "手動指定"], ["random", "自動隨機"]].map(([id, label]) => (
            <button
              key={id}
              onClick={() => pushState({ ...state, targetMode: id })}
              className="px-4 py-1.5 rounded-full text-sm font-bold"
              style={state.targetMode === id
                ? { background: COLORS.yellow, color: "#241A14" }
                : { background: "transparent", color: COLORS.inkSoft }}
            >{label}</button>
          ))}
        </div>

        {state.targetMode === "manual" ? (
          <div className="flex items-center justify-center gap-5">
            <button onClick={() => adjustTarget(-1)} aria-label="集合人數減一" className="w-12 h-12 rounded-full text-2xl font-bold" style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}>−</button>
            <button onClick={() => adjustTarget(1)} aria-label="集合人數加一" className="w-12 h-12 rounded-full text-2xl font-bold" style={{ background: COLORS.bg, color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}>＋</button>
          </div>
        ) : (
          <div>
            <div data-testid="auto-hint" className="text-sm mb-3" style={{ color: COLORS.inkSoft }}>
              每 {Math.round(AUTO_TARGET_RANGE_MS[0] / 60000 * 10) / 10}～{Math.round(AUTO_TARGET_RANGE_MS[1] / 60000 * 10) / 10} 分鐘自動換一次{secsToChange !== null && <>，下次約在 <span style={{ color: COLORS.amber, fontWeight: 700 }}>{secsToChange}</span> 秒後</>}
            </div>
            <button onClick={() => pushState({ ...state, cellTarget: rollTarget(state) })} className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold" style={{ border: `1px solid ${COLORS.red}`, color: COLORS.red }}>
              <Icon name="Dices" size={16} /> 現在就換一個
            </button>
          </div>
        )}
      </div>

      <button onClick={() => pushState({ ...state, stage: nextStage(activity, "cell"), storyPage: 0 })} className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-full font-bold text-base" style={{ border: `1px solid ${COLORS.yellow}`, color: COLORS.amber }}>
        前往下一關 <Icon name="ChevronRight" size={18} />
      </button>
    </div>
  );
}

function BarHostView({ cards, state, pushState, pushCards }) {
  const [mode, setMode] = useState("game");
  const [flipping, setFlipping] = useState(false);
  const currentCard = state.cardId ? cards.find((c) => c.id === state.cardId) || null : null;
  const poolSize = currentCard ? currentCard.scenarios.filter((s) => s && s.trim()).length : 8;

  /* 翻牌動畫是純視覺效果，用本地 flipping 做就好；原本為了動畫而連寫兩次遠端狀態，
     等於多開一個會覆蓋玩家資料的時間窗。抽新卡本來就要清空該輪的認領，所以明確重置。 */
  /* 抽新的任務卡時，同時替每個小隊各抽一位猜題者。
     猜題者的號碼一樣要被某個人抽走——抽到那個號碼的人就是猜題者，他不表演，
     負責猜同隊其他人演的是什麼。所以每隊各抽一個，不是全場共用同一個號碼。 */
  async function drawCard() {
    if (cards.length === 0) return;
    const card = cards[Math.floor(Math.random() * cards.length)];
    const usable = card.scenarios.map((s, i) => (s && s.trim() ? i + 1 : 0)).filter(Boolean);
    const guessers = {};
    for (let g = 1; g <= state.totalGroups; g++) {
      guessers[g] = usable.length ? usable[Math.floor(Math.random() * usable.length)] : 0;
    }
    setFlipping(true);
    await pushState({ ...state, cardId: card.id, cardRevealed: true, takenNumbers: {}, guessers }, { resetPlayerData: true });
    setTimeout(() => setFlipping(false), 60);
  }
  function resetDraw() { pushState({ ...state, cardId: null, cardRevealed: false, takenNumbers: {}, guessers: {} }, { resetPlayerData: true }); }
  function addCard() {
    const id = `c${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    pushCards([...cards, { id, line: "新的一句話", scenarios: Array(8).fill("") }]);
  }
  function updateLine(idx, val) { pushCards(cards.map((c, i) => (i === idx ? { ...c, line: val } : c)), { debounce: true }); }
  function updateScenario(idx, sceneIdx, val) { pushCards(cards.map((c, i) => (i === idx ? { ...c, scenarios: c.scenarios.map((s, j) => (j === sceneIdx ? val : s)) } : c)), { debounce: true }); }
  function deleteCard(idx) { pushCards(cards.filter((_, i) => i !== idx)); }

  return (
    <>
      <div className="flex justify-end mb-4">
        <button onClick={() => setMode(mode === "game" ? "edit" : "game")} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-full transition-colors" style={{ color: mode === "edit" ? COLORS.bg : COLORS.inkSoft, background: mode === "edit" ? COLORS.yellow : "transparent", border: `1px solid ${mode === "edit" ? COLORS.yellow : COLORS.blue}` }}>
          <Icon name="Settings2" size={14} /> {mode === "edit" ? "回到遊戲" : "編輯任務卡"}
        </button>
      </div>

      {mode === "game" ? (
        <>
          <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
            抽出任務卡後會列出卡片上全部的偽裝情境，交給皮克敏在自己的頁面抽情境牌。目前任務卡池共 {cards.length} 張：{cards.map((c) => c.line).join("、") || "（無）"}
          </p>

          <div className="flex justify-center mb-6">
            <FlipCard label="任務卡 · 暗號" faceLabel="題" revealed={state.cardRevealed && !flipping} accent={COLORS.red} small>
              {currentCard && <span className="text-2xl font-black leading-snug" style={{ color: "#241A14", fontFamily: "'Noto Serif TC', serif" }}>「{currentCard.line}」</span>}
            </FlipCard>
          </div>

          <div className="rounded-2xl p-5 mb-6" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
            <div className="text-xs uppercase tracking-widest mb-3 text-center" style={{ color: COLORS.inkSoft }}>這一輪的表演方式</div>
            <div className="flex gap-2 justify-center mb-3 flex-wrap">
              {PERF_MODES.map((m) => (
                <button
                  key={m.id}
                  onClick={() => pushState({ ...state, perf: m.id })}
                  className="px-6 py-3 rounded-full text-base font-bold"
                  style={state.perf === m.id
                    ? { background: COLORS.yellow, color: "#241A14" }
                    : { border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}
                >{m.label}</button>
              ))}
            </div>
            <p className="text-sm text-center" style={{ color: COLORS.inkSoft }}>{perfMode(state.perf).hint}</p>
          </div>

          <div className="flex flex-wrap gap-3 justify-center mb-8">
            <button onClick={drawCard} disabled={cards.length === 0} className="flex items-center gap-2 px-5 py-2.5 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.red, color: "#FFFFFF" }}>
              <Icon name="Shuffle" size={16} /> 抽任務卡
            </button>
            <button onClick={resetDraw} className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm" style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}>
              <Icon name="RotateCcw" size={14} /> 重置
            </button>
          </div>

          {currentCard && (
            <div className="mb-8">
              <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>全部偽裝情境（共 {poolSize} 種，指揮官不會看到誰抽到哪個）</div>
              <SituationList scenarios={currentCard.scenarios} activeNumber={null} />
            </div>
          )}

          {currentCard && Object.keys(state.guessers || {}).length > 0 && (
            <div className="rounded-2xl p-4 mb-6" style={{ background: COLORS.panel, border: `1px solid ${COLORS.amber}` }}>
              <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.amber }}>各小隊的猜題者號碼（抽到這個號碼的人不表演）</div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {Array.from({ length: state.totalGroups }, (_, i) => i + 1).map((g) => (
                  <div key={g} className="text-sm px-3 py-2 rounded-lg text-center" style={{ background: COLORS.bg, color: COLORS.inkSoft, border: `1px solid ${COLORS.amber}` }}>
                    第 {g} 小隊　<span style={{ color: COLORS.amber, fontWeight: 800 }}>{(state.guessers || {})[g] || "—"} 號</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <GroupProgress takenNumbers={state.takenNumbers} totalGroups={state.totalGroups} poolSize={poolSize} />
        </>
      ) : (
        <div className="space-y-5">
          <p className="text-sm" style={{ color: COLORS.inkSoft }}>每張任務卡包含皮克敏要喊出的暗號，以及對應情境牌 1–8 號的偽裝情境描述。編輯後會同步給皮克敏。</p>
          {cards.map((card, idx) => (
            <div key={card.id} className="rounded-2xl p-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
              <div className="flex items-center gap-2 mb-3">
                <span className="text-xs shrink-0" style={{ color: COLORS.inkSoft }}>暗號</span>
                <input value={card.line} onChange={(e) => updateLine(idx, e.target.value)} aria-label="皮克敏要喊出的暗號" placeholder="皮克敏要喊出的暗號" className="flex-1 px-3 py-2 rounded-lg text-sm font-bold outline-none" style={{ background: COLORS.cardFace, color: "#241A14", fontFamily: "'Noto Serif TC', serif" }} />
                <button onClick={() => deleteCard(idx)} aria-label="刪除這張任務卡" title="刪除這張任務卡" style={{ color: COLORS.red }}><Icon name="Trash2" size={18} /></button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                {card.scenarios.map((s, si) => (
                  <div key={si} className="flex items-center gap-2">
                    <span className="w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold shrink-0" style={{ background: COLORS.yellow, color: "#241A14" }}>{si + 1}</span>
                    <input value={s} onChange={(e) => updateScenario(idx, si, e.target.value)} aria-label={`第 ${si + 1} 號偽裝情境描述`} placeholder={`第 ${si + 1} 號偽裝情境描述`} className="flex-1 px-2.5 py-1.5 rounded-lg text-xs outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
                  </div>
                ))}
              </div>
            </div>
          ))}
          <button onClick={addCard} className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-bold w-full justify-center" style={{ border: `1px dashed ${COLORS.yellow}`, color: COLORS.amber }}>
            <Icon name="Plus" size={16} /> 新增任務卡
          </button>
        </div>
      )}
    </>
  );
}

/* 抽號碼時先跑一段洗牌動畫，最後才翻出號碼——比直接跳出數字有儀式感。 */
function ShuffleDeck({ running, result, poolSize }) {
  const [face, setFace] = useState(1);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => setFace(1 + Math.floor(Math.random() * Math.max(poolSize, 1))), 90);
    return () => clearInterval(id);
  }, [running, poolSize]);

  const cards = [0, 1, 2, 3, 4];
  return (
    <div className="relative mx-auto mb-4" style={{ width: 150, height: 200 }}>
      {cards.map((i) => (
        <div
          key={i}
          className="absolute rounded-2xl"
          style={{
            inset: 0,
            background: `repeating-linear-gradient(135deg, ${COLORS.blue} 0px, ${COLORS.blue} 10px, ${COLORS.bg} 10px, ${COLORS.bg} 20px)`,
            border: `3px solid ${COLORS.blue}`,
            boxShadow: "0 8px 20px rgba(0,0,0,0.25)",
            transform: running
              ? `translate(${(i - 2) * 14}px, ${-i * 5}px) rotate(${(i - 2) * 7}deg)`
              : `translate(0,0) rotate(0deg)`,
            transition: "transform .35s cubic-bezier(.2,.8,.3,1)",
          }}
        />
      ))}
      <div
        className="absolute inset-0 rounded-2xl flex items-center justify-center"
        style={{
          background: COLORS.cardFace,
          border: `3px solid ${COLORS.amber}`,
          boxShadow: "0 10px 26px rgba(0,0,0,0.3)",
          opacity: running || result === null ? 0 : 1,
          transform: running || result === null ? "scale(.85)" : "scale(1)",
          transition: "all .35s cubic-bezier(.2,.8,.3,1)",
        }}
      >
        <span className="text-7xl font-black" style={{ color: COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>{result === null ? "" : result}</span>
      </div>
      {running && (
        <div className="absolute inset-0 flex items-center justify-center">
          <span className="text-5xl font-black" style={{ color: COLORS.inkSoft, fontFamily: "'Noto Serif TC', serif", opacity: 0.5 }}>{face}</span>
        </div>
      )}
    </div>
  );
}

function BarPlayerView({ cards, state, claimScenario, myGroup, myId }) {
  const [drawing, setDrawing] = useState(false);
  const [noneLeft, setNoneLeft] = useState(false);
  const [failed, setFailed] = useState(false);
  const [revealed, setRevealed] = useState(false);
  const currentCard = state.cardId ? cards.find((c) => c.id === state.cardId) || null : null;
  const groupKey = String(myGroup || "solo");
  const takenForGroup = (state.takenNumbers && state.takenNumbers[groupKey]) || {};
  const pool = useMemo(
    () => (currentCard ? currentCard.scenarios.map((s, i) => (s && s.trim() ? i + 1 : 0)).filter(Boolean) : []),
    [currentCard]
  );
  const poolSize = pool.length;

  const myNumber = useMemo(() => {
    const hit = Object.keys(takenForGroup).find((n) => takenForGroup[n] === myId);
    return hit ? Number(hit) : null;
  }, [takenForGroup, myId]);

  const guesserNumber = Number((state.guessers || {})[groupKey] || 0) || null;
  const iAmGuesser = myNumber !== null && guesserNumber !== null && myNumber === guesserNumber;
  const mode = perfMode(state.perf);

  useEffect(() => {
    setNoneLeft(false); setFailed(false); setRevealed(false);
  }, [state.cardId]);
  useEffect(() => { if (myNumber !== null && !drawing) setRevealed(true); }, [myNumber, drawing]);

  async function drawNumber() {
    if (!currentCard || myNumber !== null || drawing) return;
    setDrawing(true); setNoneLeft(false); setFailed(false); setRevealed(false);
    const started = Date.now();
    const { full, failed: err } = await claimScenario(groupKey, pool);
    // 洗牌動畫至少跑滿 1.2 秒，太快閃過反而看不出在洗牌
    const wait = Math.max(0, 1200 - (Date.now() - started));
    setTimeout(() => {
      setDrawing(false);
      if (err) setFailed(true);
      else if (full) setNoneLeft(true);
      else setRevealed(true);
    }, wait);
  }

  return (
    <>
      {myGroup && (
        <div className="text-center mb-4">
          <span className="inline-block px-3 py-1 rounded-full text-xs font-bold" style={{ background: COLORS.panel, color: COLORS.pink, border: `1px solid ${COLORS.pink}` }}>你的小隊：第 {myGroup} 小隊</span>
        </div>
      )}

      {/* 這一輪只能用什麼方式演，所有人都要看得到 */}
      <div className="rounded-2xl p-4 mb-5 text-center" style={{ background: COLORS.panel, border: `2px solid ${COLORS.yellow}` }}>
        <div className="text-xs uppercase tracking-widest mb-1" style={{ color: COLORS.inkSoft }}>這一輪只能用</div>
        <div className="text-3xl font-black mb-1" style={{ color: COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>{mode.label}</div>
        <div className="text-sm" style={{ color: COLORS.inkSoft }}>{mode.hint}</div>
      </div>

      <div className="flex justify-center mb-6">
        <FlipCard label="任務卡 · 暗號" faceLabel="題" revealed={!!currentCard && state.cardRevealed} accent={COLORS.red} small>
          {currentCard && <span className="text-2xl font-black leading-snug" style={{ color: "#241A14", fontFamily: "'Noto Serif TC', serif" }}>「{currentCard.line}」</span>}
        </FlipCard>
      </div>

      {myNumber === null && (
        <div className="flex flex-col items-center gap-3 mb-8">
          {(drawing || revealed) && <ShuffleDeck running={drawing} result={null} poolSize={poolSize} />}
          <button onClick={drawNumber} disabled={!currentCard || noneLeft || drawing || poolSize === 0} className="flex items-center gap-2 px-8 py-4 rounded-full font-bold text-lg disabled:opacity-40" style={{ background: COLORS.yellow, color: "#241A14" }}>
            <Icon name="Shuffle" size={20} /> {drawing ? "洗牌中…" : "抽情境牌"}
          </button>
          {!currentCard && <span className="text-sm" style={{ color: COLORS.inkSoft }}>指揮官抽出任務卡後即可使用</span>}
          {currentCard && poolSize === 0 && <span className="text-sm" style={{ color: COLORS.red }}>這張任務卡還沒有填寫任何情境，請指揮官先編輯。</span>}
          {noneLeft && <span className="text-sm" style={{ color: COLORS.red }}>本小隊 {poolSize} 種情境已經被抽完了</span>}
          {failed && <span className="text-sm" style={{ color: COLORS.red }}>同步失敗，沒有抽到牌，請確認網路後再按一次。</span>}
        </div>
      )}

      {myNumber !== null && (
        <div className="mb-8">
          <ShuffleDeck running={drawing} result={drawing ? null : myNumber} poolSize={poolSize} />

          {iAmGuesser ? (
            /* 猜題者：不表演，但要看得到其他人可能抽到哪些情境。
               自己那一號不會有人演（它被自己抽走了），所以從清單裡拿掉。 */
            <div>
              <div className="rounded-2xl p-5 mb-5 text-center" style={{ background: COLORS.pinkFill, color: "#241A14" }}>
                <div className="text-3xl font-black mb-1" style={{ fontFamily: "'Noto Serif TC', serif" }}>你是猜題者</div>
                <p className="text-sm">這一輪你不用表演。看同隊夥伴怎麼演，猜他們各自是哪一種處境。</p>
              </div>
              <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>可能的情境（不含你自己的第 {myNumber} 號）</div>
              <SituationList
                scenarios={currentCard ? currentCard.scenarios : []}
                activeNumber={null}
                onlyNumbers={pool.filter((n) => n !== myNumber)}
              />
            </div>
          ) : (
            /* 表演者：只看自己那一題。看得到全部清單會大幅降低猜題難度。 */
            <div className="rounded-2xl p-6 text-center" style={{ background: COLORS.panel, border: `2px solid ${COLORS.amber}` }}>
              <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.amber }}>你的情境（第 {myNumber} 號，只有你看得到）</div>
              <p className="text-xl sm:text-2xl font-bold leading-relaxed" style={{ color: COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>
                {(currentCard && currentCard.scenarios[myNumber - 1]) || "（尚未填寫）"}
              </p>
              <p className="text-sm mt-4" style={{ color: COLORS.inkSoft }}>用「{mode.label}」把暗號演出來，絕對不能說出情境內容。</p>
            </div>
          )}
        </div>
      )}
    </>
  );
}

/* ---------- 情報交換 ---------- */
function TtolHostView({ state, pushState }) {
  const ttol = state.ttol || EMPTY_STATE.ttol;
  const profiles = Object.entries(ttol.profiles || {});
  const byGroup = {};
  profiles.forEach(([id, p]) => { (byGroup[p.group] = byGroup[p.group] || []).push({ id, ...p }); });

  function startGuessing() { pushState({ ...state, ttol: { ...ttol, phase: "guessing" } }); }
  function finishTtol() { pushState({ ...state, stage: nextStage(state.activity, "ttol") }); }

  function tallyFor(id) {
    const g = (ttol.guesses && ttol.guesses[id]) || {};
    const vals = Object.values(g);
    return {
      correct: vals.filter((v) => v.result === "correct").length,
      wrong: vals.filter((v) => v.result === "wrong").length,
      // 已送出但對方的裝置還沒比對答案
      waiting: vals.filter((v) => v.result === null || v.result === undefined).length,
    };
  }

  return (
    <div>
      <p className="text-sm mb-6" style={{ color: COLORS.inkSoft }}>
        每個人先在自己手機上填寫情報並提交，全部人（或大部分人）填完後按下方按鈕開始「情報判讀」環節——大家會同時在自己手機上，各自判讀自己小隊內其他每一位夥伴，不用輪流等待。
      </p>

      <div className="rounded-2xl p-4 mb-5" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
        <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.inkSoft }}>已提交名單（依小隊）</div>
        {Object.keys(byGroup).length === 0 && <div className="text-xs" style={{ color: COLORS.inkSoft, opacity: 0.7 }}>目前還沒有人提交。</div>}
        {Object.entries(byGroup).map(([g, list]) => (
          <div key={g} className="mb-2">
            <div className="text-xs font-bold mb-1" style={{ color: COLORS.amber }}>第 {g} 小隊（{list.length} 人）</div>
            <div className="flex flex-wrap gap-1.5">
              {list.map((p) => (
                <span key={p.id} className="text-xs px-2 py-1 rounded-lg" style={{ background: "#EAF6FF", color: COLORS.inkSoft, border: `1px solid ${COLORS.amber}` }}>{p.nickname || p.name}</span>
              ))}
            </div>
          </div>
        ))}
      </div>

      {ttol.phase === "writing" && (
        <button onClick={startGuessing} disabled={profiles.length === 0} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-40 mb-6" style={{ background: COLORS.yellow, color: "#241A14" }}>
          大家自我介紹完了，開始情報判讀
        </button>
      )}

      {ttol.phase === "guessing" && (
        <div className="rounded-2xl p-4 mb-6" style={{ background: COLORS.panel, border: `1px solid ${COLORS.amber}` }}>
          <div className="text-xs uppercase tracking-widest mb-3" style={{ color: COLORS.amber }}>情報判讀進度（不會顯示是誰判讀的、選了什麼）</div>
          <div className="space-y-1.5 mb-2">
            {profiles.map(([id, p]) => {
              const t = tallyFor(id);
              return (
                <div key={id} className="flex items-center justify-between text-xs px-3 py-2 rounded-lg" style={{ background: "#EAF6FF", border: `1px solid ${COLORS.blue}` }}>
                  <span style={{ color: COLORS.inkSoft }}>第{p.group}小隊・{p.nickname || p.name}</span>
                  <span>
                    <span style={{ color: COLORS.amber, fontWeight: 700 }}>判讀成功 {t.correct}</span>　
                    <span style={{ color: COLORS.red, fontWeight: 700 }}>判讀失敗 {t.wrong}</span>
                    {t.waiting > 0 && <span className="ml-1" style={{ color: COLORS.inkSoft }}>　待確認 {t.waiting}</span>}
                    {t.wrong > 0 && t.correct === 0 && <span className="ml-1" style={{ color: COLORS.red }}>（目前全員尚未判讀成功）</span>}
                  </span>
                </div>
              );
            })}
          </div>
          <button onClick={finishTtol} className="w-full mt-3 flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm" style={{ border: `1px solid ${COLORS.yellow}`, color: COLORS.amber }}>
            情報交換結束，前往下一關 <Icon name="ChevronRight" size={16} />
          </button>
        </div>
      )}
    </div>
  );
}

function TtolWriteForm({ myGroup, onSubmit }) {
  const [school, setSchool] = useState("");
  const [name, setName] = useState("");
  const [nickname, setNickname] = useState("");
  const [statements, setStatements] = useState(["", "", "", ""]);
  const [lieIndex, setLieIndex] = useState(0);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);

  const canSubmit = school && name && nickname && statements.every((s) => s.trim()) && !sending;

  async function send() {
    if (!canSubmit) return;
    setSending(true); setFailed(false);
    // 注意 lieIndex 是第二個參數，不在 profile 裡：profile 會上傳，答案不會
    const res = await onSubmit({ school, name, nickname, statements, group: myGroup }, lieIndex);
    setSending(false);
    if (!res || !res.ok) setFailed(true);
  }

  return (
    <div>
      <p className="text-sm mb-5" style={{ color: COLORS.inkSoft }}>填寫你的情報，還有四則關於你的事——三則真的、一則是你編出來的假情報，等一下讓同小隊夥伴判讀。</p>
      <div className="space-y-3 mb-4">
        <input value={school} onChange={(e) => setSchool(e.target.value)} aria-label="所屬基地" placeholder="所屬基地" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
        <input value={name} onChange={(e) => setName(e.target.value)} aria-label="代號" placeholder="代號" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
        <input value={nickname} onChange={(e) => setNickname(e.target.value)} aria-label="暱稱" placeholder="暱稱" className="w-full px-3 py-2 rounded-lg text-sm outline-none" style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }} />
      </div>
      <div className="text-xs uppercase tracking-widest mb-2" style={{ color: COLORS.amber }}>四則情報（點選單選鈕標記哪一則是假的）</div>
      <div className="space-y-2 mb-5">
        {statements.map((s, i) => (
          <div key={i} className="flex items-center gap-2">
            <input type="radio" name="lie" aria-label={`把第 ${i + 1} 則標記為假情報`} checked={lieIndex === i} onChange={() => setLieIndex(i)} />
            <input
              value={s}
              onChange={(e) => setStatements((arr) => arr.map((v, j) => (j === i ? e.target.value : v)))}
              aria-label={`第 ${i + 1} 則情報`} placeholder={`第 ${i + 1} 則情報`}
              className="flex-1 px-3 py-2 rounded-lg text-sm outline-none"
              style={{ background: "#EAF6FF", color: COLORS.ink, border: `1px solid ${COLORS.blue}` }}
            />
          </div>
        ))}
      </div>
      {failed && <div className="text-xs mb-3 text-center" style={{ color: COLORS.red }}>⚠ 沒有提交成功，請確認網路連線後再按一次。</div>}
      <button
        onClick={send}
        disabled={!canSubmit}
        className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-full font-bold text-sm disabled:opacity-40"
        style={{ background: COLORS.yellow, color: "#241A14" }}
      >
        {sending ? "提交中…" : "提交"}
      </button>
    </div>
  );
}

function TtolLivingRoom({ ttol, myGroup }) {
  const mine = Object.entries(ttol.profiles || {}).filter(([, p]) => p.group === myGroup);
  return (
    <div>
      <p className="text-sm mb-5" style={{ color: COLORS.inkSoft }}>提交完成！輪流自我介紹，介紹完後指揮官會帶大家進入情報判讀環節。</p>
      <div className="space-y-3">
        {mine.map(([id, p]) => (
          <div key={id} className="rounded-2xl p-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
            <div className="text-sm font-bold mb-1" style={{ color: COLORS.amber, fontFamily: "'Noto Serif TC', serif" }}>{p.nickname}（{p.name}）</div>
            <div className="text-xs mb-2" style={{ color: COLORS.inkSoft }}>{p.school}</div>
            <div className="space-y-1">
              {p.statements.map((s, i) => (
                <div key={i} className="text-xs px-2.5 py-1.5 rounded-lg" style={{ background: "#EAF6FF", color: COLORS.ink }}>{i + 1}. {s}</div>
              ))}
            </div>
          </div>
        ))}
