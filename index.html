function TtolGuessCard({ target, targetId, myId, ttol, submitGuess }) {
  const myGuess = (ttol.guesses && ttol.guesses[targetId] && ttol.guesses[targetId][myId]) || null;
  const [picked, setPicked] = useState(null);
  const [sending, setSending] = useState(false);
  const [failed, setFailed] = useState(false);
  const locked = myGuess && (myGuess.result === "correct" || myGuess.result === "wrong");
  // 結果留白代表已送出、正在等對方的裝置比對答案
  const awaiting = !!myGuess && (myGuess.result === null || myGuess.result === undefined);

  /* 判讀次數交給 submitGuess 依「遠端最新值」計算，這裡不自己算——
     全隊同時送出時本地那份很可能已經過期。對錯則完全不在這裡判定：
     答案只存在對方的裝置上，我們送出的只是「我猜第幾則」。 */
  async function send() {
    if (picked === null || sending) return;
    setSending(true); setFailed(false);
    const res = await submitGuess(targetId, picked);
    setSending(false);
    if (res && res.ok) setPicked(null);
    else setFailed(true);
  }

  return (
    <div className="rounded-2xl p-4 mb-4" style={{ background: COLORS.panel, border: `1px solid ${COLORS.blue}` }}>
      <p className="text-sm mb-3"><span style={{ color: COLORS.amber, fontWeight: 700 }}>{target.nickname}</span> <span style={{ color: COLORS.inkSoft }}>的哪一則情報是假的？</span></p>
      <div className="space-y-2 mb-3">
        {target.statements.map((s, i) => (
          <button
            key={i}
            onClick={() => !locked && !awaiting && setPicked(i)}
            disabled={locked || awaiting}
            className="w-full text-left text-sm px-3 py-2.5 rounded-xl"
            style={{ background: picked === i ? COLORS.yellow : COLORS.bg, color: picked === i ? "#241A14" : COLORS.ink, border: `1px solid ${picked === i ? COLORS.yellow : COLORS.blue}` }}
          >
            {i + 1}. {s}
          </button>
        ))}
      </div>
      {!locked && !awaiting && (
        <button onClick={send} disabled={picked === null || sending} className="w-full px-4 py-2 rounded-full font-bold text-sm disabled:opacity-40" style={{ background: COLORS.red, color: "#FFFFFF" }}>
          {sending ? "送出中…" : (myGuess ? `再判讀一次（第 ${myGuess.attempts + 1} 次）` : "送出第一次判讀")}
        </button>
      )}
      {awaiting && (
        <div className="text-center text-sm" style={{ color: COLORS.inkSoft }}>
          已送出，等待 {target.nickname} 的裝置確認…
          <div className="text-xs mt-1" style={{ opacity: 0.75 }}>（答案只存在對方手機上，請對方保持頁面開啟）</div>
        </div>
      )}
      {myGuess && myGuess.result === "correct" && <div className="text-center text-sm mt-2" style={{ color: COLORS.amber }}>✓ 判讀成功！</div>}
      {myGuess && myGuess.result === "wrong" && <div className="text-center text-sm mt-2" style={{ color: COLORS.red }}>✕ 判讀失敗，兩次機會用完。</div>}
      {myGuess && myGuess.result === "pending" && <div className="text-center text-sm mt-2" style={{ color: COLORS.inkSoft }}>還沒判讀成功，再試一次！</div>}
      {failed && <div className="text-center text-xs mt-2" style={{ color: COLORS.red }}>⚠ 這次判讀沒有送出成功（不算次數），請再按一次送出。</div>}
    </div>
  );
}

function TtolGuessing({ ttol, myGroup, myId, submitGuess }) {
  const targets = Object.entries(ttol.profiles || {}).filter(([id, p]) => p.group === myGroup && id !== myId);

  return (
    <div>
      <p className="text-sm mb-4 text-center" style={{ color: COLORS.inkSoft }}>背對背獨立作答，不能問提示——判讀同小隊每一位夥伴的哪一則情報是假的。你自己的不會出現在這裡。</p>
      {targets.length === 0 && <div className="text-center text-sm py-10" style={{ color: COLORS.inkSoft }}>目前小隊內還沒有其他人可以判讀。</div>}
      {targets.map(([id, p]) => (
        <TtolGuessCard key={id} target={p} targetId={id} myId={myId} ttol={ttol} submitGuess={submitGuess} />
      ))}
    </div>
  );
}

function TtolPlayerView({ state, submitProfile, submitGuess, myGroup, myId }) {
  const ttol = state.ttol || EMPTY_STATE.ttol;
  const submitted = !!(ttol.profiles || {})[myId];

  if (!submitted) return <TtolWriteForm myGroup={myGroup} onSubmit={submitProfile} />;
  if (ttol.phase === "writing") return <TtolLivingRoom ttol={ttol} myGroup={myGroup} />;
  return <TtolGuessing ttol={ttol} myGroup={myGroup} myId={myId} submitGuess={submitGuess} />;
}

/* ---------- App ---------- */
function App() {
  /* 網址帶 ?join 就是給皮克敏的連結，落在輸入代碼的畫面。
     但掃 QR code 進來之後網址會一直帶著 ?join，如果每次重整都退回輸入畫面，
     手機切個 App 回來就要重按一次；所以已經加入過同一個房間的就直接回到遊戲。 */
  const joinParam = useRef(readJoinParam()).current;
  const saved = useRef(loadSession()).current;
  const restored = useRef(
    saved && (!joinParam || !joinParam.code || joinParam.code === saved.room) ? saved : null
  ).current;
  const [role, setRole] = useState(restored ? "player" : (joinParam ? "player-join" : "host")); // host | player-join | player
  const [room, setRoom] = useState(null);
  const [roomReal, setRoomReal] = useState(restored ? true : null); // null=尚未確定, true=連得上, false=連不上或未設定
  const [joinedRoom, setJoinedRoom] = useState(restored ? restored.room : null);
  const [joining, setJoining] = useState(false);
  const [joinError, setJoinError] = useState("");

  const [cards, setCards] = useState(DEFAULT_CARDS);
  const [state, setState] = useState(EMPTY_STATE);
  const [loading, setLoading] = useState(true);
  const [syncOk, setSyncOk] = useState(null);
  const [myGroup, setMyGroup] = useState(null);
  const [editingStory, setEditingStory] = useState(false);
  const [dataRestored, setDataRestored] = useState(false);
  const [pushFailed, setPushFailed] = useState(null);   // 寫入沒送出去時記下來，讓畫面說實話
  const [timerOpen, setTimerOpen] = useState(false);
  const myIdRef = useRef(loadOrCreateId());

  const activeRoom = role === "player" ? joinedRoom : room;
  // roomReal === false 代表同步後端不可用（未設定或連不上），這時完全不要發網路請求。
  const syncEnabled = !!activeRoom && roomReal !== false;

  /* 讓非同步流程隨時拿得到最新的本地 state，不必把它放進 useCallback 的相依陣列。 */
  const stateRef = useRef(state);
  useEffect(() => { stateRef.current = state; }, [state]);

  const judgingRef = useRef(false);

  /* 自己送出的寫入會以推播回音的形式繞一圈回來。主持人連續翻頁時，較早那次的回音
     會晚於較新的本地狀態抵達，把畫面拉回舊的一頁。所以寫入期間（以及寫完後的短暫
     沉澱期）不套用回音裡的「流程狀態」——玩家的資料仍然照常套用，那不是我們寫的。 */
  const writingRef = useRef(0);
  const settleUntilRef = useRef(0);

  /* 同一台裝置連續發出的寫入不能任其並行：網路抖動會讓較晚發出的先抵達，
     指揮官快速換關卡時整場會退回舊關卡。串成一條佇列確保抵達順序等於操作順序。 */
  const writeChainRef = useRef(Promise.resolve());
  const enqueueWrite = useCallback((fn) => {
    const run = writeChainRef.current.then(fn, fn);
    writeChainRef.current = run.then(() => {}, () => {});
    return run;
  }, []);

  /* 開房間。後端沒設定或連不上時退回單機模式，畫面會明確說明原因。 */
  useEffect(() => {
    if (role !== "host" || room) return;
    let cancelled = false;
    (async () => {
      // 先看本機記著的房間還在不在——重整、切換 App、手機把分頁重載都會走到這裡
      const remembered = loadHostRoom();
      if (remembered) {
        const existing = await dbGet(`rooms/${remembered}/session`);
        if (cancelled) return;
        if (existing.status === "ok") { setRoom(remembered); setRoomReal(true); return; }
      }
      const code = await createRoom();
      if (cancelled) return;
      if (code) { setRoom(code); setRoomReal(true); saveHostRoom(code); }
      else { setRoom(newRoomCode()); setRoomReal(false); }
    })();
    return () => { cancelled = true; };
  }, [role, room]);

  /* 指揮官擁有的流程狀態寫在 session 底下；玩家的資料在別的路徑，
     所以這裡用 PATCH 只送出流程欄位，永遠不可能蓋到玩家的東西。 */
  const pushState = useCallback(async (next, opts = {}) => {
    if (role === "host") next = { ...next, hostTime: Date.now() };
    /* 樂觀更新之前先記下原本的樣子。寫入失敗時要退回去——否則指揮官的畫面
       會顯示已經生效，伺服器與所有玩家卻停在原地，重整一次就被拉回遊戲中間。 */
    const before = stateRef.current;
    setState(next);
    if (!syncEnabled) return false;
    const session = {
      activity: next.activity === undefined ? null : next.activity,
      stage: next.stage, cellTarget: next.cellTarget,
      timerConfig: next.timerConfig, timerEndsAt: next.timerEndsAt === undefined ? null : next.timerEndsAt,
      timerRunning: !!next.timerRunning, totalGroups: next.totalGroups,
      storyText: next.storyText, cardId: next.cardId === undefined ? null : next.cardId,
      cardRevealed: !!next.cardRevealed, hostTime: next.hostTime || 0,
      ttolPhase: (next.ttol && next.ttol.phase) || "writing",
      storyPage: next.storyPage || 0,
      setupDone: !!next.setupDone,
      targetMode: next.targetMode || "manual",
      perf: next.perf || "action",
      guessers: next.guessers || {},
    };
    writingRef.current += 1;
    const ok = await enqueueWrite(async () => {
      // 明確要清空該輪玩家資料的動作（抽新任務卡、重置、換活動）才刪除那些子樹
      if (opts.resetPlayerData) {
        await dbPut(`rooms/${activeRoom}/taken`, null);
        if (opts.resetTtol) {
          await dbPut(`rooms/${activeRoom}/profiles`, null);
          await dbPut(`rooms/${activeRoom}/guesses`, null);
        }
      }
      return dbPatch(`rooms/${activeRoom}/session`, session);
    });
    writingRef.current = Math.max(0, writingRef.current - 1);
    settleUntilRef.current = Date.now() + 700;
    setSyncOk(ok);
    if (ok) {
      setPushFailed(null);
      if (role === "host") saveBackup(activeRoom, next);
    } else {
      setState(before);
      setPushFailed({ next, opts, label: opts.label || "剛才那個動作" });
    }
    return ok;
  }, [role, activeRoom, syncEnabled, enqueueWrite]);

  /* 編輯任務卡時每個按鍵都會呼叫這裡，停止輸入 600ms 後才真的寫出去。 */
  const cardsTimerRef = useRef(null);
  const pushCards = useCallback(async (next, opts = {}) => {
    setCards(next);
    if (!syncEnabled) return false;
    const write = async () => {
      const ok = await dbPut(`rooms/${activeRoom}/cards`, next);
      setSyncOk(ok);
      return ok;
    };
    if (cardsTimerRef.current) { clearTimeout(cardsTimerRef.current); cardsTimerRef.current = null; }
    if (!opts.debounce) return write();
    cardsTimerRef.current = setTimeout(() => { cardsTimerRef.current = null; write(); }, 600);
    return true;
  }, [activeRoom, syncEnabled]);
  useEffect(() => () => { if (cardsTimerRef.current) clearTimeout(cardsTimerRef.current); }, []);

  /* 搶一張情境牌。每個號碼是一個獨立路徑，用 ETag 條件寫入認領：
     別人搶先一步時伺服器回 412，我們就換下一個號碼再試。
     兩個人拿到同一號在結構上不可能發生，不需要事後驗證或補寫。 */
  const claimScenario = useCallback(async (groupKey, pool) => {
    const myId = myIdRef.current;
    const taken = (stateRef.current.takenNumbers && stateRef.current.takenNumbers[groupKey]) || {};
    const mine = Object.keys(taken).find((n) => taken[n] === myId);
    if (mine) return { picked: Number(mine), full: false, failed: false };

    if (!syncEnabled) { // 單機模式：直接改本地狀態
      const free = pool.filter((n) => taken[n] === undefined);
      if (!free.length) return { picked: null, full: true, failed: false };
      const pick = free[Math.floor(Math.random() * free.length)];
      const base = stateRef.current;
      setState({ ...base, takenNumbers: { ...base.takenNumbers, [groupKey]: { ...taken, [pick]: myId } } });
      return { picked: pick, full: false, failed: false };
    }

    const candidates = pool.filter((n) => taken[n] === undefined).sort(() => Math.random() - 0.5);
    let sawError = false;
    for (const n of candidates) {
      const r = await dbClaim(`rooms/${activeRoom}/taken/${groupKey}/${n}`, myId);
      if (r === "won") return { picked: n, full: false, failed: false };
      if (r === "error") { sawError = true; break; }
    }
    if (sawError) return { picked: null, full: false, failed: true };
    return { picked: null, full: true, failed: false };
  }, [activeRoom, syncEnabled]);

  const myLieRef = useRef(null); // 假情報的答案只存在這台裝置，從不上傳
  useEffect(() => { if (activeRoom) myLieRef.current = loadLie(activeRoom); }, [activeRoom]);

  /* 每位玩家只寫自己的路徑，彼此零競爭。 */
  const submitProfile = useCallback(async (profile, lieIndex) => {
    myLieRef.current = lieIndex;
    if (activeRoom) saveLie(activeRoom, lieIndex);
    if (!syncEnabled) {
      const base = stateRef.current;
      setState({ ...base, ttol: { ...base.ttol, profiles: { ...base.ttol.profiles, [myIdRef.current]: profile } } });
      return { ok: true, local: true };
    }
    const ok = await dbPut(`rooms/${activeRoom}/profiles/${myIdRef.current}`, profile);
    setSyncOk(ok);
    return { ok };
  }, [activeRoom, syncEnabled]);

  /* 送出判讀：只寫「我猜第幾則」，對錯留白等對方的裝置比對答案後寫回。
     attempts 只有我自己會改，所以直接依目前值加一即可，不需要防競爭。 */
  const submitGuess = useCallback(async (targetId, pickedIndex) => {
    const myId = myIdRef.current;
    const cur = ((stateRef.current.ttol.guesses || {})[targetId] || {})[myId] || null;
    if (cur && (cur.result === "correct" || cur.result === "wrong")) return { ok: true, skipped: true };
    if (cur && (cur.result === null || cur.result === undefined)) return { ok: true, skipped: true };
    const record = { attempts: (cur ? cur.attempts : 0) + 1, pick: pickedIndex, result: null };
    if (!syncEnabled) {
      const base = stateRef.current;
      const forTarget = { ...(base.ttol.guesses[targetId] || {}), [myId]: record };
      setState({ ...base, ttol: { ...base.ttol, guesses: { ...base.ttol.guesses, [targetId]: forTarget } } });
      return { ok: true, local: true };
    }
    const ok = await dbPatch(`rooms/${activeRoom}/guesses/${targetId}/${myId}`, record);
    setSyncOk(ok);
    return { ok };
  }, [activeRoom, syncEnabled]);

  /* 本人的裝置擔任裁判：把針對自己、還沒判定的猜測比對答案後寫回結果。 */
  const judgeGuesses = useCallback(async (tree) => {
    const myId = myIdRef.current;
    const lie = myLieRef.current;
    if (lie === null || lie === undefined || !syncEnabled) return;
    const mine = fbMap(fbMap(tree.guesses)[myId]);
    for (const judgeId of Object.keys(mine)) {
      const g = mine[judgeId];
      if (!g || typeof g.pick !== "number") continue;
      if (g.result !== null && g.result !== undefined) continue;
      const result = g.pick === lie ? "correct" : (g.attempts >= 2 ? "wrong" : "pending");
      await dbPatch(`rooms/${activeRoom}/guesses/${myId}/${judgeId}`, { result });
    }
  }, [activeRoom, syncEnabled]);

  /* 把房間樹組成畫面用的狀態。所有子樹都要過 fbMap：
     Firebase 會把「鍵值是連續整數」的物件回成陣列。 */
  const treeToState = useCallback((tree) => {
    const t = tree || {};
    const s = (t.session && typeof t.session === "object") ? t.session : {};
    const taken = fbMap(t.taken);
    const normTaken = {};
    Object.keys(taken).forEach((g) => { normTaken[g] = fbMap(taken[g]); });
    const guesses = fbMap(t.guesses);
    const normGuesses = {};
    Object.keys(guesses).forEach((k) => { normGuesses[k] = fbMap(guesses[k]); });
    return normalizeState({
      ...s,
      takenNumbers: normTaken,
      ttol: { phase: s.ttolPhase, profiles: fbMap(t.profiles), guesses: normGuesses },
    });
  }, []);

  /* 即時訂閱整個房間。SSE 取代了原本的輪詢：不再有固定間隔的請求，
     變動由伺服器推過來，也不需要「自己送出的東西被蓋掉就補寫」那套自我修復。 */
  useEffect(() => {
    if (!activeRoom) return;
    if (!syncEnabled) { setLoading(false); setMyGroup(loadGroup(activeRoom)); return; }
    setLoading(true);
    setMyGroup(loadGroup(activeRoom));
    let firstArrived = false;

    const unsubscribe = dbStream(
      `rooms/${activeRoom}`,
      (tree) => {
        if (!firstArrived) { firstArrived = true; setLoading(false); }
        setSyncOk(true);
        const t = tree || {};
        if (role === "player") noteHostTime((t.session || {}).hostTime);
        const cardsFromTree = Array.isArray(t.cards) ? t.cards : (t.cards ? Object.values(t.cards) : null);
        if (cardsFromTree && role === "player") setCards(cardsFromTree);

        const incoming = treeToState(t);
        const holdSession = writingRef.current > 0 || Date.now() < settleUntilRef.current;
        setState((prev) => (holdSession
          // 自己的寫入還在路上：流程狀態沿用本地的，只吸收玩家那幾塊
          ? { ...prev, takenNumbers: incoming.takenNumbers, ttol: incoming.ttol }
          : incoming));

        /* 房間被清空但遊戲其實正在進行——指揮官從本機備份還原。
           房間沒有存取控制，這是唯一擋得住「整份被刪掉」的辦法。 */
        if (role === "host" && !t.session) {
          const backup = loadBackup(activeRoom);
          if (backup && backup.activity) {
            setDataRestored(true);
            pushState(normalizeState(backup));
          }
        }
        if (role === "player" && !judgingRef.current) {
          judgingRef.current = true;
          Promise.resolve(judgeGuesses(t)).finally(() => { judgingRef.current = false; });
        }
      },
      () => { setSyncOk(false); }
    );

    // SSE 若一直沒送來第一筆資料，至少讓載入畫面退場
    const bail = setTimeout(() => { if (!firstArrived) setLoading(false); }, 8000);
    return () => { clearTimeout(bail); unsubscribe(); };
  }, [role, activeRoom, syncEnabled, treeToState, judgeGuesses, pushState]);

  /* 指揮官自己編輯任務卡時不要被推播蓋掉，所以只在初次載入時取一次。 */
  useEffect(() => {
    if (!syncEnabled || role !== "host") return;
    let cancelled = false;
    (async () => {
      const r = await dbGet(`rooms/${activeRoom}/cards`);
      if (cancelled || r.status !== "ok" || !r.value) return;
      setCards(Array.isArray(r.value) ? r.value : Object.values(r.value));
    })();
    return () => { cancelled = true; };
  }, [role, activeRoom, syncEnabled]);

  async function handleJoin(code) {
    const clean = String(code || "").trim().toUpperCase();
    setJoining(true); setJoinError("");
    if (!dbConfigured()) {
      setJoining(false);
      setJoinError("這個網站還沒有設定同步伺服器，目前無法多人連線。請指揮官改用「測試：進入皮克敏介面」在同一台裝置進行。");
      return;
    }
    const r = await dbGet(`rooms/${clean}/session`);
    setJoining(false);
    if (r.status === "error") {
      setJoinError("不是代碼打錯——" + describeDbError());
      return;
    }
    if (r.status === "missing") {
      setJoinError("找不到這組房間代碼，請確認指揮官給的代碼是否正確。");
      return;
    }
    setRoomReal(true);
    setJoinedRoom(clean);
    setRole("player");
    saveSession({ room: clean });
  }

  function chooseGroup(n) { setMyGroup(n); if (activeRoom) saveGroup(activeRoom, n); }

  if (role === "player-join") {
    return <PlayerJoinScreen onJoin={handleJoin} joining={joining} error={joinError} initialCode={(joinParam && joinParam.code) || ""} />;
  }

  if (!activeRoom || loading) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: COLORS.bg, color: COLORS.inkSoft, fontFamily: "'Noto Sans TC', sans-serif" }}>
        <style>{FONT_IMPORT}</style>
        <div className="text-sm flex items-center gap-2"><Icon name="Loader2" size={16} className="animate-spin" /> 載入中…</div>
      </div>
    );
  }

  const activity = state.activity;
  const groupGateStages = activity === "training" ? ["ttol", "bar"] : ["bar"];
  const mustPickGroup = role === "player" && activity && groupGateStages.includes(state.stage) && state.totalGroups > 0 && !myGroup;

  const chapterLabels = {
    star: { setup: "設定", intro: "序章", cell: "第一關｜皮克敏迫降", transition: "故事繼續", bar: "第二關｜偽裝洞穴" },
    training: { setup: "設定", intro: "序章", cell: "第一關｜皮克敏迫降", transition1: "故事繼續一", ttol: "第二關｜情報交換", transition2: "故事繼續二", bar: "第三關｜偽裝洞穴" },
  };
  const chapterLabel = activity ? chapterLabels[activity][state.stage] : "選擇活動";

  return (
    <div
      data-testid="app"
      data-stage={state.stage}
      data-role={role}
      data-setup={state.setupDone ? "1" : "0"}
      data-activity={state.activity || ""}
      data-room={room || ""}
      className="min-h-screen w-full"
      style={{ background: `linear-gradient(180deg, #D6EFFF 0%, ${COLORS.bg} 45%, #FFFFFF 100%)`, fontFamily: "'Noto Sans TC', sans-serif" }}
    >
      <style>{FONT_IMPORT}</style>
      <div className="max-w-2xl mx-auto px-5 py-8">
        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
          <div className="flex items-center gap-2">
            <Icon name="Mic2" size={22} style={{ color: COLORS.amber }} />
            <h1 className="text-2xl font-black tracking-wide" style={{ color: COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>皮克敏！使出 戲胞分裂</h1>
          </div>
          <div className="flex items-center gap-2 flex-wrap justify-end">
            {role === "host" && activity && !editingStory && !isFirstStage(activity, state.stage) && (
              <button
                onClick={() => pushState({ ...state, stage: prevStage(activity, state.stage), storyPage: 0 })}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full"
                style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.blue}` }}
              >
                <Icon name="ArrowLeft" size={13} /> 上一關
              </button>
            )}
            {role === "host" && !editingStory && (
              <button onClick={() => setTimerOpen(true)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.amber}` }}>
                <Icon name="TimerIcon" size={13} /> 倒數計時器
              </button>
            )}
            {role === "host" && activity && !editingStory && (
              <button onClick={() => setEditingStory(true)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full" style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.blue}` }}>
                <Icon name="BookOpen" size={13} /> 編輯故事
              </button>
            )}
            {role === "host" && activity && !editingStory && (
              <button
                onClick={() => pushState({ ...state, activity: null, stage: "setup", cardId: null, cardRevealed: false, takenNumbers: {}, timerRunning: false, timerEndsAt: null, ttol: EMPTY_STATE.ttol, storyPage: 0, setupDone: false, guessers: {} }, { resetPlayerData: true, resetTtol: true, label: "重新開始（換活動）" })}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full"
                style={{ color: COLORS.inkSoft, border: `1px solid ${COLORS.blue}` }}
              >
                <Icon name="RotateCcw" size={13} /> 重新開始（換活動）
              </button>
            )}
            {role === "host" && state.setupDone && <RoomBadge room={room} roomReal={roomReal} />}
          </div>
        </div>
        <div className="flex items-center gap-1.5 mb-6 text-xs flex-wrap" style={{ color: role === "host" ? COLORS.amber : COLORS.red }}>
          {role === "host" ? <Icon name="Crown" size={13} /> : <Icon name="Drama" size={13} />}
          目前身份：{role === "host" ? "指揮官" : "皮克敏"}
          <span style={{ color: COLORS.inkSoft }}>　·　{chapterLabel}</span>
          {myGroup && <span style={{ color: COLORS.inkSoft }}>　·　第 {myGroup} 小隊</span>}
          <span style={{ color: syncOk ? COLORS.amber : COLORS.inkSoft, opacity: 0.8 }}>　·　{syncOk ? "已連線同步" : "同步狀態未知"}</span>
          {role === "host" && dataRestored && (
            <span style={{ color: COLORS.red, fontWeight: 700 }}>　·　⚠ 房間資料曾遺失，已從本機備份還原</span>
          )}
          {role === "host" && roomReal === false && (
            <span style={{ color: COLORS.red, fontWeight: 700 }}>　·　⚠ 多人連線目前無法使用</span>
          )}
        </div>

        {role === "host" && pushFailed && (
          <div data-testid="push-failed" className="rounded-xl px-4 py-3 mb-5 text-sm" style={{ background: COLORS.panel, border: `2px solid ${COLORS.red}`, color: COLORS.ink }}>
            <div className="font-bold mb-1" style={{ color: COLORS.red }}>⚠ 「{pushFailed.label}」沒有送出去</div>
            <div className="text-xs mb-3" style={{ color: COLORS.inkSoft }}>
              畫面已經退回實際的狀態——皮克敏那邊也還停在原本的地方。{describeDbError()}
            </div>
            <div className="flex gap-2 flex-wrap">
              <button
                onClick={() => { const f = pushFailed; setPushFailed(null); pushState(f.next, f.opts); }}
                className="px-4 py-2 rounded-full text-sm font-bold"
                style={{ background: COLORS.yellow, color: "#241A14" }}
              >再試一次</button>
              <button onClick={() => setPushFailed(null)} className="px-4 py-2 rounded-full text-sm" style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}>
                知道了
              </button>
            </div>
          </div>
        )}

        {!activity ? (
          role === "host" ? (
            <ActivitySelectScreen onSelect={(a) => pushState({ ...state, activity: a, stage: "setup", setupDone: false, storyPage: 0 })} />
          ) : (
            <div className="text-center py-16 text-sm" style={{ color: COLORS.inkSoft }}>等待指揮官選擇今天要進行的活動…</div>
          )
        ) : editingStory && role === "host" ? (
          <StoryEditor
            activity={activity}
            storyText={state.storyText[activity]}
            onSave={async (vals) => await pushState({ ...state, storyText: { ...state.storyText, [activity]: { ...state.storyText[activity], ...vals } } })}
            onCancel={() => setEditingStory(false)}
          />
        ) : (
          <>
            {state.stage === "setup" && role === "host" && (
              <SetupScreen
                room={room}
                roomReal={roomReal}
                reason={describeDbError()}
                totalGroups={state.totalGroups}
                setupDone={state.setupDone}
                onSetupDone={() => pushState({ ...state, setupDone: true })}
                onEnterStory={() => pushState({ ...state, stage: nextStage(activity, "setup"), storyPage: 0 })}
                onChangeTotal={(d) => pushState({ ...state, totalGroups: Math.min(20, Math.max(1, state.totalGroups + d)) })}
              />
            )}
            {state.stage === "setup" && role === "player" && (
              <PlayerWaitingScreen label="你已經加入了" hint="等指揮官開始說故事，故事會由指揮官的畫面帶著大家看。" />
            )}

            {state.stage === "intro" && (role === "host" ? (
              <StoryScreen
                pages={storyPages(state.storyText, activity, "intro")}
                page={state.storyPage}
                chapter="序章"
                buttonLabel="開始第一關：皮克敏迫降"
                showControls
                onPrevPage={() => pushState({ ...state, storyPage: Math.max(0, state.storyPage - 1) })}
                onNextPage={() => pushState({ ...state, storyPage: state.storyPage + 1 })}
                onNext={() => pushState({ ...state, stage: nextStage(activity, "intro"), storyPage: 0 })}
              />
            ) : (
              <PlayerWaitingScreen label="序章進行中" hint="抬頭看指揮官的畫面，故事正在那裡進行。" />
            ))}
            {state.stage === "cell" && role === "host" && <CellHostView state={state} pushState={pushState} activity={activity} />}
            {state.stage === "cell" && role === "player" && <CellPlayerView state={state} />}

            {(state.stage === "transition" || state.stage === "transition1" || state.stage === "transition2") && (role === "host" ? (
              <StoryScreen
                pages={storyPages(state.storyText, activity, state.stage)}
                page={state.storyPage}
                chapter={chapterLabel}
                buttonLabel={state.stage === "transition2" ? "開始：偽裝洞穴" : (activity === "training" ? "開始：情報交換" : "開始：偽裝洞穴")}
                showControls
                onPrevPage={() => pushState({ ...state, storyPage: Math.max(0, state.storyPage - 1) })}
                onNextPage={() => pushState({ ...state, storyPage: state.storyPage + 1 })}
                onNext={() => pushState({ ...state, stage: nextStage(activity, state.stage), storyPage: 0 })}
              />
            ) : (
              <PlayerWaitingScreen label={`${chapterLabel}進行中`} hint="抬頭看指揮官的畫面，故事正在那裡進行。" />
            ))}

            {state.stage === "ttol" && role === "host" && <TtolHostView state={state} pushState={pushState} />}
            {state.stage === "ttol" && role === "player" && mustPickGroup && <GroupSelectScreen totalGroups={state.totalGroups} onSelect={chooseGroup} />}
            {state.stage === "ttol" && role === "player" && !mustPickGroup && <TtolPlayerView state={state} submitProfile={submitProfile} submitGuess={submitGuess} myGroup={myGroup} myId={myIdRef.current} />}

            {state.stage === "bar" && role === "host" && <BarHostView cards={cards} state={state} pushState={pushState} pushCards={pushCards} />}
            {state.stage === "bar" && role === "player" && mustPickGroup && <GroupSelectScreen totalGroups={state.totalGroups} onSelect={chooseGroup} />}
            {state.stage === "bar" && role === "player" && !mustPickGroup && <BarPlayerView cards={cards} state={state} claimScenario={claimScenario} myGroup={myGroup} myId={myIdRef.current} />}
          </>
        )}
      </div>
      {role === "host" && timerOpen && (
        <TimerTool state={state} pushState={pushState} onClose={() => setTimerOpen(false)} />
      )}
    </div>
  );
}

/* 任何一處 render 例外原本都會讓整頁變成空白，現場沒人知道發生什麼事。
   這裡兜住例外並提供兩條退路：重新載入，或清掉本機資料後重新載入
   （本機資料含玩家身分與已加入的房間，資料本身壞掉時需要這條路）。 */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("畫面發生錯誤：", error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    const box = { background: COLORS.panel, border: `1px solid ${COLORS.red}` };
    return (
      <div className="min-h-screen flex items-center justify-center px-6" style={{ background: COLORS.bg, fontFamily: "'Noto Sans TC', sans-serif" }}>
        <div className="max-w-sm w-full rounded-2xl p-6 text-center" style={box}>
          <div className="text-lg font-black mb-2" style={{ color: COLORS.ink, fontFamily: "'Noto Serif TC', serif" }}>畫面出了點問題</div>
          <p className="text-xs mb-5" style={{ color: COLORS.inkSoft }}>
            遊戲進度存在伺服器上，重新載入通常就會恢復。若反覆出現，再試下面第二個按鈕。
          </p>
          <div className="flex flex-col gap-2">
            <button onClick={() => location.reload()} className="px-4 py-2.5 rounded-full font-bold text-sm" style={{ background: COLORS.yellow, color: "#241A14" }}>
              重新載入
            </button>
            <button
              onClick={() => { try { localStorage.clear(); } catch (e) {} location.reload(); }}
              className="px-4 py-2.5 rounded-full text-sm"
              style={{ border: `1px solid ${COLORS.blue}`, color: COLORS.inkSoft }}
            >
              清除本機資料並重新載入
            </button>
          </div>
          <pre className="text-[10px] mt-4 text-left overflow-x-auto" style={{ color: COLORS.inkSoft, opacity: 0.7 }}>{String(this.state.error && this.state.error.message)}</pre>
        </div>
      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
